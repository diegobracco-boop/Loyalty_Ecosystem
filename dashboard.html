       + ' onclick="setMetricsCmp(\'' + e + '\',event)">' + scenarioLabel(e) + '</button>';
  });
  return h + '</div>';
}
// Línea de control dentro de la tarjeta: Budget / Run Rate + ayuda de la leyenda.
function goalCtlHtml() {
  return '<div class="goal-ctl"><span class="ratio-controls-lbl">Proyección</span>' + goalSegHtml()
    + '<span class="goal-hint">Clic en la leyenda para ocultar o mostrar cada barra</span></div>';
}
// Fila de % vs proyección debajo del gráfico (la llena buildBarChart en 'yob-<id>').
function goalRowHtml(id) {
  return '<div class="dtable-row"><div class="dtable-label">vs ' + scenarioLabel(METRICS_CMP) + ' %</div><div class="yoy-row" id="yob-' + id + '"></div></div>';
}
function goalSeries(goalMap, fy) { return fiscalSeries(goalMap, goalMap, fy.cy, fy.ly, fy.cy); }

// Partner del Excel -> programa del dashboard (resto = Partners). El real del
// programa ya excluye los puntos 'Rewards & Benefits' del partner (son Puntos
// Manuales), igual que el Budget (confirmado 12-oct, caso ICBC).
var PROY_PARTNER_PROG = { 'ICBC': 'Cobrand', 'INVEX': 'Cobrand' };
// Programa del dashboard -> Tipo_punto del Excel (solapa Redenciones).
// 'Pasaporte D!' en el Budget = general + Cobrand + Partners, el mismo universo
// que la redención de Pasaporte D! del dashboard (getProgramsFromReden).
// IFOOD = bolsa total, todos los tipos (confirmado 12-oct).
var PROY_REDEN_PROG = { 'Pasaporte D!': ['Pasaporte D!'], 'IFOOD': ['IFOOD'],
                        'Puntos Manuales': ['Puntos R&B'], 'Acciones Marketing': ['FORTUNE', 'PONTOSBR'] };

// ---- Índice de la proyección elegida: idx[bloque][país][clave][YYYY-MM] = valor.
var _PIDX = null;
function proyIdx() {
  if (_PIDX && _PIDX.esc === METRICS_CMP && _PIDX.src === RAW.proy) return _PIDX.idx;
  var idx = {};
  expand(RAW.proy).forEach(function(p) {
    if (p.escenario !== METRICS_CMP) return;
    var b = idx[p.bloque] = idx[p.bloque] || {}, c = b[p.pais] = b[p.pais] || {}, k = c[p.clave] = c[p.clave] || {};
    k[p.ym] = (k[p.ym] || 0) + (+p.valor || 0);
  });
  _PIDX = { esc: METRICS_CMP, src: RAW.proy, idx: idx, cache: {} };
  return idx;
}
function pv(b, dk, k, ym) { return (((proyIdx()[b] || {})[dk] || {})[k] || {})[ym]; }
function goalKeys(country) { return isTotal(country) ? COUNTRY_DATAKEYS : [country.dataKey]; }
function addTo(m, ym, v) { m[ym] = (m[ym] || 0) + v; }
function anyKey(o) { return Object.keys(o).length > 0; }

// Cobrand / Partners (Input_budget.xlsx, Cobrands_Partners):
//   $        = puntos × precio facturación (USD/pt; el del partner o el 'Todos' del país)
//   revenue  = puntos × (precio facturación − SSP)
function goalPartnerMaps(prog, country) {
  if ((prog !== 'Cobrand' && prog !== 'Partners') || !RAW.proy || !cmpGoalActive()) return null;
  var idx = proyIdx(), out = { pts: {}, usd: {}, br: {} };
  goalKeys(country).forEach(function(dk) {
    var cl = (idx.acum_partner || {})[dk] || {};
    Object.keys(cl).forEach(function(k) {
      if ((PROY_PARTNER_PROG[k] || 'Partners') !== prog) return;
      Object.keys(cl[k]).forEach(function(ym) {
        var pts = cl[k][ym];
        var pr = pv('precio_partner', dk, k, ym);
        if (pr === undefined) pr = pv('precio_partner', dk, 'Todos', ym) || 0;
        var ssp = pv('ssp', dk, 'SSP', ym) || 0;
        addTo(out.pts, ym, pts); addTo(out.usd, ym, pts * pr); addTo(out.br, ym, pts * (pr - ssp));
      });
    });
  });
  return anyKey(out.pts) ? out : null;
}
// Redenciones: $ = puntos × SSP_Red del país/mes.
function goalRedenMaps(prog, country) {
  var ks = PROY_REDEN_PROG[prog];
  if (!ks || !RAW.proy || !cmpGoalActive()) return null;
  var idx = proyIdx(), out = { pts: {}, usd: {} };
  goalKeys(country).forEach(function(dk) {
    var cl = (idx.reden || {})[dk] || {};
    ks.forEach(function(k) {
      Object.keys(cl[k] || {}).forEach(function(ym) {
        var pts = cl[k][ym];
        addTo(out.pts, ym, pts); addTo(out.usd, ym, pts * (pv('ssp', dk, 'SSP_Red', ym) || 0));
      });
    });
  });
  return anyKey(out.pts) ? out : null;
}
// Pasaporte D! acumulación, por país × producto × viaje × mes:
//   puntos = regla de acumulación × penetración de GB × GB          (Excel B2C-SITE; GB del P&L)
//   R      = GB × penetración × (Up Front + Fees + Commercial Discounts) / GB del producto
//   $      = (puntos × SSP) / (puntos × SSP + R) × R                 (mismo reparto DRO que el real)
// GB y Up Front/Fees/CD salen del escenario del P&L (RAW.budget / RAW.runrate, B2C, por Producto).
// También devuelve el ratio implícito por producto (Σ puntos / Σ GB penetrado), comparable con el
// ratio real (puntos / GB de las reservas que acumulan).
function goalPdAcum(country) {
  if (!RAW.proy || !cmpGoalActive() || !RAW[METRICS_CMP]) return null;
  proyIdx();
  var ck = 'pd|' + country.key;
  if (_PIDX.cache[ck] !== undefined) return _PIDX.cache[ck];
  var keys = goalKeys(country), gb = {}, uf = {};   // gb[dk][prod][ym][viaje], uf[dk][prod][ym]
  expandBaseline(RAW[METRICS_CMP]).forEach(function(row) {
    var dk = (row['Pais'] || '').toLowerCase();
    if (keys.indexOf(dk) === -1) return;
    var n1 = (row['P&L N1'] || '').toLowerCase(), prod = (row['Producto'] || '').toLowerCase().trim();
    var ym = (row['Fecha'] || '').substring(0, 7), v = parseFloat(row['Monto USD']) || 0;
    var viaje = n1 === 'gross bookings domestic' ? 'Domestic' : n1 === 'gross bookings international' ? 'International' : null;
    if (viaje) {
      var g = ((gb[dk] = gb[dk] || {})[prod] = gb[dk][prod] || {});
      g[ym] = g[ym] || {}; g[ym][viaje] = (g[ym][viaje] || 0) + v;
    } else if (n1 === 'up front incentives' || n1 === 'fees' || n1 === 'commercial discounts') {
      var u = ((uf[dk] = uf[dk] || {})[prod] = uf[dk][prod] || {});
      u[ym] = (u[ym] || 0) + v;
    }
  });
  var idx = proyIdx(), out = { pts: {}, usd: {}, rNum: {}, rDen: {} };
  keys.forEach(function(dk) {
    var rk = (idx.ratio || {})[dk] || {};
    Object.keys(rk).forEach(function(pk) {           // pk = 'Producto|Viaje'
      var parts = pk.split('|'), prodName = parts[0], viaje = parts[1];
      var gp = ((gb[dk] || {})[prodName.toLowerCase()]) || {};
      Object.keys(rk[pk]).forEach(function(ym) {
        var regla = rk[pk][ym], pen = pv('penet', dk, pk, ym), g = (gp[ym] || {})[viaje] || 0;
        if (pen === undefined || !g) return;
        var gTot = (gp[ym].Domestic || 0) + (gp[ym].International || 0);
        var take = gTot ? ((((uf[dk] || {})[prodName.toLowerCase()]) || {})[ym] || 0) / gTot : 0;
        var pts = regla * pen * g, R = g * pen * take, PV = pts * (pv('ssp', dk, 'SSP', ym) || 0);
        addTo(out.pts, ym, pts);
        addTo(out.usd, ym, (PV + R) ? PV / (PV + R) * R : 0);
        var rn = out.rNum[prodName] = out.rNum[prodName] || {}, rd = out.rDen[prodName] = out.rDen[prodName] || {};
        addTo(rn, ym, pts); addTo(rd, ym, g * pen);
      });
    });
  });
  return (_PIDX.cache[ck] = anyKey(out.pts) ? out : null);
}
// Serie de comparación de acumulación / redención según el modo ('Q' puntos, 'USD' $).
function goalAcumMap(prog, country, mode) {
  var m = prog === 'Pasaporte D!' ? goalPdAcum(country) : goalPartnerMaps(prog, country);
  return m ? (mode === 'USD' ? m.usd : m.pts) : null;
}
function goalRedenMap(prog, country, mode) {
  var m = goalRedenMaps(prog, country);
  return m ? (mode === 'USD' ? m.usd : m.pts) : null;
}
function goalBrMap(prog, country) { var m = goalPartnerMaps(prog, country); return m ? m.br : null; }
function goalBkMap(country) {
  if (!RAW.proy || !cmpGoalActive()) return null;
  var idx = proyIdx(), out = {};
  goalKeys(country).forEach(function(dk) {
    var cl = ((idx.breakage || {})[dk] || {})[''] || {};
    Object.keys(cl).forEach(function(ym){ addTo(out, ym, cl[ym]); });
  });
  return anyKey(out) ? out : null;
}
// Ratio implícito del Budget por producto ('Total' = todos los productos): Σ puntos / Σ GB penetrado.
function goalRatioMap(product, country) {
  var m = goalPdAcum(country);
  if (!m) return null;
  var prods = product === 'Total' ? Object.keys(m.rNum) : [product];
  var num = {}, den = {}, out = {};
  prods.forEach(function(p) {
    Object.keys(m.rNum[p] || {}).forEach(function(ym){ addTo(num, ym, m.rNum[p][ym]); addTo(den, ym, m.rDen[p][ym]); });
  });
  Object.keys(num).forEach(function(ym){ if (den[ym]) out[ym] = num[ym] / den[ym]; });
  return anyKey(out) ? out : null;
}
// Último mes CERRADO de reales (el mes en curso está incompleto).
function proyLastClosedYm() {
  var ld = ((RAW.acum_cy || {}).meta || {}).last_date;
  if (!ld) return '';
  var d = new Date(ld + 'T00:00:00'), next = new Date(d.getTime() + 864e5);
  if (next.getMonth() !== d.getMonth()) return ld.substring(0, 7);
  var p = new Date(d.getFullYear(), d.getMonth() - 1, 1);
  return p.getFullYear() + '-' + ('0' + (p.getMonth() + 1)).slice(-2);
}
// Subtítulo de KPI: real del FY en curso vs referencia, ambos sobre los MISMOS
// meses CERRADOS (dentro del rango de fechas) — nunca un FY a medio año contra uno
// completo ni un mes a medio cargar. realMap: {ym: v}. goalMap = proyección
// {ym: v} o null -> se compara contra el mismo mes del FY anterior en realMap.
function ytdVs(realMap, goalMap) {
  var fy = fyYears(), r = getRange(), last = proyLastClosedYm(), real = 0, ref = 0;
  FISCAL_MONTHS.forEach(function(mm) {
    var ym = fiscalCalYear(mm, fy.cy) + '-' + mm;
    if (!last || ym > last || !inRange(ym, r.from, r.to)) return;
    var lyYm = fiscalCalYear(mm, fy.ly) + '-' + mm;
    real += Math.abs((realMap || {})[ym] || 0);
    ref  += Math.abs(goalMap ? (goalMap[ym] || 0) : ((realMap || {})[lyYm] || 0));
  });
  return 'vs ' + (goalMap ? scenarioLabel(METRICS_CMP) : fyLbl(fy.ly)) + ' ' + fmtPct(real, ref)
       + ' · YTD ' + (last ? fmtMonthLbl(last) : '—');
}
// {ym: campo} de un mapa acM/rdM[prog]
function pick(m, f) { var o = {}; Object.keys(m || {}).forEach(function(ym){ o[ym] = m[ym][f]; }); return o; }

function renderMetrics(country, m) {
  var suffix = country.key;
  var programs = programsForCountry(country.key);

  var el = document.getElementById('metrics-' + suffix);
  if (!el) return;

          + 'Estás viendo el <strong>TOTAL agregado de los ' + COUNTRY_DATAKEYS.length + ' países</strong> (suma de todas las solapas de país).'
          + '</div>';
  }

  // Indice de programas: chips que saltan a cada seccion (Miembros + programas + Breakage).

  html += '<button class="prog-chip" type="button" onclick="jumpTo(\'sec-miembros-' + suffix + '\')">Miembros</button>';
  programs.forEach(function(prog) {
    html += '<button class="prog-chip" type="button" onclick="jumpTo(\'' + progSecId(prog, suffix) + '\')">' + prog + '</button>';
  });
  html += '<button class="prog-chip" type="button" onclick="jumpTo(\'sec-breakage-' + suffix + '\')">Breakage</button>';
  html += '</div>';

  // ---- Miembros del programa (arriba de todo: métrica headline) ----
  var mb = m.mb || { total: 0 };
  var mbAltasId = 'ch-mb-altas-' + suffix;
  var mbStockId = 'ch-mb-stock-' + suffix;
  var mbTierId  = 'ch-mb-tier-'  + suffix;
  var mbId = 'sec-miembros-' + suffix;
  var mbOpen = progOpen(mbId, true);
  html += '<div class="prog-section' + (mbOpen ? '' : ' is-collapsed') + '" id="' + mbId + '">';
  html += '<div class="prog-title" ' + progTitleAttrs(mbId, suffix, mbOpen) + '>'
    + '<span>Miembros del programa</span><span class="prog-caret" aria-hidden="true">&#9662;</span></div>';
  html += '<div class="prog-body" id="' + mbId + '-body">';
  if (!mb.total) {
    html += '<div class="empty">Sin datos de miembros' + (RAW.miembros ? '' : ' — loyalty_miembros.json no disponible') + '</div>';
  } else {
    html += '<div class="kpi-row">';

    html += '<div class="cc" style="margin-bottom:14px"><div class="ct">Altas por mes — mes de enrolment (' + fyLbl(fyYears().cy) + ' vs ' + fyLbl(fyYears().ly) + ')</div><div class="cw"><canvas id="' + mbAltasId + '"></canvas></div>'

    html += '<div class="cc" style="margin-bottom:14px"><div class="ct">Miembros acumulados a fin de mes (' + fyLbl(fyYears().cy) + ' vs ' + fyLbl(fyYears().ly) + ')</div><div class="cw"><canvas id="' + mbStockId + '"></canvas></div>'
      + '<div class="dtable-row"><div class="dtable-label">YoY %</div><div class="yoy-row" id="yoy-' + mbStockId + '"></div></div></div>';
    html += '<div class="cc"><div class="ct">Altas por mes y tier — año fiscal actual</div><div class="cw"><canvas id="' + mbTierId + '"></canvas></div></div>';
  }
  html += '</div></div>';

  var cdd = m.cdd || { activos: 0, byPlan: {}, stockByPlanYm: {}, altasByYm: {}, bajasByYm: {} };
  var ifd = m.ifd || { total: 0, byTipo: {}, altasByTipoYm: {}, altasByYm: {} };

  programs.forEach(function(prog) {
    var acCY = m.acCY.byProg[prog] || { pts: 0, usd: 0, br: 0 };
    var acLY = m.acLY.byProg[prog] || { pts: 0, usd: 0, br: 0 };
    var rdCY = m.rdCY.byProg[prog] || { pts: 0, usd: 0 };
    var rdLY = m.rdLY.byProg[prog] || { pts: 0, usd: 0 };
    var canvasId = 'ch-' + prog.replace(/[^a-z0-9]/gi, '') + '-' + suffix;
    var canvasRdId = 'ch-rd-' + prog.replace(/[^a-z0-9]/gi, '') + '-' + suffix;
    var mode = getSecMode(suffix, prog);

    var progId = progSecId(prog, suffix);
    var progIsOpen = progOpen(progId, prog === 'Pasaporte D!');
    html += '<div class="prog-section' + (progIsOpen ? '' : ' is-collapsed') + '" id="' + progId + '">';
    html += '<div class="prog-title" ' + progTitleAttrs(progId, suffix, progIsOpen) + '>'
      + '<span>' + prog + '</span>'
      + '<div class="prog-title-right">'
      +   '<div class="seg seg-sm" data-suffix="' + suffix + '" data-prog="' + prog + '">'
      +     '<button class="seg-btn' + (mode === 'USD' ? ' active' : '') + '" data-v="USD" type="button" onclick="setSecMode(this,event)">$</button>'
      +     '<button class="seg-btn' + (mode === 'Q' ? ' active' : '') + '" data-v="Q" type="button" onclick="setSecMode(this,event)">Q</button>'
      +   '</div>'
      +   '<span class="prog-caret" aria-hidden="true">&#9662;</span>'
      + '</div></div>';
    html += '<div class="prog-body" id="' + progId + '-body">';

    // KPI row
    // KPIs: vs FY anterior, o vs Budget/Run Rate (solo puntos, YTD a mes cerrado)
    // si hay proyección para ese programa y está elegida (ver METRICS_CMP).
    var gAcQ = goalAcumMap(prog, country, 'Q'), gAcU = goalAcumMap(prog, country, 'USD');
    var gRdQ = goalRedenMap(prog, country, 'Q'), gRdU = goalRedenMap(prog, country, 'USD');
    var gBrK = goalBrMap(prog, country);
    var gAcK = mode === 'USD' ? gAcU : gAcQ, gRdK = mode === 'USD' ? gRdU : gRdQ;
    var acMp = m.acM[prog], rdMp = m.rdM[prog];
    var vs2 = function(real, goal){ return ytdVs(real) + (goal ? '<br>' + ytdVs(real, goal) : ''); };
    html += '<div class="kpi-row">'
      + kpiHtml('Puntos Acumulados', fmtPts(acCY.pts), vs2(pick(acMp, 'pts'), gAcQ), 'var(--accent)')
      + kpiHtml('Valor Acumulado', fmtUSD(Math.abs(acCY.usd)), vs2(pick(acMp, 'usd'), gAcU), '#976cf6')
      + kpiHtml('Puntos Redimidos', fmtPts(Math.abs(rdCY.pts)), vs2(pick(rdMp, 'pts'), gRdQ), 'var(--red)')
      + kpiHtml('Valor Redimido', fmtUSD(Math.abs(rdCY.usd)), vs2(pick(rdMp, 'usd'), gRdU), '#029687')
      + (prog === 'Cobrand' || prog === 'Partners'
         ? kpiHtml(prog === 'Partners' ? 'Partner Revenue' : 'Bank Revenue', fmtUSD(Math.abs(acCY.br)), vs2(pick(acMp, 'br'), gBrK), '#029687')
         : '')
      + '</div>';

    // Charts (evolutivo, anio fiscal completo, CY vs LY + YoY%)
    // Apilados (uno debajo del otro, full width) para que 12 meses no queden apretados.
    // Pasaporte D!: toggle "Total / Por Tier" junto al título (ver getAcumView/setAcumView).
    // "Por Tier" respeta el toggle Q/$ de la sección (acum_usd_base por tier viene
    // prorrateado desde loyalty_sync.py::enrich_acum_tier_usd, 14-sep).
    var acTitleHtml = '<div class="ct">' + acTitle + '</div>';
    if (prog === 'Pasaporte D!') {
      var aView = getAcumView(suffix);
      var acTitleTier = 'Acumulaciones — ' + (mode === 'USD' ? 'Valor' : 'Puntos') + ' por mes y tier';
      acTitleHtml = '<div class="sub-title-row" style="margin-bottom:6px">'
        + '<div class="ct" style="margin-bottom:0">' + (aView === 'tier' ? acTitleTier : acTitle) + '</div>'
        + '<div class="seg seg-sm">'
        +   '<button class="seg-btn' + (aView === 'total' ? ' active' : '') + '" type="button" onclick="setAcumView(\'' + suffix + '\',\'total\')">Total</button>'
        +   '<button class="seg-btn' + (aView === 'tier'  ? ' active' : '') + '" type="button" onclick="setAcumView(\'' + suffix + '\',\'tier\')">Por Tier</button>'
        + '</div></div>';
    }
    // Cobrand / Partners: toggle "Total / Costo y Ganancia" — fusiona el chart de
    // Acumulaciones con lo que antes era el chart aparte de Bank/Partner Revenue
    // (costo SSP vs margen). Mismo total, dos lecturas del mismo mes.
    // El toggle solo tiene sentido en vista $ — "Costo (SSP)" y margen son montos
    // en USD, no hay forma de descomponer una vista en puntos así.
    var brLabel = prog === 'Partners' ? 'Partner Revenue' : 'Bank Revenue';
    if ((prog === 'Cobrand' || prog === 'Partners') && mode === 'USD') {
      var brView = getBrView(suffix, prog);
      var acTitleMargen = brLabel + ' — costo (SSP) vs margen, por mes';
      acTitleHtml = '<div class="sub-title-row" style="margin-bottom:6px">'
        + '<div class="ct" style="margin-bottom:0">' + (brView === 'margen' ? acTitleMargen : acTitle) + '</div>'
        + '<div class="seg seg-sm">'
        +   '<button class="seg-btn' + (brView === 'total'  ? ' active' : '') + '" type="button" onclick="setBrView(\'' + suffix + '\',\'' + prog + '\',\'total\')">Total</button>'
        +   '<button class="seg-btn' + (brView === 'margen' ? ' active' : '') + '" type="button" onclick="setBrView(\'' + suffix + '\',\'' + prog + '\',\'margen\')">Costo y Ganancia</button>'
        + '</div></div>';
    }
    // 3ra barra: no en Pasaporte 'Por Tier' ni en Cobrand/Partners 'Costo y Ganancia' (gráfico partido).
    var acGoalOn = !!gAcK && !(prog === 'Pasaporte D!' && aView === 'tier')
      && !((prog === 'Cobrand' || prog === 'Partners') && mode === 'USD' && getBrView(suffix, prog) === 'margen');
    html += '<div class="cc" style="margin-bottom:14px">' + acTitleHtml
      + (acGoalOn ? goalCtlHtml() : '')
      + '<div class="cw"><canvas id="' + canvasId + '"></canvas></div>'
      + '<div class="dtable-row"><div class="dtable-label">YoY %</div><div class="yoy-row" id="yoy-' + canvasId + '"></div></div>'
      + (acGoalOn ? goalRowHtml(canvasId) : '')
      + '</div>'
      + (prog === 'Pasaporte D!' && aView === 'tier' ? '<div class="cc" style="margin-bottom:14px"><div class="ct" style="font-size:12px;color:#64748b;margin-bottom:4px">Mix por tier (%)</div><div class="cw" style="height:160px"><canvas id="ch-mix-' + suffix + '"></canvas></div></div>' : '')
      + (prog === 'Pasaporte D!' && aView === 'tier' ? '<div style="margin-bottom:14px"><div class="ct" style="font-size:12px;color:#64748b;margin-bottom:8px">Ratio de acumulación por tier — puntos por $ de GB, año fiscal ' + fyLbl(fyYears().cy) + ' vs ' + fyLbl(fyYears().ly) + '</div><div class="kpi-row" id="tier-avg-' + suffix + '"></div></div>' : '');
    var rdGoalOn = !!gRdK;
    html += '<div class="cc" style="margin-bottom:14px"><div class="ct">' + rdTitle + '</div>'
      + (rdGoalOn ? goalCtlHtml() : '')
      + '<div class="cw"><canvas id="' + canvasRdId + '"></canvas></div>'
      + '<div class="dtable-row"><div class="dtable-label">YoY %</div><div class="yoy-row" id="yoy-' + canvasRdId + '"></div></div>'
      + (rdGoalOn ? goalRowHtml(canvasRdId) : '')
      + '<div class="dtable-row"><div class="dtable-label">Precio ' + fyLbl(fyYears().ly) + ' / YoY</div><div class="ppr-row" id="ppr-' + canvasRdId + '"></div></div>'
      + '</div>';

    // ---- Ratio de acumulacion (pts/GB por producto): va DENTRO de "Pasaporte D!" ----
    // Vista "Por Período" (original): Mes/Año + selector de período, barras de
    // todos los productos comparando el período elegido vs el inmediato anterior.
    // Vista "Por Producto" (22-sep, diseño validado con ux-designer): elegís un
    // producto (o "Total") y ves su evolución mensual en el año fiscal completo,
    // mismo patrón CY/LY que el resto de gráficos evolutivos (buildBarChart) — el
    // toggle Mes/Año y el período puntual no aplican acá (siempre año fiscal
    // completo), así que se ocultan y el <select> pasa a ser de producto.
    if (prog === 'Pasaporte D!') {
      var rView = getRatioView(suffix);
      var rMode = getRatioMode(suffix);
      html += '<div class="sub-block"><div class="sub-title-row">'
        + '<div class="sub-title">Ratio de acumulación — puntos por $ de GB, por producto</div>'
        + '<div class="ratio-controls">'
        +   '<span class="ratio-controls-lbl">Vista</span>'
        +   '<div class="seg seg-sm">'
        +     '<button class="seg-btn' + (rView === 'periodo'  ? ' active' : '') + '" type="button" onclick="setRatioView(\'' + suffix + '\',\'periodo\')">Por Período</button>'
        +     '<button class="seg-btn' + (rView === 'producto' ? ' active' : '') + '" type="button" onclick="setRatioView(\'' + suffix + '\',\'producto\')">Por Producto</button>'
        +   '</div>'
        +   (rView === 'periodo'
             ? '<span class="ratio-controls-lbl">Ver por</span>'
               + '<div class="seg seg-sm">'
               +   '<button class="seg-btn' + (rMode === 'month' ? ' active' : '') + '" type="button" onclick="setRatioMode(\'' + suffix + '\',\'month\')">Mes</button>'
               +   '<button class="seg-btn' + (rMode === 'year'  ? ' active' : '') + '" type="button" onclick="setRatioMode(\'' + suffix + '\',\'year\')">Año</button>'
               + '</div>'
               + '<span class="ratio-controls-lbl">Período</span>'
               + '<select class="ratio-sel" title="Mes o año fiscal a graficar en color; el período inmediato anterior se muestra en gris" onchange="setRatioPeriod(\'' + suffix + '\', this.value)">' + ratioPeriodOptionsHtml(suffix, country) + '</select>'
             : '<span class="ratio-controls-lbl">Producto</span>'
               + '<select class="ratio-sel" title="Elegí un producto o \'Total\' para ver el agregado de los 7" onchange="setRatioProduct(\'' + suffix + '\', this.value)">' + ratioProductOptionsHtml(suffix) + '</select>')
        + '</div></div>'
        + '<div class="ratio-hint">' + (rView === 'periodo'
             ? 'Barra clara = período anterior · Barra de color = período elegido · "Total" = ratio agregado de los 7 productos'
             : 'Barras = ratio mensual del producto elegido (' + fyLbl(fyYears().cy) + ') · barra clara = mismo mes de ' + fyLbl(fyYears().ly))
        + '</div>'
        + (function(){
            var on = rView === 'producto' && !!goalRatioMap(getRatioProduct(suffix), country);
            return '<div class="cc">' + (on ? goalCtlHtml() : '')
              + '<div class="cw"><canvas id="ch-ratio-' + suffix + '"></canvas></div>'
              + (on ? goalRowHtml('ch-ratio-' + suffix) : '') + '</div>';
          })()
        + (rView === 'producto' && getRatioProduct(suffix) !== 'Total'
           ? '<div class="cc" style="margin-top:14px"><div class="ct">Total — puntos por $ de GB, todos los productos, por mes</div><div class="cw"><canvas id="ch-ratio-total-' + suffix + '"></canvas></div></div>'
           : '')
        + '</div>';
    }

    // ---- Participación del channel iFood en Pasaporte D! (100% stacked, por mes):
    // movido acá desde la sección de programa "IFOOD" — es una vista de Pasaporte D!
    // (de dónde vienen esos puntos), no de enrolamiento/stock de iFood. Solo tiene
    // sentido en Brasil (único país con volumen de iFood) y en TOTAL (agregado).
    if (prog === 'Pasaporte D!' && RAW.acum_channel && (country.key === 'total' || country.key === 'brasil')) {
      var chCanId = 'ch-acum-ch-' + suffix;
      var chTitle = country.key === 'total'
        ? 'Participación del channel iFood en Pasaporte D! — todos los países, por mes'
        : 'Participación del channel iFood en Pasaporte D! — ' + country.label + ', por mes';
      html += '<div class="sub-block"><div class="sub-title">Pasaporte D! vía iFood</div><div class="cc">'
            + '<div class="ct">' + chTitle + '</div>'
            + '<div class="cw"><canvas id="' + chCanId + '"></canvas></div>'
            + '</div></div>';
    }

    // ---- Penetracion de GB (% de GB pagado con puntos, por producto): va DENTRO de
    // "Pasaporte D!", no como seccion aparte (antes era su propio prog-section colapsable
    // sin chip de navegacion propio — se integro como sub-block junto a Ratio de acumulacion).
    // Rediseño 18-sep: antes era un line chart con selector de 1 producto a la vez (7 botones,
    // 3 lineas por vista — CY/LY/Total ref) — mala comparacion entre productos porque solo se
    // veia uno por vez, y el reference "Total" punteado se confundia con la linea LY del mismo
    // color. Con 7 productos activos, un multi-line de todos a la vez tampoco serviría (ladder
    // de series de la skill dataviz: >6 series es techo de token categórico). Se reemplaza por
    // un heatmap (producto × mes fiscal) — magnitud por color, todos los productos visibles a
    // la vez, comparación directa fila contra fila. ----
    if (prog === 'Pasaporte D!') {
      html += '<div class="sub-block"><div class="sub-title">Penetración GB Acum — % del GB que acumula puntos, por producto</div>';
      if (!RAW.penet) {
        html += '<div class="empty">loyalty_penetracion_gb.json no disponible</div>';
      } else {
        var fy = fyYears();
        function _penetSeries(yearKey, prod) {
          var byYm = {};
          penetRows(country).forEach(function(r) {
            var rYm = (r.ym || '').substring(0, 7);
            var rYr = parseInt(rYm.substring(0, 4));
            if (rYm.length !== 7 || fyStartYear(rYm) !== yearKey) return;
            if (prod !== 'Total' && r.grupo_pnl !== prod) return;
            byYm[rYm] = byYm[rYm] || { gt: 0, gp: 0 };
            byYm[rYm].gt += (+r.gb_total      || 0);
            byYm[rYm].gp += (+r.gb_con_puntos || 0);
          });
          return FISCAL_MONTHS.map(function(mm) {
            var yr = fiscalCalYear(mm, yearKey);
            var ym = yr + '-' + mm;
            var d = byYm[ym];
            return (d && d.gt) ? Math.round(d.gp / d.gt * 1000) / 10 : null;
          });
        }
        var heatProds = PENET_PRODUCTS.slice(1); // sin 'Total', va aparte al pie
        var cyByProd = {}, lyByProd = {};
        PENET_PRODUCTS.forEach(function(p) {
          cyByProd[p] = _penetSeries(fy.cy, p);
          lyByProd[p] = _penetSeries(fy.ly, p);
        });
        var totalCy = cyByProd['Total'], totalLy = lyByProd['Total'];
        var anyVal = heatProds.some(function(p){ return cyByProd[p].some(function(v){ return v != null; }); });
        if (!anyVal) {
          html += '<div class="empty">Sin datos</div>';
        } else {
          var heatMax = Math.max.apply(null, heatProds.map(function(p){
            return Math.max.apply(null, cyByProd[p].map(function(v){ return v || 0; }));
          }));
          heatMax = Math.max(10, Math.ceil(heatMax / 10) * 10);
          html += '<div class="cc"><div class="ct">% del GB que acumula puntos — por mes, todos los productos</div>'
                + '<div class="tbl-scroll"><table class="heat-table"><caption class="sr-only">Penetración GB Acum (% de GB de reservas con acumulación de puntos) por producto y mes fiscal</caption><thead><tr><th class="heat-rowlabel"><span class="sr-only">Producto</span></th>'
                + FISCAL_LABELS.map(function(l){ return '<th>' + l + '</th>'; }).join('')
                + '</tr></thead><tbody>'
                + heatProds.map(function(p){
                    return '<tr><td class="heat-rowlabel">' + p + '</td>'
                      + cyByProd[p].map(function(v, i){ return heatCellHtml(v, heatMax, lyByProd[p][i]); }).join('')
                      + '</tr>';
                  }).join('')
                + '<tr class="heat-total"><td class="heat-rowlabel">Total</td>'
                + totalCy.map(function(v, i){ return heatCellHtml(v, heatMax, totalLy[i], true); }).join('')
                + '</tr></tbody></table></div>'
                + heatLegendHtml(heatMax)
                + '</div>';
        }
      }
      html += '</div>';
    }

    // ---- Suscripción Club Despegar: va DENTRO de la sección de programa "Club Despegar" ----
    if (prog === 'Club Despegar') {
      html += '<div class="sub-block"><div class="sub-title">Suscripción — miembros por plan</div>';
      if (!cdd.activos && !Object.keys(cdd.altasByYm).length) {
        html += '<div class="empty">Sin datos de suscripción' + (RAW.club ? '' : ' — loyalty_club_despegar.json no disponible') + '</div>';
      } else {
        html += '<div class="kpi-row">';
        html += kpiHtml('Miembros suscriptos', fmtPts(cdd.activos), 'base activa (status ACTIVE)', 'var(--accent)');
        CDD_PLANS.forEach(function(p){
          var v = cdd.byPlan[p] || 0;
          if (!v && p === 'Otro') return;
          var pct = cdd.activos ? (v / cdd.activos * 100).toFixed(1) + '%' : '—';
          html += kpiHtml(p, fmtPts(v), pct + ' del total', CDD_PLAN_COLOR_SOLID[p]);
        });
        html += '</div>';
        html += '<div class="cc" style="margin-bottom:14px"><div class="ct">Miembros suscriptos por mes y plan — base activa acumulada (' + fyLbl(fyYears().cy) + ', línea = total ' + fyLbl(fyYears().ly) + ')</div>'
          + '<div class="cw"><canvas id="ch-cdd-stock-' + suffix + '"></canvas></div>'
          + '<div class="dtable-row"><div class="dtable-label">YoY %</div><div class="yoy-row" id="yoy-ch-cdd-stock-' + suffix + '"></div></div></div>';
        html += cddFlowTable(cdd, fyYears(), suffix);
      }
      html += '</div>';
    }

    // ---- Enrolados iFood: va DENTRO de la sección de programa "IFOOD" ----
    if (prog === 'IFOOD') {
      html += '<div class="sub-block"><div class="sub-title">Enrolados</div>';
      if (!ifd.total) {
        html += '<div class="empty">Sin datos de enrolados' + (RAW.ifood ? '' : ' — loyalty_ifood_enroll.json no disponible') + '</div>';
      } else {
        html += '<div class="kpi-row">';
        html += kpiHtml('iFood enrol', fmtPts(ifd.byTipo['iFood enrol'] || 0), 'initiative cross_cashback', '#976cf6');
        html += kpiHtml('Club iFood', fmtPts(ifd.byTipo['Club iFood'] || 0), 'initiative closed_loop_discount', 'var(--red)');
        html += '</div>';
        html += '<div class="cc"><div class="ct">Altas por mes — iFood enrol + Club iFood (' + fyLbl(fyYears().cy) + ', línea = total ' + fyLbl(fyYears().ly) + ')</div>'
          + '<div class="cw"><canvas id="ch-ifd-altas-' + suffix + '"></canvas></div>'
          + '<div class="dtable-row"><div class="dtable-label">YoY %</div><div class="yoy-row" id="yoy-ch-ifd-altas-' + suffix + '"></div></div></div>';
      }
      html += '</div>';

      // ---- Stock de puntos vía iFood: sub-bloque aparte (no es enrolamiento) ----
      // El gráfico de "Participación del channel iFood en Pasaporte D!" se movió
      // a la sección de programa "Pasaporte D!" (más abajo) — es una vista de
      // Pasaporte D!, no de enrolamiento/stock de iFood.
      if (RAW.stock_ifood) {
        html += '<div class="sub-block"><div class="sub-title">Flujo y stock de puntos</div>';
        var stkCanId = 'ch-stock-if-' + suffix;
        html += '<div class="cc">'
              + '<div class="ct ct-no-mb">Stock de puntos iFood en la calle — ' + (mode === 'USD' ? 'USD' : 'puntos') + ' a fin de mes</div>'
              + '<div class="ct-sub">Saldo = Acumulación &minus; Redención &minus; Vencimiento (acumulado)</div>'
              + '<div class="cw"><canvas id="' + stkCanId + '"></canvas></div>'
              + '</div>'
              + '<div style="margin:2px 0 0;font-size:11px;color:var(--muted)">Excluye IFOOD_WELCOME_CLUBE / IFO_WE_CLU</div>';
        html += '</div>';
      }
    }

    // ---- Desglose por point_type: va DENTRO de "Acciones Marketing" ----
    // Respeta el toggle Q/$ de la sección (mode ya resuelto arriba). Barra apilada
    // por mes, una serie por point_type (FORTUNE/Mkt_App/lo que traiga el
    // diccionario ese mes — data-driven, ver programPointTypes()). Sin línea LY
    // superpuesta: sumando las series ya se ve el total CY, y sumar una 2da línea
    // (LY total) encima de una pila de por sí ya recargada la haría ilegible.
    if (prog === 'Acciones Marketing') {
      var amPtCanvasId = 'ch-am-pt-' + suffix;
      var amPointTypes = programPointTypes(prog, getProgramFromAcum);
      html += '<div class="sub-block"><div class="sub-title">Acumulación por tipo de punto</div>';
      if (!amPointTypes.length) {
        html += '<div class="empty">Sin filas de Acciones Marketing en el rango/país seleccionado</div>';
      } else {
        html += '<div class="cc"><div class="ct">' + (mode === 'USD' ? 'Valor USD' : 'Puntos') + ' por mes y tipo de punto — ' + fyLbl(fyYears().cy) + '</div><div class="cw"><canvas id="' + amPtCanvasId + '"></canvas></div>'
          + '<div style="margin-top:6px;font-size:11px;color:var(--muted)">Vista solo del año fiscal actual — sin comparación YoY por serie</div></div>';
      }
      html += '</div>';
    }

    html += '</div></div>';  // prog-body, prog-section
  });

  // Breakage (no program breakdown — identificacion disponible es solo por pais)
  var bkCanvasId = 'ch-bk-' + suffix;
  var bkId = 'sec-breakage-' + suffix;
  var bkOpen = progOpen(bkId, false);
  html += '<div class="prog-section' + (bkOpen ? '' : ' is-collapsed') + '" id="' + bkId + '">';
  html += '<div class="prog-title" ' + progTitleAttrs(bkId, suffix, bkOpen) + '>'
    + '<span>Breakage (vencimiento de puntos)</span><span class="prog-caret" aria-hidden="true">&#9662;</span></div>';
  html += '<div class="prog-body" id="' + bkId + '-body">';
  var gBk = goalBkMap(country), bkReal = breakageMonthlyMap(country);
  html += '<div class="kpi-row">' + kpiHtml('Puntos Vencidos', fmtPts(m.bkTotal),
      ytdVs(bkReal) + (gBk ? '<br>' + ytdVs(bkReal, gBk) : ''), 'var(--muted)') + '</div>';
  html += '<div class="cc"><div class="ct">Breakage — Puntos vencidos por mes</div>'
    + (gBk ? goalCtlHtml() : '')
    + '<div class="cw"><canvas id="' + bkCanvasId + '"></canvas></div>'
    + '<div class="dtable-row"><div class="dtable-label">YoY %</div><div class="yoy-row" id="yoy-' + bkCanvasId + '"></div></div>'
    + (gBk ? goalRowHtml(bkCanvasId) : '')
    + '</div>';
  html += '</div></div>';

  el.innerHTML = html;

  // Now that canvases exist in DOM, build charts
  var fy = fyYears(); // { ly: 2025, cy: 2026 } -- anios calendario de cada dataset cargado

  // Miembros: altas/mes (CY vs LY), stock acumulado (CY vs LY) y altas por tier (FY actual).
  if (mb.total) {
    var mbAltasPrev = fiscalSeries(mb.altasByYm, mb.altasByYm, fy.cy, fy.ly, fy.ly);
    var mbAltasCurr = fiscalSeries(mb.altasByYm, mb.altasByYm, fy.cy, fy.ly, fy.cy);
    buildBarChart(mbAltasId, mbAltasPrev, mbAltasCurr, fyLbl(fy.ly), fyLbl(fy.cy), 'rgba(2,150,135,.75)', fmtPtsChart);

    var mbStockPrev = fiscalSeries(mb.stockByYm, mb.stockByYm, fy.cy, fy.ly, fy.ly);
    var mbStockCurr = fiscalSeries(mb.stockByYm, mb.stockByYm, fy.cy, fy.ly, fy.cy);
    buildBarChart(mbStockId, mbStockPrev, mbStockCurr, fyLbl(fy.ly), fyLbl(fy.cy), 'rgba(85,15,237,.6)', fmtPtsChart);

    var tierDatasets = MB_TIERS.map(function(t){
      return { label: t,
               data: fiscalSeries(mb.altasByTierYm[t], mb.altasByTierYm[t], fy.cy, fy.ly, fy.cy),
               backgroundColor: MB_TIER_COLOR[t] };
    });
    buildStackedBarChart(mbTierId, tierDatasets, fmtPtsChart);
  }

  programs.forEach(function(prog) {
    var canvasId   = 'ch-' + prog.replace(/[^a-z0-9]/gi, '') + '-' + suffix;
    var canvasRdId = 'ch-rd-' + prog.replace(/[^a-z0-9]/gi, '') + '-' + suffix;
    var mode  = getSecMode(suffix, prog);
    var acValFn = mode === 'USD' ? function(row){ return getAcumUsd(row, rowCountryKey(row, country)); } : getPts;
    var valFn = function(row){ return valueForMode(row, mode); };
    var fmtFn = mode === 'USD' ? fmtUSDChart : fmtPtsChart;

    var acCY_map = monthlyMap(RAW.acum_cy, country, prog, getProgramFromAcum,  acValFn);
    var acLY_map = monthlyMap(RAW.acum_ly, country, prog, getProgramFromAcum,  acValFn);
    var acPrev = fiscalSeries(acCY_map, acLY_map, fy.cy, fy.ly, fy.ly);
    var acCurr = fiscalSeries(acCY_map, acLY_map, fy.cy, fy.ly, fy.cy);

    var rdCY_map = monthlyMap(RAW.reden_cy, country, prog, getProgramFromReden, valFn);
    var rdLY_map = monthlyMap(RAW.reden_ly, country, prog, getProgramFromReden, valFn);
    var rdPrev = fiscalSeries(rdCY_map, rdLY_map, fy.cy, fy.ly, fy.ly);
    var rdCurr = fiscalSeries(rdCY_map, rdLY_map, fy.cy, fy.ly, fy.cy);

    // Precio por punto (independiente del switch Q/$): USD / puntos, mes a mes.
    var rdUsdMapCY = monthlyMap(RAW.reden_cy, country, prog, getProgramFromReden, getUsd);
    var rdUsdMapLY = monthlyMap(RAW.reden_ly, country, prog, getProgramFromReden, getUsd);
    var rdPtsMapCY = monthlyMap(RAW.reden_cy, country, prog, getProgramFromReden, getPts);
    var rdPtsMapLY = monthlyMap(RAW.reden_ly, country, prog, getProgramFromReden, getPts);
    var rdUsdPrev = fiscalSeries(rdUsdMapCY, rdUsdMapLY, fy.cy, fy.ly, fy.ly);
    var rdUsdCurr = fiscalSeries(rdUsdMapCY, rdUsdMapLY, fy.cy, fy.ly, fy.cy);
    var rdPtsPrev = fiscalSeries(rdPtsMapCY, rdPtsMapLY, fy.cy, fy.ly, fy.ly);
    var rdPtsCurr = fiscalSeries(rdPtsMapCY, rdPtsMapLY, fy.cy, fy.ly, fy.cy);
    var pricePrev = rdPtsPrev.map(function(p, i){ return p ? rdUsdPrev[i] / p : 0; });
    var priceCurr = rdPtsCurr.map(function(p, i){ return p ? rdUsdCurr[i] / p : 0; });

    // Pasaporte D! + toggle "Por Tier": apilado CY por tier + línea de Total LY.
    // Respeta el modo Q/$ de la sección (14-sep): tierPtsMap (Q) y tierUsdMap ($) se
    // calculan en la misma pasada por las filas de loyalty_acum_tier.json. El USD por
    // tier usa el mismo DRO que getAcumUsd (PV/denom × R), con acum_usd_base ya
    // prorrateado por tier en loyalty_sync.py (enrich_acum_tier_usd) y sspFactor()
    // del país/mes de la fila — no se llama a getAcumUsd() directo porque esa función
    // resuelve el programa via getProgramFromAcum(row), que necesita partner/point_type
    // (las filas de tier no los tienen; son siempre Pasaporte D! genuino por construcción).
    if (prog === 'Pasaporte D!' && getAcumView(suffix) === 'tier') {
      var acPtsCY_map = monthlyMap(RAW.acum_cy, country, prog, getProgramFromAcum, getPts);
      var acPtsLY_map = monthlyMap(RAW.acum_ly, country, prog, getProgramFromAcum, getPts);
      var acPtsPrev = fiscalSeries(acPtsCY_map, acPtsLY_map, fy.cy, fy.ly, fy.ly);
      var acPtsCurr = fiscalSeries(acPtsCY_map, acPtsLY_map, fy.cy, fy.ly, fy.cy);
      var tierPtsMap = {}, tierUsdMap = {};  // tier -> { ym: puntos|usd }
      MB_TIERS.forEach(function(t){ tierPtsMap[t] = {}; tierUsdMap[t] = {}; });
      acumTierRows(country).forEach(function(row){
        var t = MB_TIERS.indexOf(row.tier) !== -1 ? row.tier : 'Sin tier';
        var ym = (row.processing_date || '').substring(0, 7);
        tierPtsMap[t][ym] = (tierPtsMap[t][ym] || 0) + getPts(row);

        var dk = rowCountryKey(row, country);
        var factor = sspFactor(dk, ym);
        var usd = 0;
        if (factor !== undefined && factor !== null) {
          var PV = -((+row.points || 0) * factor);
          var R = +row.acum_usd_base || 0;
          var denom = Math.abs(PV) + R;
          usd = denom ? (PV / denom) * R : 0;
        }
        tierUsdMap[t][ym] = (tierUsdMap[t][ym] || 0) + usd;
      });
      var tierMonthMap = mode === 'USD' ? tierUsdMap : tierPtsMap;
      var acTierDatasets = MB_TIERS.filter(function(t){ return Object.keys(tierMonthMap[t]).length; })
        .map(function(t){
          return { label: t,
                   data: fiscalSeries(tierMonthMap[t], tierMonthMap[t], fy.cy, fy.ly, fy.cy),
                   backgroundColor: MB_TIER_COLOR[t] };
        });
      // Línea de Total LY en la misma escala que las barras: $ reusa acPrev/acCurr
      // (getAcumUsd sobre acum_cy/ly), Q reusa acPtsPrev/acPtsCurr.
      var tierTotalPrev = mode === 'USD' ? acPrev : acPtsPrev;
      var tierTotalCurr = mode === 'USD' ? acCurr : acPtsCurr;
      buildStackedBarChart(canvasId, acTierDatasets, fmtFn, true, { label: 'Total ' + fyLbl(fy.ly), data: tierTotalPrev });
      var acYoyEl = document.getElementById('yoy-' + canvasId);
      if (acYoyEl) acYoyEl.innerHTML = yoyRowHtml(tierTotalPrev, tierTotalCurr);
      // Gráfico de mix (100% apilado) — siempre en puntos, independiente del toggle Q/$.
      // El canvas solo existe en el HTML cuando aView==='tier' (ver acTitleHtml arriba).
      if (document.getElementById('ch-mix-' + suffix)) {
        var mixDatasets = MB_TIERS.filter(function(t){ return Object.keys(tierPtsMap[t]).length; })
          .map(function(t){
            return { label: t,
                     data: fiscalSeries(tierPtsMap[t], tierPtsMap[t], fy.cy, fy.ly, fy.cy),
                     backgroundColor: MB_TIER_COLOR[t] };
          });
        buildMixChart('ch-mix-' + suffix, mixDatasets);
      }
      // Burbujas: puntos acumulados promedio por tier (anual, año fiscal CY vs LY) —
      // Ratio de acumulación por tier (puntos por $ de GB) — burbujas KPI estándar
      // (kpiHtml, mismo patrón que el resto del dashboard). Fuente:
      // loyalty_ratio_acum_tier.json (ver ratioTierRows) — points/gb agregado sobre
      // el año fiscal completo, por tier. Sin "Sin tier": el pipeline ya descarta
      // las transacciones sin tier resuelto (aggregate_ratio_acum_tier).
      var tierAvgEl = document.getElementById('tier-avg-' + suffix);
      if (tierAvgEl) {
        var rtRows = ratioTierRows(country);
        var tierRatioAgg = {};
        MB_TIER_ORDER_3.forEach(function(t){ tierRatioAgg[t] = { cyP: 0, cyG: 0, lyP: 0, lyG: 0 }; });
        rtRows.forEach(function(r){
          var ym = (r.processing_date || '').slice(0, 7);
          if (ym.length !== 7 || tierRatioAgg[r.tier] === undefined) return;
          var a = tierRatioAgg[r.tier];
          if (fyStartYear(ym) === fy.cy) { a.cyP += (+r.points || 0); a.cyG += (+r.gb || 0); }
          else if (fyStartYear(ym) === fy.ly) { a.lyP += (+r.points || 0); a.lyG += (+r.gb || 0); }
        });
        var tierAvgHtml = MB_TIER_ORDER_3.filter(function(t){ return tierRatioAgg[t].cyG > 0; })
          .map(function(t){
            var a = tierRatioAgg[t];
            var ratioCY = a.cyG ? a.cyP / a.cyG : 0;
            var ratioLY = a.lyG ? a.lyP / a.lyG : 0;
            return kpiHtml(t, ratioCY.toFixed(2), 'vs ' + fyLbl(fy.ly) + ' ' + fmtPct(ratioCY, ratioLY), MB_TIER_COLOR_SOLID[t]);
          }).join('');
        tierAvgEl.innerHTML = tierAvgHtml || '<div class="empty">Sin datos de ratio por tier — loyalty_ratio_acum_tier.json no disponible</div>';
      }
    } else if ((prog === 'Cobrand' || prog === 'Partners') && mode === 'USD' && getBrView(suffix, prog) === 'margen') {
      // Costo (SSP) + margen (Bank/Partner Revenue) apilados por mes — mismo total
      // que la vista "Total", descompuesto. Reemplaza al chart aparte que existía antes.
      // brLabel se recalcula acá porque este bloque corre en un renderizado
      // aparte (el chart real, más abajo en la función); misma logica que la
      // que arma acTitleHtml arriba, duplicada a propósito para no acoplar los
      // dos pasos.
      var brLabel = prog === 'Partners' ? 'Partner Revenue' : 'Bank Revenue';
      var costFn = function(row){ return getBankRevenueCost(row, rowCountryKey(row, country)); };
      var revFn  = function(row){ return getBankRevenue(row, rowCountryKey(row, country)); };
      var costCY_map = monthlyMap(RAW.acum_cy, country, prog, getProgramFromAcum, costFn);
      var costLY_map = monthlyMap(RAW.acum_ly, country, prog, getProgramFromAcum, costFn);
      var revCY_map  = monthlyMap(RAW.acum_cy, country, prog, getProgramFromAcum, revFn);
      var revLY_map  = monthlyMap(RAW.acum_ly, country, prog, getProgramFromAcum, revFn);
      var costCurr = fiscalSeries(costCY_map, costLY_map, fy.cy, fy.ly, fy.cy);
      var costPrev = fiscalSeries(costCY_map, costLY_map, fy.cy, fy.ly, fy.ly);
      var revCurr  = fiscalSeries(revCY_map,  revLY_map,  fy.cy, fy.ly, fy.cy);
      var revPrev  = fiscalSeries(revCY_map,  revLY_map,  fy.cy, fy.ly, fy.ly);
      var brTotalPrev = costPrev.map(function(v, i){ return v + revPrev[i]; });
      buildSplitBarChart(canvasId, brTotalPrev, [
        { label: 'Costo (SSP)', data: costCurr, backgroundColor: 'rgba(85,96,112,.65)' },
        { label: brLabel,       data: revCurr,  backgroundColor: 'rgba(2,150,135,.8)' }
      ], fyLbl(fy.ly), fmtUSDChart);
    } else {
      // 3ra barra (proyección) en el mismo modo Q/$ que la sección.
      var gAc = goalAcumMap(prog, country, mode);
      buildBarChart(canvasId, acPrev, acCurr, fyLbl(fy.ly), fyLbl(fy.cy), 'rgba(85,15,237,.75)', fmtFn, null,
                    gAc ? { data: goalSeries(gAc, fy), label: cmpLabel() } : null);
    }
    var gRd = goalRedenMap(prog, country, mode);
    buildBarChart(canvasRdId, rdPrev, rdCurr, fyLbl(fy.ly), fyLbl(fy.cy), 'rgba(250,80,63,.78)', fmtFn, { prev: pricePrev, curr: priceCurr },
                  gRd ? { data: goalSeries(gRd, fy), label: cmpLabel() } : null);

    // Ratio de acumulacion (pts/GB por producto) — 2 vistas (getRatioView):
    // 'periodo' (original): periodo elegido (mes o anio fiscal) vs el inmediato
    // anterior, todos los productos comparados (buildRatioBarChart). RATIO_PERIOD
    // ya quedo resuelto a un default valido por ratioPeriodOptionsHtml (arriba).
    // 'producto' (22-sep): evolucion mensual del producto elegido (o "Total", el
    // agregado de los 7) en el anio fiscal completo, mismo patron CY/LY que el
    // resto de graficos evolutivos (buildBarChart) — sin periodo puntual.
    if (prog === 'Pasaporte D!') {
      var ratioCanvasId = 'ch-ratio-' + suffix;
      if (getRatioView(suffix) === 'producto') {
        var rProduct = getRatioProduct(suffix);
        var rrowsP = ratioRows(country);
        // Serie mensual fiscal (12 meses, CY/LY) del ratio puntos/GB para un
        // producto puntual o el agregado ("Total") — factorizado para poder
        // armar tanto el chart del producto elegido como, debajo, el de Total
        // (siempre visible salvo que el producto elegido YA sea Total, para no
        // duplicar el mismo gráfico dos veces).
        var ratioProductMonthlySeries = function(product) {
          var ptsCyMap = {}, gbCyMap = {}, ptsLyMap = {}, gbLyMap = {};
          rrowsP.forEach(function(r){
            if (product !== 'Total' && r.grupo_pnl !== product) return;
            var ym = (r.processing_date || '').slice(0, 7);
            if (ym.length !== 7) return;
            var fyy = fyStartYear(ym);
            if (fyy === fy.cy) { ptsCyMap[ym] = (ptsCyMap[ym] || 0) + (+r.points || 0); gbCyMap[ym] = (gbCyMap[ym] || 0) + (+r.gb || 0); }
            else if (fyy === fy.ly) { ptsLyMap[ym] = (ptsLyMap[ym] || 0) + (+r.points || 0); gbLyMap[ym] = (gbLyMap[ym] || 0) + (+r.gb || 0); }
          });
          var gCyArr = fiscalSeries(gbCyMap, gbCyMap, fy.cy, fy.ly, fy.cy);
          var gLyArr = fiscalSeries(gbLyMap, gbLyMap, fy.cy, fy.ly, fy.ly);
          var curr = fiscalSeries(ptsCyMap, ptsCyMap, fy.cy, fy.ly, fy.cy).map(function(p, i){
            return gCyArr[i] ? p / gCyArr[i] : 0;
          });
          var prev = fiscalSeries(ptsLyMap, ptsLyMap, fy.cy, fy.ly, fy.ly).map(function(p, i){
            return gLyArr[i] ? p / gLyArr[i] : 0;
          });
          return { curr: curr, prev: prev };
        };
        var rSeries = ratioProductMonthlySeries(rProduct);
        var ratioColor = rProduct === 'Total' ? 'rgba(30,41,59,.92)' : 'rgba(85,15,237,.75)';
        var ratioFmt = function(v){ return v.toFixed(2); };
        var gRt = goalRatioMap(rProduct, country);
        buildBarChart(ratioCanvasId, rSeries.prev, rSeries.curr, fyLbl(fy.ly), fyLbl(fy.cy), ratioColor, ratioFmt, null,
                      gRt ? { data: goalSeries(gRt, fy), label: cmpLabel() } : null);
        if (rProduct !== 'Total') {
          var totalSeries = ratioProductMonthlySeries('Total');
          buildBarChart('ch-ratio-total-' + suffix, totalSeries.prev, totalSeries.curr, fyLbl(fy.ly), fyLbl(fy.cy), 'rgba(30,41,59,.92)', ratioFmt);
        }
      } else {
        var rMode2 = getRatioMode(suffix);
        var curPeriod = RATIO_PERIOD[suffix];
        var ratioCats = RATIO_PRODUCTS.concat(['Total']);
        var ratioCurr = ratioCats.map(function(){ return 0; });
        var ratioPrev = ratioCats.map(function(){ return 0; });
        var ratioCurLbl = 'Actual', ratioPrevLbl = 'Anterior';
        if (curPeriod !== undefined && curPeriod !== null && curPeriod !== '') {
          var rrows = ratioRows(country);
          var prevPeriod = ratioPrevPeriod(rMode2, curPeriod);
          var curAgg  = ratioAggByProduct(rrows, rMode2, curPeriod);
          var prevAgg = ratioAggByProduct(rrows, rMode2, prevPeriod);
          ratioCurr = RATIO_PRODUCTS.map(function(c){ var a = curAgg[c];  return a && a.gb ? a.points / a.gb : 0; });
          ratioPrev = RATIO_PRODUCTS.map(function(c){ var a = prevAgg[c]; return a && a.gb ? a.points / a.gb : 0; });
          ratioCurr.push(ratioTotal(curAgg));
          ratioPrev.push(ratioTotal(prevAgg));
          ratioCurLbl  = ratioLabel(rMode2, curPeriod);
          ratioPrevLbl = ratioLabel(rMode2, prevPeriod);
        }
        buildRatioBarChart(ratioCanvasId, ratioCats, ratioPrev, ratioCurr, ratioPrevLbl, ratioCurLbl);
      }
    }

    // Pasaporte D! vía canal iFood — participación % de iFood sobre el total (100% stacked).
    // Movido acá desde "IFOOD" (misma fecha que el HTML): es una vista de Pasaporte D!.
    // Sin línea LY: al pasar a % el eje es 0-100, un LY en valor absoluto ya no es
    // plotteable en la misma escala sin un eje secundario (lo que generaba la
    // confusión original de la línea). Tooltip lleva el total absoluto del mes para
    // no perder contexto de magnitud (hallazgo ux-designer 16-sep).
    if (prog === 'Pasaporte D!' && RAW.acum_channel && (country.key === 'total' || country.key === 'brasil')) {
      var chCanId2 = 'ch-acum-ch-' + suffix;
      var chIfoodMapCY = {}, chRestoMapCY = {};
      acumChannelRows(country).forEach(function(row) {
        var ym  = (row.processing_date || '').substring(0, 7);
        var yr  = parseInt(ym.substring(0, 4));
        var grp = row.channel_group || 'resto';
        var dk  = rowCountryKey(row, country);
        var val;
        if (mode === 'USD') {
          var factor = sspFactor(dk, ym);
          var PV = -((+row.points || 0) * (factor || 0));
          var R  = +row.acum_usd_base || 0;
          var denom = Math.abs(PV) + R;
          val = denom ? (PV / denom) * R : 0;
        } else {
          val = +row.points || 0;
        }
        if (fyStartYear(ym) !== fy.cy) return;
        if (grp === 'ifood') { chIfoodMapCY[ym] = (chIfoodMapCY[ym] || 0) + val; }
        else                 { chRestoMapCY[ym] = (chRestoMapCY[ym] || 0) + val; }
      });

      var chDatasets = [
        { label: 'iFood',
          data: fiscalSeries(chIfoodMapCY, chIfoodMapCY, fy.cy, fy.ly, fy.cy),
          backgroundColor: 'rgba(255,90,0,.82)' },
        { label: 'Resto',
          data: fiscalSeries(chRestoMapCY, chRestoMapCY, fy.cy, fy.ly, fy.cy),
          backgroundColor: 'rgba(85,15,237,.38)' },
      ];

      buildMixChart(chCanId2, chDatasets, { legend: true, fmtFn: fmtFn });
    }

    // Club Despegar — stock de suscriptos apilado por plan (CY) + total LY como línea.
    if (prog === 'Club Despegar' && (cdd.activos || Object.keys(cdd.altasByYm).length)) {
      var cddDatasets = CDD_PLANS.filter(function(p){
        return Object.keys(cdd.stockByPlanYm[p] || {}).length;
      }).map(function(p){
        return { label: p,
                 data: fiscalSeries(cdd.stockByPlanYm[p], cdd.stockByPlanYm[p], fy.cy, fy.ly, fy.cy),
                 backgroundColor: CDD_PLAN_COLOR[p] };
      });
      var cddStockCY = fiscalSeries(cdd.stockByYm, cdd.stockByYm, fy.cy, fy.ly, fy.cy);
      var cddStockLY = fiscalSeries(cdd.stockByYm, cdd.stockByYm, fy.cy, fy.ly, fy.ly);
      buildStackedBarChart('ch-cdd-stock-' + suffix, cddDatasets, fmtPtsChart, true,
        { label: 'Total ' + fyLbl(fy.ly), data: cddStockLY });
      var yEl = document.getElementById('yoy-ch-cdd-stock-' + suffix);
      if (yEl) yEl.innerHTML = yoyRowHtml(cddStockLY, cddStockCY);
    }

    // iFood — altas apiladas por tipo (CY) + total LY como línea.
    if (prog === 'IFOOD' && ifd.total) {
      var ifdDatasets = IFOOD_TIPOS.map(function(t){
        return { label: t,
                 data: fiscalSeries(ifd.altasByTipoYm[t], ifd.altasByTipoYm[t], fy.cy, fy.ly, fy.cy),
                 backgroundColor: IFOOD_COLOR[t] };
      });
      var ifdAltasCY = fiscalSeries(ifd.altasByYm, ifd.altasByYm, fy.cy, fy.ly, fy.cy);
      var ifdAltasLY = fiscalSeries(ifd.altasByYm, ifd.altasByYm, fy.cy, fy.ly, fy.ly);
      buildStackedBarChart('ch-ifd-altas-' + suffix, ifdDatasets, fmtPtsChart, true,
        { label: 'Total ' + fyLbl(fy.ly), data: ifdAltasLY });
      var yEl2 = document.getElementById('yoy-ch-ifd-altas-' + suffix);
      if (yEl2) yEl2.innerHTML = yoyRowHtml(ifdAltasLY, ifdAltasCY);
    }

    // Stock de puntos iFood en la calle — rollforward mensual (no es flujo, es
    // saldo a fin de mes: no tiene sentido "sumar" filas, cada (país, mes) ya
    // viene como 1 sola fila de loyalty_stock_ifood.json).
    if (prog === 'IFOOD' && RAW.stock_ifood) {
      var stkCanId2 = 'ch-stock-if-' + suffix;
      var stkMapCY = {}, stkMapLY = {};
      stockIfoodRows(country).forEach(function(row) {
        var ym = (row.processing_date || '').substring(0, 7);
        var yr = parseInt(ym.substring(0, 4));
        var dk = rowCountryKey(row, country);
        var val = +row.stock_cierre || 0;
        // sspFactor() es negativo por convención (costo/descuento por punto) — hay
        // que invertir el signo, igual que getAcumUsd/getBankRevenueCost, si no un
        // stock (siempre ≥0) sale negativo en $ (ver getAcumUsd más arriba).
        if (mode === 'USD') { val = val * Math.abs(sspFactor(dk, ym) || 0); }
        if (fyStartYear(ym) === fy.cy)      { stkMapCY[ym] = val; }
        else if (fyStartYear(ym) === fy.ly) { stkMapLY[ym] = val; }
      });
      var stkPrev = fiscalSeries(stkMapCY, stkMapLY, fy.cy, fy.ly, fy.ly);

var FISCAL_LABELS = ['Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic','Ene','Feb','Mar'];

// Mapa mensual real (claves "YYYY-MM") de un dataset, filtrado por pais+programa.
// country puede ser un pais concreto o la vista TOTAL (suma de todos).

function monthlyMap(raw, country, prog, getProgFn, valueFn) {
  var agg = {};
  expand(raw).forEach(function(row){
    if (!matchCountryCode(row.country_code, country)) return;
    var progs = getProgFn === getProgramFromReden ? getProgramsFromReden(row) : [getProgFn(row)];
    if (progs.indexOf(prog) === -1) return;
    var ym = (row.processing_date||'').substring(0,7);
    agg[ym] = (agg[ym]||0) + valueFn(row);
  });
  return agg;
}

// point_type dentro de un programa (ej. 'Acciones Marketing' -> FORTUNE / Mkt_App /
// lo que traiga el diccionario ese mes). Data-driven, sin hardcodear valores: se
// listan los point_type que hoy resuelven a ese programa vía getProgramFromAcum,
// juntando CY+LY y todos los países (no solo el filtro activo) para que el set de
// series no cambie si el usuario cambia de país o de rango de fechas.
function programPointTypes(prog, getProgFn) {
  var seen = {};
  [RAW.acum_cy, RAW.acum_ly].forEach(function(raw){
    expand(raw).forEach(function(row){
      if (getProgFn(row) !== prog) return;
      var pt = row.point_type || '(sin point_type)';
      seen[pt] = true;
    });
  });
  return Object.keys(seen).sort();
}

// Igual que monthlyMap pero además filtra por point_type — para desglosar un
// programa en sus point_type de origen (ej. Acciones Marketing por point_type).
function monthlyMapByPointType(raw, country, prog, getProgFn, pointType, valueFn) {
  var agg = {};
  expand(raw).forEach(function(row){
    if (!matchCountryCode(row.country_code, country)) return;
    if (getProgFn(row) !== prog) return;
    var pt = row.point_type || '(sin point_type)';
    if (pt !== pointType) return;
    var ym = (row.processing_date||'').substring(0,7);
    agg[ym] = (agg[ym]||0) + valueFn(row);
  });
  return agg;
}

// 12 valores en orden fiscal (Abr->Mar) para el anio fiscal que arranca en startYear,
// tomando cada mes calendario del mapa (cy o ly) al que efectivamente pertenezca.
// cyMap/lyMap son mapas {YYYY-MM: valor} (pueden ser el mismo); como las claves
// son meses calendario y no se pisan entre archivos, se busca el mes en cualquiera
// de los dos. yearCY/yearLY quedan por compatibilidad de firma (ya no filtran: con
// años fiscales, ene-mar caen en el año calendario siguiente al de arranque).
function fiscalSeries(cyMap, lyMap, yearCY, yearLY, startYear) {
  return FISCAL_MONTHS.map(function(mm){
    var ym = fiscalCalYear(mm, startYear) + '-' + mm;
    var v = (cyMap && ym in cyMap) ? cyMap[ym] : (lyMap ? lyMap[ym] : 0);
    return v || 0;
  });
}

// Breakage: sin identificacion de programa — mapa mensual real por pais
// (expiration_date = "MM-YYYY"; el archivo ya trae ambos anios juntos).
function breakageMonthlyMap(country) {
  var isoSet = isTotal(country)
    ? COUNTRY_DATAKEYS.map(function(k){ return COUNTRY_ISO[k] || k; })
    : [COUNTRY_ISO[country.dataKey] || country.dataKey];
  var rows = Array.isArray((RAW.breakage || {}).data) ? RAW.breakage.data : expand(RAW.breakage);
  var agg = {};
  rows.forEach(function(b){
    if (isoSet.indexOf((b.country || '').toLowerCase()) === -1) return;
    var ed = b.expiration_date || '';
    var mm = ed.substring(0, 2), yyyy = ed.substring(3, 7);
    if (mm.length !== 2 || yyyy.length !== 4) return;
    var ym = yyyy + '-' + mm;
    agg[ym] = (agg[ym] || 0) + Math.abs(+(b.points) || 0);
  });
  return agg;
}

// Suma de puntos por mes (todos los años que traigan los JSON), filtrando país y
// excluyendo programas. src = 'acum' | 'reden'.
function pasivoFlowMap(src, country) {
  var raws  = src === 'acum' ? [RAW.acum_cy, RAW.acum_ly] : [RAW.reden_cy, RAW.reden_ly];
  var progFn = src === 'acum' ? getProgramFromAcum : getProgramFromReden;
  var agg = {};
  raws.forEach(function(raw){
    expand(raw).forEach(function(row){
      if (!matchCountryCode(row.country_code, country)) return;
      if (PASIVO_EXCL.indexOf(progFn(row)) !== -1) return;
      var ym = (row.processing_date || '').substring(0, 7);
      if (ym.length !== 7) return;
      agg[ym] = (agg[ym] || 0) + getPts(row);
    });
  });
  return agg;
}

// Breakage por mes, excluyendo IFOOD / Acciones Marketing si el JSON trae `code`
// (loyalty_dict.reden[code] -> sección). Si no lo trae (sync viejo), devuelve el
// total con la bandera `parcial = true`.
function pasivoBreakageMap(country) {
  var isoSet = isTotal(country)
    ? COUNTRY_DATAKEYS.map(function(k){ return COUNTRY_ISO[k] || k; })
    : [COUNTRY_ISO[country.dataKey] || country.dataKey];
  var rows = Array.isArray((RAW.breakage || {}).data) ? RAW.breakage.data : expand(RAW.breakage);
  var dict = (RAW.dict || {}).reden || {};
  var hasCode = rows.length > 0 && rows[0] && ('code' in rows[0]);
  var agg = {}, parcial = !hasCode;
  rows.forEach(function(b){
    if (isoSet.indexOf((b.country || '').toLowerCase()) === -1) return;
    if (hasCode && PASIVO_EXCL.indexOf(dict[b.code] || 'Otros') !== -1) return;
    var ed = b.expiration_date || '';
    var mm = ed.substring(0, 2), yyyy = ed.substring(3, 7);
    if (mm.length !== 2 || yyyy.length !== 4) return;
    var ym = yyyy + '-' + mm;
    agg[ym] = (agg[ym] || 0) + Math.abs(+(b.points) || 0);
  });
  return { map: agg, parcial: parcial };
}

// Roll-forward por período: 2025 colapsado en una columna de movimientos del año
// + un mes por columna desde 2026-01. El Saldo se ancla en PASIVO_SEED_YM (saldo
// real del cierre) y se propaga hacia adelante (+ flujo neto) y hacia atrás
// (− flujo neto del mes siguiente), así hay saldo en cada columna.
// Devuelve { periods:[{key,label}], data:{key:{acum,reden,brk,neto,saldo}}, ... }.
function pasivoSeries(country) {
  var acum = pasivoFlowMap('acum', country);
  var reden = pasivoFlowMap('reden', country);
  var bk   = pasivoBreakageMap(country);
  var brk  = bk.map;

  // Bucket: todo lo previo a 2026 va a la columna '2025'; desde 2026 es mensual.
  function bucket(ym) { return ym < '2026-01' ? '2025' : ym; }
  var keys = {};
  [acum, reden, brk].forEach(function(m){
    Object.keys(m).forEach(function(ym){ if (ym.length === 7) keys[bucket(ym)] = 1; });
  });
  var periods = Object.keys(keys).sort();
  if (!periods.length) return { periods: [], data: {}, parcialBrk: bk.parcial, seedCol: PASIVO_SEED_YM };

  var agg = {};
  periods.forEach(function(p){ agg[p] = { acum: 0, reden: 0, brk: 0 }; });
  function add(map, field) {
    Object.keys(map).forEach(function(ym){
      if (ym.length !== 7) return;
      agg[bucket(ym)][field] += map[ym] || 0;
    });
  }
  add(acum, 'acum'); add(reden, 'reden'); add(brk, 'brk');
  periods.forEach(function(p){ agg[p].neto = agg[p].acum - agg[p].reden - agg[p].brk; });

  var seed = isTotal(country)
    ? COUNTRY_DATAKEYS.reduce(function(s, k){ return s + (PASIVO_SEED[k] || 0); }, 0)
    : (PASIVO_SEED[country.dataKey] || 0);

  // Anclar el Saldo en el mes del cierre y propagar en las dos direcciones.
  var si = periods.indexOf(PASIVO_SEED_YM);
  if (si === -1) si = periods.length - 1;   // fallback: último período disponible
  agg[periods[si]].saldo = seed;
  for (var i = si + 1; i < periods.length; i++)
    agg[periods[i]].saldo = agg[periods[i - 1]].saldo + agg[periods[i]].neto;
  for (var j = si - 1; j >= 0; j--)
    agg[periods[j]].saldo = agg[periods[j + 1]].saldo - agg[periods[j + 1]].neto;

  var out = periods.map(function(p){
    return { key: p, label: p === '2025' ? '2025 (mov.)' : fmtMonthLbl(p + '-01') };
  });
  return { periods: out, data: agg, parcialBrk: bk.parcial, seedCol: PASIVO_SEED_YM };
}

// ============================================================
// Análisis de variaciones — Actual (Baseline del P&L) vs Budget, Loyalty, solo Despegar.
// Arriba: waterfall Budget -> Δ por línea -> Actual. Abajo: el "por qué" de cada línea
// con las métricas de negocio, en los meses CERRADOS del período:
//   Δ explicado = Δ $ de la métrica (real − budget, con el signo de la línea en el P&L)
//               = efecto volumen  ΔPts × $/pt budget
//               + efecto precio   Δ$/pt × Pts budget
//               + efecto cruzado  ΔPts × Δ$/pt        (los tres suman exacto el Δ explicado)
//   No explicado = Δ P&L (meses cerrados) − Δ explicado (el P&L es contable, las métricas
//                  son del Datalake; también líneas sin métrica de negocio detrás).
// Meses abiertos del período: el "Actual" es Run Rate (Baseline) — su Δ va aparte, sin apertura.
// ============================================================
var VAR_STATE = { mode: 'fy', months: [], q: 'Q1', h: 'H1', country: 'total' };
// línea del P&L (P&L N1 en minúscula) -> métrica que la explica
var VAR_METRIC = {
  // DRO = Deferred Revenue OUT = lo que se difiere al ACUMULAR (definición de Control de Gestión,
  // 13-oct). Deferred revenue IN = el reconocimiento al REDIMIR.
  'loyalty - deferred revenue out':    { key: 'acum',    desc: 'DRO: valor diferido de la acumulación — Pasaporte D! (fórmula GB × pen × regla, margen, SSP) + Cobrand/Partners (pts × SSP)' },
  'loyalty - deferred revenue in':     { key: 'reden',   desc: 'Reconocimiento al redimir: Pasaporte D! (con Cobrand/Partners) + Puntos Manuales · budget: pts × SSP_Red' },
  // iFood y Acciones Marketing: su redención se registra en Rewards & Benefits cost (12-oct:
  // BR H1 iFood redimido ≈ $5,9M vs R&B cost -$6,2M; budget $2,0M vs -$2,1M).
  'loyalty - rewards & benefits cost': { key: 'rb',      desc: 'Redención IFOOD + Acciones Marketing · budget: pts × SSP_Red' },
  'loyalty - breakage revenue':        { key: 'bk',      desc: 'Puntos vencidos × Precio Punto Pasivo (real pendiente: se usa el del Budget)' },
  'loyalty - bank revenue':            { key: 'bank',    desc: 'Puntos Cobrand × (precio facturación − SSP), precio fijo' },
  'loyalty - partner revenue':         { key: 'partner', desc: 'Puntos Partners × (precio facturación − SSP), precio fijo' }
};
function varFyMonths() { var fy = fyYears(); return FISCAL_MONTHS.map(function(mm){ return fiscalCalYear(mm, fy.cy) + '-' + mm; }); }
function varSelMonths() {
  var all = varFyMonths();
  if (VAR_STATE.mode === 'mes') return all.filter(function(ym){ return VAR_STATE.months.indexOf(ym) !== -1; });
  if (VAR_STATE.mode === 'q') return all.filter(function(ym){ return PNL_Q[ym.substring(5, 7)] === VAR_STATE.q; });
  if (VAR_STATE.mode === 'h') return all.filter(function(ym){ return PNL_H[PNL_Q[ym.substring(5, 7)]] === VAR_STATE.h; });
  return all;
}
function varSet(k, v) {
  if (k === 'month') {
    var i = VAR_STATE.months.indexOf(v);
    if (i === -1) VAR_STATE.months.push(v); else VAR_STATE.months.splice(i, 1);
  } else {
    VAR_STATE[k] = v;
    if (k === 'mode' && v === 'mes' && !VAR_STATE.months.length) VAR_STATE.months = [proyLastClosedYm()];
  }
  renderVariaciones();
}
function varCountryObj(dk) { return COUNTRIES.filter(function(c){ return c.dataKey === dk; })[0] || { key: dk, dataKey: dk, label: dk }; }
// {línea N1: monto} del P&L (loyalty) para el país y los meses
function varPnl(raw, country, months) {
  var o = {};
  expandBaseline(raw).forEach(function(r) {
    var n1 = (r['P&L N1'] || '').toLowerCase();
    if (n1.indexOf('loyalty') === -1 || !matchCountryRow(r['Pais'], country)) return;
    if (months.indexOf((r['Fecha'] || '').substring(0, 7)) === -1) return;
    o[n1] = (o[n1] || 0) + (parseFloat(r['Monto USD']) || 0);
  });
  return o;
}
function sumMap(m, months) { var t = 0; months.forEach(function(ym){ t += (m && m[ym]) || 0; }); return t; }

// ---- Índice REAL granular, una sola pasada (cacheado): país × mes × programa × partner.
var _VRIDX = null;
function varRealIdx() {
  if (_VRIDX && _VRIDX.src === RAW.acum_cy && _VRIDX.src2 === RAW.reden_cy) return _VRIDX;
  var ac = {}, rd = {};
  function slot(o, a, b, c, d) {
    var x = (o[a] = o[a] || {}); x = (x[b] = x[b] || {}); x = (x[c] = x[c] || {});
    return (x[d] = x[d] || { pts: 0, usd: 0, br: 0 });
  }
  expand(RAW.acum_cy).concat(expand(RAW.acum_ly)).forEach(function(row) {
    var dk = ISO_TO_DATAKEY[(row.country_code || '').toLowerCase()];
    if (!dk) return;
    var o = slot(ac, dk, (row.processing_date || '').substring(0, 7), getProgramFromAcum(row), row.partner || '');
    o.pts += getPts(row); o.usd += getAcumUsd(row, dk); o.br += getBankRevenue(row, dk);
  });
  expand(RAW.reden_cy).concat(expand(RAW.reden_ly)).forEach(function(row) {
    var dk = ISO_TO_DATAKEY[(row.country_code || '').toLowerCase()];
    if (!dk) return;
    var ym = (row.processing_date || '').substring(0, 7), p = getPts(row), u = Math.abs(+(row.descuento_consumo_puntos_usd) || 0);
    getProgramsFromReden(row).forEach(function(prog) { var o = slot(rd, dk, ym, prog, ''); o.pts += p; o.usd += u; });
  });
  _VRIDX = { src: RAW.acum_cy, src2: RAW.reden_cy, ac: ac, rd: rd };
  return _VRIDX;
}
// Partner del Budget -> códigos de partner del Datalake, por país ('*' = el resto del país).
var VAR_PARTNERS = {
  argentina: { 'ICBC': ['ICBCAR'], 'FOCO': ['FOCOAR'], 'Bonda': ['BONDAAR'] },
  brasil:    { 'C6': ['C6BANKBR'], 'BRB': ['BRBBR'], 'New partner': '*' },
  mexico:    { 'INVEX': ['INVEXMX'], 'BBVA': ['BBVAMX'], 'Otros': '*' }
};
function varBudgetName(dk, code) {
  var m = VAR_PARTNERS[dk] || {}, star = null;
  for (var k in m) { if (m[k] === '*') star = k; else if (m[k].indexOf(code) !== -1) return k; }
  return star || code;   // sin match: el propio código (celda sin budget)
}
// Efectos de una celda: volumen ΔQ×Pb · precio ΔP×Qb · cruzado ΔQ×ΔP (suman Qa·Pa − Qb·Pb).
// Si falta un lado no hay precio comparable: todo el Δ va a volumen.
function varEff(qa, pa, qb, pb) {
  if (!qb) return { vol: qa * pa, pre: 0, cru: 0 };
  if (!qa) return { vol: -qb * pb, pre: 0, cru: 0 };
  return { vol: (qa - qb) * pb, pre: (pa - pb) * qb, cru: (qa - qb) * (pa - pb) };
}
// Valor diferido de la acumulación (fórmula de Control de Gestión, misma del Budget):
//   pts = GB × pen × regla · R = GB × pen × take · $ = (pts × SSP) / (pts × SSP + R) × R
function varPdV(d) {
  var pts = d.gb * d.pen * d.regla, PV = pts * d.ssp, R = d.gb * d.pen * d.take;
  return (PV + R) ? PV / (PV + R) * R : 0;
}

// Por línea: { bud, real (valor de la métrica), eff: [{label, val}] } con efectos calculados en la
// celda más chica disponible y sumados. Valores en magnitud positiva; el signo de la línea se aplica al mostrar.
function varMetrics(country, months) {
  var prevCmp = METRICS_CMP;
  METRICS_CMP = 'budget';
