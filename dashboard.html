<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loyalty Dashboard — Despegar</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root {
  --bg:      #f1f5f9;
  --surface: #ffffff;
  --border:  #e2e8f0;
  --text:    #1e293b;
  --muted:   #556070;   /* gris con contraste AA (6.2:1 sobre #f8fafc) para labels/th */
  --accent:  #550fed;   /* LILA-1 oficial Despegar */
  --accent-a08: rgba(85,15,237,.08);
  --accent-a15: rgba(85,15,237,.15);
  --green:   #1a7f37;   /* verde con contraste AA para texto de tabla */
  --red:     #cf222e;   /* rojo con contraste AA para texto de tabla */
  --amber:   #d97706;
  --radius:  10px;
  --radius-sm: 6px;
  --proj-bg: #fafaf7;
  --shadow:    0 1px 2px rgba(15,23,42,.06);
  --shadow-md: 0 4px 12px rgba(15,23,42,.10);
  --fs-tiny:  10px;
  --fs-xs:    10.5px;
  --fs-small: 11px;
  --fs-md:    12px;
  --fs-body:  13px;
  --fs-base:  14px;
  --fs-lg:    17px;
  --fs-hero:  22px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: var(--fs-base); }

/* ---- Header ---- */
.header { background: linear-gradient(90deg, #3d00d1 0%, #550fed 100%); color: #fff; padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.header-title { font-size: var(--fs-lg); font-weight: 800; }
.header-sub   { font-size: var(--fs-small); color: #e9e1ff; margin-top: 2px; }
.header-sync  { font-size: var(--fs-small); color: #e9e1ff; }

/* ---- Sticky topbar (barra de pais + filtros) ---- */
.topbar { position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 8px rgba(15,23,42,.08); }

/* ---- Country tabs ---- */
.country-tabs { display: flex; gap: 2px; background: #0f172a; padding: 0 40px; border-bottom: 2px solid #1e293b; overflow-x: auto; }
.ctab { padding: 11px 18px; font-size: var(--fs-body); font-weight: 600; color: #94a3b8; cursor: pointer; border: none; background: none; border-bottom: 3px solid transparent; white-space: nowrap; transition: .15s; }
.ctab:hover  { color: #e2e8f0; }
.ctab.active { color: #fff; border-bottom-color: var(--accent); }
.ctab-manual { margin-left: auto; color: #c4b5fd; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
.ctab-manual:hover { color: #fff; background: var(--accent-a15); }

/* ---- Filters ---- */
.filters { display: flex; align-items: center; gap: 14px; padding: 10px 40px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.fg { display: flex; flex-direction: column; gap: 3px; }
.fl { font-size: var(--fs-tiny); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.ppl-bar { display: flex; align-items: center; gap: 8px; padding: 10px 0 4px; }
select, input[type=month] {
  padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: #f8fafc; font-size: var(--fs-body); color: var(--text); cursor: pointer;
}
select:focus-visible, input[type=month]:focus-visible,
button:focus-visible, .ctab:focus-visible, .prog-chip:focus-visible, .seg-btn:focus-visible,
.prog-title:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
}
.fsep { width: 1px; height: 34px; background: var(--border); margin: 0 4px; }

/* ---- Main ---- */
/* Columna de contenido angosta y CENTRADA (margenes iguales a ambos lados).
   Todo el tablero (P&L + metricas) vive dentro de este ancho. */
.main { padding: 24px 40px; max-width: 1680px; margin: 0 auto; }
@media (max-width: 700px) { .main { padding: 16px; } .header, .filters { padding-left: 16px; padding-right: 16px; } .country-tabs { padding: 0 16px; } }

/* ---- Banner ---- */
.banner { display: flex; align-items: flex-start; gap: 10px; border-radius: var(--radius); padding: 14px 18px; margin-bottom: 20px; border-left: 4px solid; }
.banner.warning { background: #fef3c7; border-color: var(--amber); }
.banner.warning .bt { color: #92400e; }
.banner.wip { background: #f0fdf4; border-color: var(--green); }
.banner.wip .bt { color: #166534; }
.bt { font-size: var(--fs-body); font-weight: 600; line-height: 1.4; }
.bt strong { font-weight: 800; }

/* ---- Section title ---- */
.stitle { font-size: var(--fs-small); font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .6px; border-bottom: 2px solid var(--accent); padding-bottom: 5px; margin: 20px 0 14px; }

/* ---- P&L table ---- */
/* El P&L rompe la columna centrada del .main y se extiende casi a todo el ancho
   de la pantalla (margen casi nulo), centrado. El resto del contenido sigue en
   la columna angosta. Tecnica full-bleed via vw (el margen es > que el scrollbar
   para no generar scroll horizontal). */
.pnl-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; width: calc(100vw - 40px); margin-left: calc(50% - 50vw + 20px); box-shadow: var(--shadow); }
.tbl-scroll { overflow-x: auto; }
table.pnl { width: 100%; border-collapse: collapse; font-size: var(--fs-body); }
table.pnl th {
  padding: 10px 14px; text-align: right; font-size: var(--fs-xs); font-weight: 700;
  color: var(--muted); text-transform: uppercase; letter-spacing: .3px;
  background: #f8fafc; border-bottom: 1px solid var(--border); white-space: nowrap;
}
table.pnl th.lc { text-align: left; min-width: 260px; position: sticky; left: 0; background: #f8fafc; z-index: 2; }
table.pnl td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; text-align: right; white-space: nowrap; }
table.pnl td.lc { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; padding-left: 28px; }
table.pnl tr:hover td, table.pnl tr:hover td.lc { background: #f8fafc; }

/* Scenario header row (BASELINE | GOAL | Δ) */
table.pnl tr.bg-scen th { text-align: center; font-size: var(--fs-tiny); font-weight: 800; letter-spacing: .6px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
/* Mismo color-coding que P&L Accounting de B2B: BASELINE lila · GOAL azul · Δ verde */
table.pnl tr.bg-scen th.bg-b { background: #ede9fe; color: #4c1d95; }
table.pnl tr.bg-scen th.bg-g { background: #e0f2fe; color: #0369a1; }
table.pnl tr.bg-scen th.bg-d { background: #f0fdf4; color: #166534; }
table.pnl tr.bg-scen th.lc { background: #f8fafc; }

/* Group header row */
table.pnl tr.grp-hdr td { background: #f0f4ff; font-weight: 700; font-size: var(--fs-small); color: var(--accent); text-transform: uppercase; letter-spacing: .4px; border-top: 2px solid #c7d2fe; border-bottom: 1px solid #c7d2fe; padding: 6px 14px; }
table.pnl tr.grp-hdr td.lc { background: #f0f4ff; padding-left: 14px; }

/* Subtotal row */
table.pnl tr.subtotal td { background: #eef2ff; font-weight: 700; font-size: var(--fs-body); border-top: 1px solid #c7d2fe; border-bottom: 2px solid var(--border); }
table.pnl tr.subtotal td.lc { background: #eef2ff; padding-left: 14px; }

/* Grand total row */
table.pnl tr.grand-total td { background: #1e293b; color: #fff; font-weight: 800; font-size: var(--fs-body); border-top: 2px solid #334155; }
table.pnl tr.grand-total td.lc { background: #1e293b; color: #fff; padding-left: 14px; }

/* Projection columns — el italic es la señal de "proyectado"; el color pasa AA (~4.6:1) */
table.pnl th.proj { background: var(--proj-bg); color: #5b6472; font-style: italic; }
table.pnl td.proj { background: var(--proj-bg); color: #5b6472; font-style: italic; }
table.pnl tr.grp-hdr td.proj, table.pnl tr.subtotal td.proj { color: #5b6472; }
table.pnl tr.grand-total td.proj { color: #cbd5e1; }
table.pnl th.sep, table.pnl td.sep { width: 6px; padding: 0; background: var(--border); }

/* Value colors */
.vp  { color: var(--green); }
.vn  { color: var(--red); }
.vz  { color: #cbd5e1; }
.vf  { color: var(--text); }   /* valor sin criterio de color (mismo color siempre) */
table.pnl tr.grand-total .vp { color: #86efac; }
table.pnl tr.grand-total .vn { color: #fca5a5; }

/* Total column */
td.tc { background: #f0f4ff !important; font-weight: 700; }
table.pnl tr.grand-total td.tc { background: #0f172a !important; }

/* Proj note */
.proj-note { font-size: var(--fs-small); color: var(--muted); padding: 6px 18px 10px; }

/* ---- P&L: formato de P&L Accounting de B2B (tema ejecutivo, 2026-10) ----
   Tabla sin grilla, escenarios en color solido con fila de periodos en tono suave,
   separadores blancos, columna de conceptos fija con sombra, cifras tabulares.
   Override sobre table.pnl: borrar este bloque (y las clases ph-* del JS) revierte. */
.pnl-wrap { border-radius: 14px; border-color: #ece8f4; box-shadow: 0 1px 2px rgba(27,21,51,.05), 0 8px 24px rgba(27,21,51,.05); }
table.pnl { border-collapse: separate; border-spacing: 0; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.pnl th, table.pnl td { border: none; border-bottom: 1px solid #f1eef7; }
table.pnl td { padding: 9px 20px; }
table.pnl td.lc { padding-left: 24px; min-width: 260px; box-shadow: 1px 0 0 #ece7f6, 6px 0 8px -6px rgba(76,29,149,.18); }
table.pnl th.lc { background: #fff; box-shadow: 1px 0 0 #ece7f6, 6px 0 8px -6px rgba(76,29,149,.18); z-index: 4; }
table.pnl tbody tr:not(.subtotal):not(.grp-hdr):not(.grand-total):hover td:not(.sep) { background: #faf8fe; }
/* fila de escenarios: color solido */
table.pnl tr.bg-scen th { padding: 9px 8px; font-size: 11px; letter-spacing: .1em; border-bottom: none; color: #fff; border-radius: 8px 8px 0 0; }
table.pnl tr.bg-scen th.bg-b { background: #6d3fc0; color: #fff; }
table.pnl tr.bg-scen th.bg-g { background: #3f72b4; color: #fff; }
table.pnl tr.bg-scen th.bg-d { background: #2a7d55; color: #fff; }   /* un tono mas oscuro que B2B (#2e8b5e) para pasar AA con texto blanco */
table.pnl tr.bg-scen th.lc { background: #fff; }
/* fila de periodos: tono suave del escenario */
table.pnl thead tr:nth-child(2) th { padding: 9px 14px; font-size: 11.5px; font-weight: 800; letter-spacing: 0; text-transform: none; border-bottom: 2px solid #ddd6ea; background: #fff; color: #1b1533; }
table.pnl thead tr:nth-child(2) th.ph-b { background: #efe9fc; color: #4c1d95; }
table.pnl thead tr:nth-child(2) th.ph-g { background: #e6eef8; color: #1e4f86; }
table.pnl thead tr:nth-child(2) th.ph-d { background: #e3f3ea; color: #14663f; }
table.pnl thead tr:nth-child(2) th.ph-b.tc { background: #ddd2f7; }
table.pnl thead tr:nth-child(2) th.ph-g.tc { background: #cfe0f3; }
table.pnl thead tr:nth-child(2) th.ph-d.tc { background: #c9e8d6; }
table.pnl th.sep, table.pnl td.sep { width: 14px; min-width: 14px; background: #fff !important; border-bottom-color: #fff; }
/* totales y encabezados de grupo: sutiles */
table.pnl td.tc { background: #f8f6fd !important; }
table.pnl tr.grp-hdr td { background: #faf8fe; color: #4c1d95; border-top: none; border-bottom: 1px solid #ece8f4; letter-spacing: .08em; }
table.pnl td .pgb { font-size: 10.5px; font-weight: 400; color: var(--muted); line-height: 1.1; }
table.pnl tr.grp-hdr .drv-note { text-transform: none; letter-spacing: 0; font-weight: 400; color: #5b6472; }
table.pnl tr.grp-hdr td.lc { background: #faf8fe; }
table.pnl tr.subtotal td { background: #fbfaff; color: #1b1533; font-weight: 800; border-top: none; border-bottom: 1px solid #ece8f4; }
table.pnl tr.subtotal td.lc { background: #fbfaff; }
table.pnl tr.grand-total td { background: #1b1533; border-top: none; }
table.pnl tr.grand-total td.lc { background: #1b1533; }
table.pnl tr.grand-total td.tc { background: #2b2150 !important; }
table.pnl tr.grand-total td.sep { background: #1b1533 !important; border-bottom-color: #1b1533; }

/* ---- KPI row ---- */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; border-top: 3px solid var(--accent); box-shadow: var(--shadow); transition: box-shadow .15s ease, transform .15s ease; }
.kc:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.kc .kl { font-size: var(--fs-tiny); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px; }
.kc .kv { font-size: var(--fs-hero); font-weight: 800; line-height: 1; }
.kc .ks { font-size: var(--fs-small); color: var(--muted); margin-top: 5px; }
.pos { color: var(--green); font-weight: 700; }
.neg { color: var(--red); font-weight: 700; }
.neu { color: var(--muted); }

/* ---- Program index chips (saltos rapidos a cada programa) ---- */
.prog-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.or-tbl td.or-key { font-weight: 700; color: var(--accent); }
.or-tbl tr.or-prod td.lc { padding-left: 40px; }
.ip-tbl tr.or-prod td.lc { padding-left: 40px; }
.ip-tbl td.ip-tot { font-weight: 700; }
.ip-tbl td.ip-met { white-space: nowrap; color: var(--muted); }
.ip-tbl td.be-flag { background: #fef3c7; color: #92400e; font-weight: 700; }
.bk-hdr .ip-unit { text-transform: none; letter-spacing: 0; font-weight: 400; }
.var-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 10px; }
.var-months { display: flex; flex-wrap: wrap; gap: 4px; }
.var-chip { border: 1px solid var(--border); border-radius: 999px; }
.var-rr { font-size: 9.5px; color: var(--muted); font-weight: 700; }
.var-tbl td.lc { white-space: normal; min-width: 320px; }
.var-tbl tr.var-sub td { padding-top: 4px; padding-bottom: 4px; font-size: var(--fs-small); color: var(--muted); border-bottom-color: #f8f6fd; }
.var-tbl tr.var-sub td.lc { padding-left: 44px; }
.var-tbl tr.var-line td { border-top: 1px solid #ece8f4; }
.var-detail { font-size: 10.5px; font-weight: 400; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.goal-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 8px; }
.goal-hint { font-size: var(--fs-small); color: var(--muted); }
.seg-btn[disabled] { opacity: .45; cursor: not-allowed; }
.prog-chip { padding: 5px 12px; font-size: var(--fs-md); font-weight: 600; color: var(--accent); background: var(--accent-a08); border: 1px solid var(--accent-a15); border-radius: 999px; cursor: pointer; white-space: nowrap; transition: .15s; }
.prog-chip:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ---- Program section (acordeon: colapsada por defecto salvo Miembros y Pasaporte D!) ---- */
/* scroll-margin-top = alto aprox de la .topbar sticky, para que el ancla no quede tapada */
.prog-section { margin-bottom: 24px; scroll-margin-top: 104px; }
.prog-title { font-size: var(--fs-body); font-weight: 700; color: var(--text); padding: 10px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; border-bottom: 2px solid var(--accent); display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; user-select: none; }
.prog-title:hover { background: #f8fafc; box-shadow: var(--shadow-md); position: relative; z-index: 1; }
.prog-title:hover .prog-caret { color: var(--accent); }
.prog-title-right { display: flex; align-items: center; gap: 20px; }
.prog-caret { display: inline-block; font-size: var(--fs-body); color: var(--muted); transition: transform .15s, color .15s; }
.prog-section.is-collapsed .prog-caret { transform: rotate(-90deg); }
.prog-section.is-collapsed .prog-body { display: none; }
.seg-sm .seg-btn { padding: 3px 10px; font-size: var(--fs-small); }
.prog-body { background: var(--surface); border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); padding: 16px; }
/* Sub-bloque dentro de una seccion de programa (ej. Suscripcion en Club Despegar) */
.sub-block { margin-top: 18px; padding-top: 16px; border-top: 2px dashed var(--border); }
.sub-title { font-size: var(--fs-md); font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
.sub-title-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.sub-title-row .sub-title { margin-bottom: 0; }
.ratio-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ratio-controls-lbl { font-size: var(--fs-small); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }
.ratio-sel { font-size: var(--fs-md); font-weight: 600; color: var(--text); background: #eef1f5; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 10px; min-width: 90px; }
.ratio-hint { font-size: var(--fs-small); color: var(--muted); margin: 0 0 10px; }

/* ---- Charts ---- */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
.cc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 22px; box-shadow: var(--shadow); }
.ct { font-size: var(--fs-tiny); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
.ct-no-mb { margin-bottom: 0; }
.cw { position: relative; height: 220px; }
.ct-sub { font-size: 11px; color: var(--muted); margin: 0 0 8px; }

/* ---- Filas de datos bajo cada grafico evolutivo (YoY, precio/pt) ---- */
.dtable-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
.dtable-row + .dtable-row { margin-top: 3px; padding-top: 3px; border-top: none; }
.dtable-label { flex: 0 0 78px; font-size: var(--fs-small); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; line-height: 1.25; }

.yoy-row, .ppr-row { flex: 1 1 auto; min-width: 0; display: flex; gap: 2px; overflow-x: auto; }
.yoy-cell, .ppr-cell { flex: 1 0 auto; min-width: 48px; text-align: center; }
.yoy-m { font-size: var(--fs-small); font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
.yoy-cell .pos, .yoy-cell .neg, .yoy-cell .neu { font-size: var(--fs-body); }
.ppr-ly { font-size: var(--fs-small); color: var(--muted); margin-bottom: 1px; }
.ppr-cell .pos, .ppr-cell .neg, .ppr-cell .neu { font-size: var(--fs-md); }

/* ---- Segmented toggle (Redenciones Q/$) ---- */
.seg { display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.seg-btn { padding: 5px 12px; font-size: var(--fs-md); font-weight: 700; background: #f8fafc; border: none; cursor: pointer; color: var(--muted); }
.seg-btn:hover { color: var(--text); }
.seg-btn.active { background: var(--accent); color: #fff; }

/* ---- Heatmap (Penetracion de GB: producto x mes) ---- */
.heat-table { width: 100%; border-collapse: collapse; border-spacing: 0; table-layout: fixed; }
.heat-table thead th { font-size: var(--fs-small); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; padding: 10px 6px; text-align: center; background: #f8fafc; border-bottom: 2px solid var(--border); }
.heat-rowlabel { text-align: left !important; font-size: var(--fs-body); font-weight: 600; color: var(--text); padding-right: 10px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 170px; border-right: 1px solid var(--border); }
.heat-cell { text-align: center; font-variant-numeric: tabular-nums; padding: 14px 6px; border: 1px solid rgba(0,0,0,.06); cursor: help; line-height: 1.2; }
.heat-val  { font-size: 15px; font-weight: 700; line-height: 1; }
.heat-empty { background: #f8fafc; color: var(--muted); font-weight: 400; cursor: default; }
.heat-cell-total { background: #1e293b !important; color: #fff !important; }
/* Fila Total separada del resto del heatmap (no es un producto más, es la agregación) */
.heat-total { border-top: 3px solid var(--border); }
.heat-total .heat-rowlabel { font-weight: 800; }
.heat-legend { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: var(--fs-tiny); color: var(--muted); }
.heat-legend-bar { flex: 0 1 200px; height: 8px; border-radius: 4px; }

/* ---- Breakdown table ---- */
.bk-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow); }
.bk-hdr { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: var(--fs-small); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
table.bk { width: 100%; border-collapse: collapse; }
table.bk th { padding: 7px 14px; background: #f8fafc; font-size: var(--fs-tiny); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; border-bottom: 1px solid var(--border); }
table.bk th.r, table.bk td.r { text-align: right; }
table.bk td { padding: 7px 14px; border-bottom: 1px solid #f1f5f9; font-size: var(--fs-body); }
table.bk td.neg { color: var(--red); }
table.bk td.ly  { color: var(--muted); }
table.bk tr.tot td { font-weight: 700; background: #f8fafc; }
table.bk tr:last-child td { border-bottom: none; }
table.bk tr:hover td { background: #f8fafc; }

/* ---- Loading ---- */
.loading { position: fixed; inset: 0; background: rgba(255,255,255,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 12px; }
.spinner { width: 38px; height: 38px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.lt { font-size: var(--fs-body); color: var(--muted); font-weight: 600; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.empty { text-align: center; padding: 28px; color: var(--muted); font-size: var(--fs-body); }
</style>
</head>
<body>

<div class="loading" id="loading" role="status" aria-live="polite">
  <div class="spinner"></div>
  <div class="lt" id="loading-text">Cargando datos...</div>
</div>

<div class="header">
  <div>
    <div class="header-title">Loyalty Dashboard — Despegar</div>
    <div class="header-sub">P&amp;L Contable · Métricas de Negocio por Programa</div>
  </div>
  <div class="header-sync" id="last-sync">—</div>
</div>

<div class="topbar">
<div class="country-tabs" id="country-tabs"></div>

<div class="filters">
  <div class="fg">
    <div class="fl">Desde</div>
    <input type="month" id="f-from" value="2026-04">
  </div>
  <div class="fg">
    <div class="fl">Hasta</div>
    <input type="month" id="f-to" value="2027-03">
  </div>
  <div class="fsep"></div>
  <div class="fg">

      <option value="M" selected>Millones (M)</option>

</div>
</div>

<div class="main" style="padding-bottom:0">

    <div class="bt" id="stale-banner-text"></div>

</div>

<div class="main" id="panels"></div>

<script>
if (window.ChartDataLabels) Chart.register(ChartDataLabels);

// Agranda el alto reservado de la leyenda para separarla del área del gráfico
// (legend.labels.padding solo separa los ITEMS entre sí, no la leyenda del chart).
Chart.register({
  id: 'legendBottomGap',
  beforeInit: function(chart) {
    if (!chart.legend) return;
    var originalFit = chart.legend.fit;
    chart.legend.fit = function() {
      originalFit.bind(this)();
      this.height += 20;
    };
  }
});

// ============================================================
// Country & program config
// ============================================================
var COUNTRIES = [
  { key: 'total',     label: 'TOTAL',     dataKey: 'total'     },
  { key: 'brasil',    label: 'Brasil',    dataKey: 'brasil'    },
  { key: 'mexico',    label: 'México',    dataKey: 'mexico'    },
  { key: 'argentina', label: 'Argentina', dataKey: 'argentina' },
  { key: 'colombia',  label: 'Colombia',  dataKey: 'colombia'  },
  { key: 'chile',     label: 'Chile',     dataKey: 'chile',
    banner: { type: 'warning', html: 'El programa <strong>Pasaporte D!</strong> aun no se encuentra activo en Chile.' } },
  { key: 'peru',      label: 'Perú',      dataKey: 'peru'      },
  { key: 'ecuador',   label: 'Ecuador',   dataKey: 'ecuador'   },
  { key: 'uruguay',   label: 'Uruguay',   dataKey: 'uruguay',
    banner: { type: 'wip', html: 'Seccion en desarrollo <strong>(WIP)</strong> — datos preliminares.' } }
];

// La pestaña TOTAL agrega la suma de estos países (P&L + métricas de negocio).
var COUNTRY_DATAKEYS = COUNTRIES.filter(function(c){ return c.dataKey !== 'total'; })
                                .map(function(c){ return c.dataKey; });
// country_code (acum/reden) viene en nombre completo ('brasil'); breakage.country
// viene en ISO ('br') — mapa para poder identificar el mismo pais en ambas fuentes.
var COUNTRY_ISO = { argentina: 'ar', brasil: 'br', colombia: 'co', ecuador: 'ec', mexico: 'mx', peru: 'pe', uruguay: 'uy', chile: 'cl' };
// Derivados de COUNTRY_ISO, usados por matchCountryCode/rowCountryKey (abajo).
var COUNTRY_ISO_SET = COUNTRY_DATAKEYS.map(function(k){ return COUNTRY_ISO[k]; });
var ISO_TO_DATAKEY = {};
Object.keys(COUNTRY_ISO).forEach(function(k){ ISO_TO_DATAKEY[COUNTRY_ISO[k]] = k; });

function isTotal(country) { return (country && (country.dataKey || country)) === 'total'; }
// Helper comun: ¿el valor de una fila (nombre completo o code ISO, segun `values`)
// pertenece a la vista pedida? En TOTAL, ¿esta en el set de los 8 paises?
function _matchCountry(value, country, values, single) {
  var p = (value || '').toLowerCase();
  return isTotal(country) ? values.indexOf(p) !== -1 : p === single;
}
// ¿la fila (país en nombre completo, ej 'brasil') pertenece a la vista pedida?
// Solo para datasets sin country_code (P&L baseline/budget/forecast, columna 'Pais').
function matchCountryRow(rowCountry, country) {
  return _matchCountry(rowCountry, country, COUNTRY_DATAKEYS, country && country.dataKey);
}
// ¿la fila (country_code ISO de 2 letras, ej 'BR') pertenece a la vista pedida?
// Preferido sobre matchCountryRow para acum/reden: el nombre completo ('country')
// puede venir 'N/D' (welcome bonuses/subs sin transaccion de viaje para el JOIN)
// aun cuando el pipeline ya resolvio el country_code via PARTNER_COUNTRY_CODE.
function matchCountryCode(rowCode, country) {
  return _matchCountry(rowCode, country, COUNTRY_ISO_SET, COUNTRY_ISO[country && country.dataKey]);
}
// dataKey a usar para lookups por país de una fila (en TOTAL, el país real de la fila).
// Prioriza country_code (ver matchCountryCode); cae al nombre si no hay code mapeado.
function rowCountryKey(row, country) {
  if (!isTotal(country)) return country.dataKey;
  var byCode = ISO_TO_DATAKEY[(row.country_code || '').toLowerCase()];
  return byCode || (row.country || '').toLowerCase();
}

// P&L grouping — keywords matched against P&L N1 (lowercase, stripped of "loyalty -" prefix)
var PNL_GROUPS = [
  { label: 'Net Revenue',
    keywords: ['bank revenue', 'partner revenue', 'flag revenue', 'breakage revenue', 'deferred revenue in', 'deferred revenue out'] },
  { label: 'Sales & Marketing',
    keywords: ['marketing', 'rewards', 'benefits', 'personnel'] }
];

// Drivers B2C del P&L Contable (bloque aparte ARRIBA de Net Revenue). Contexto
// del negocio B2C, NO son líneas de Loyalty: no entran en subtotales ni en el
// TOTAL LOYALTY. Match EXACTO contra P&L N1 (lowercase). Código.js ya los
// recorta a LoB='b2c'. Orders es cantidad, no USD (unit: 'count').
var PNL_DRIVERS = [
  { label: 'Orders',          unit: 'count',
    n1: ['orders domestic', 'orders international'] },
  { label: 'Gross Bookings',  unit: 'usd',
    n1: ['gross bookings domestic', 'gross bookings international'] },
  { label: 'Up Front + Fees', unit: 'usd',
    n1: ['up front incentives', 'fees', 'commercial discounts'] }
];
function driverOf(n1) {
  var l = (n1 || '').toLowerCase().trim();
  for (var i = 0; i < PNL_DRIVERS.length; i++) {
    if (PNL_DRIVERS[i].n1.indexOf(l) !== -1) return PNL_DRIVERS[i].label;
  }
  return null;
}

// ============================================================
// Program dictionary — loaded dynamically from loyalty_dict.json
// Built from Diccionario.xlsx by loyalty_sync.py
// ============================================================

// Ordered list of all sections (controls display order)
var PROGRAMS_ORDER = ['Pasaporte D!', 'IFOOD', 'Cobrand', 'Partners', 'Acciones Marketing', 'Club Despegar', 'Puntos Manuales'];
// Programas restringidos a ciertos paises (si un programa no aparece aca, se muestra en todos)
var PROGRAM_COUNTRIES = {
  'Club Despegar': ['argentina'],
  'Cobrand':       ['mexico', 'argentina', 'colombia'],
  'IFOOD':         ['brasil'],
};

// ---- Paleta categórica: familias oficiales Despegar (LILA / VERDE / ROJO) + gris ----
// LILA-1 #550fed · VERDE-1 #029687 · LILA-3 #976cf6 · ROJO-2 #fa503f · --muted
var CAT_FILL  = ['rgba(85,15,237,.80)', 'rgba(2,150,135,.80)', 'rgba(151,108,246,.80)', 'rgba(250,80,63,.78)', 'rgba(85,96,112,.50)'];
var CAT_SOLID = ['#550fed', '#029687', '#976cf6', '#fa503f', 'var(--muted)'];

// ---- Miembros del programa (loyalty_miembros.json) ----
var MB_TIERS = ['Viajero', 'Explorador', 'Global', 'Sin tier'];
// Tiers "reales" sin el balde 'Sin tier' — usado por métricas que solo tienen
// sentido para pasajeros ya categorizados (ej. ratio de acumulación por tier).
var MB_TIER_ORDER_3 = ['Viajero', 'Explorador', 'Global'];
var MB_TIER_COLOR       = { 'Viajero': CAT_FILL[0],  'Explorador': CAT_FILL[1],  'Global': CAT_FILL[2],  'Sin tier': CAT_FILL[4] };
var MB_TIER_COLOR_SOLID  = { 'Viajero': CAT_SOLID[0], 'Explorador': CAT_SOLID[1], 'Global': CAT_SOLID[2], 'Sin tier': CAT_SOLID[4] };

// ---- Club Despegar — suscripción AR (loyalty_club_despegar.json). Se muestra DENTRO
//      de la sección de programa "Club Despegar" (solo Argentina + TOTAL). ----
var CDD_PLANS = ['Plan 1', 'Plan 2', 'Plan 3', 'Plan 4', 'Otro'];
var CDD_PLAN_COLOR_SOLID = { 'Plan 1': CAT_SOLID[0], 'Plan 2': CAT_SOLID[1], 'Plan 3': CAT_SOLID[2], 'Plan 4': CAT_SOLID[3], 'Otro': CAT_SOLID[4] };
var CDD_PLAN_COLOR       = { 'Plan 1': CAT_FILL[0],  'Plan 2': CAT_FILL[1],  'Plan 3': CAT_FILL[2],  'Plan 4': CAT_FILL[3],  'Otro': CAT_FILL[4] };
// ---- iFood — enrolados (loyalty_ifood_enroll.json). Se muestra DENTRO de la sección
//      de programa "IFOOD" (solo Brasil + TOTAL). ----
var IFOOD_TIPOS = ['iFood enrol', 'Club iFood'];
var IFOOD_COLOR = { 'iFood enrol': CAT_FILL[2], 'Club iFood': CAT_FILL[3] };

// ============================================================
// Pasivo — roll-forward mensual del stock de puntos (solo puntos, sin valuación)
//   Saldo_t = Saldo_{t-1} + Acumulación − Redención − Breakage
//   Se EXCLUYEN siempre IFOOD y Acciones Marketing de los 3 flujos.
// ============================================================
var PASIVO_EXCL = ['IFOOD', 'Acciones Marketing'];

// Saldo real por país (puntos) al mes PASIVO_SEED_YM — solapa "Control de Pasivo ML"
// del Cierre 2026 08.xlsx, sumando entidad DOMESTIC + su slice TRAVEL (601).
// El Saldo del dashboard se ancla en ese mes y acumula hacia adelante (+ flujo neto)
// y hacia atrás (− flujo neto del mes siguiente). Actualizar cada cierre nuevo.
var PASIVO_SEED_YM = '2026-08';
var PASIVO_SEED = {
  brasil:    3329803647,   // EL 104 + 601
  argentina: 1267356035,   // EL 101 + 601
  mexico:    1072556160,   // EL 103 + 601
  ecuador:     20266517,   // EL 113 + 601
  colombia:   308545482,   // EL 116 + 601
  peru:       167273957,   // EL 115 + 601
  uruguay:      6448665,   // EL 125 + 601
  chile:        1150683    // EL 108 + 601
};

function getProgramFromAcum(row) {
  var d = (RAW.dict || {}).acum || {};
  var partner = (row.partner && row.partner !== 'N/D') ? row.partner : '';
  var pt  = row.point_type || '';
  var key = partner + pt;
  return d[key] || d[pt] || 'Otros';
}

function getProgramFromReden(row) {
  var d = (RAW.dict || {}).reden || {};
  var pt = row.point_type || '';
  return d[pt] || 'Otros';
}

// Redención: Cobrand y Partners son programas propios pero SUMAN también dentro de
// Pasaporte D! (pedido de Rosario 01-oct). Solo aplica a redención — acumulación y lo
// que deriva de ella (ratio, tier, channel, USD base) siguen sin incluirlos.
function getProgramsFromReden(row) {
  var p = getProgramFromReden(row);
  return (p === 'Cobrand' || p === 'Partners') ? [p, 'Pasaporte D!'] : [p];
}

// Puntos. Los JSON agregados solo traen `points` (= SUM(points) de comarch).
// `points_distribuidos` (el que usa el cierre de Loyalty, ~2-4% menos) NO viene:
// la columna falla vía ODBC. Por eso el SSP calculado difiere ~1% del cierre.
function getPts(row) {
  return Math.abs(+(row.points) || 0);
}

function getUsd(row) { return Math.abs(+(row.descuento_consumo_puntos_usd) || 0); }

// Factor SSP de Facturación por país y mes (= SSP_Calculado * (1 - breakage esperado)).
// Fuente: loyalty_ssp.json (loyalty_sync.py, redenciones Pasaporte D! + breakage_esperado.csv).
// Fallbacks: último mes disponible del país -> constante SSP_BREAKAGE hardcodeada.
function sspFactor(dataKey, ym) {
  var byC = (RAW.ssp && RAW.ssp.data) ? RAW.ssp.data[dataKey] : null;
  if (byC) {
    if (ym && byC[ym]) return byC[ym].ssp_facturacion;
    var ks = Object.keys(byC).sort();
    if (ks.length) return byC[ks[ks.length - 1]].ssp_facturacion;
  }
  return SSP_BREAKAGE[dataKey];
}

// Valor USD de Acumulaciones. Tres métodos, excluyentes por fila:
//  - Cobrand / Partners → `acum_usd_precio`: puntos × precio_facturacion, ya en USD
//    (FX BRL/MXN aplicado por loyalty_sync desde Input_Precios.xlsx). No tienen
//    acum_usd_base, antes daban $0.
//  - IFOOD / Acciones Marketing / Club Despegar (fix 08-sep) → directo `PV`
//    (puntos × factor SSP, signo corregido). Son welcome bonuses / campañas /
//    subscripción sin comisión de reserva de viaje detrás (`acum_usd_base` = 0
//    siempre para los 3 — confirmado contra el JSON real: IFOOD 23,6B ptos/2026,
//    Acciones Marketing ~438M ptos/2026, Club Despegar (SUBS) ~176M ptos/2026,
//    los 3 con acum_usd_base=0 en el 100% de sus filas) → la fórmula DRO de abajo
//    daría $0 siempre (si R=0, el ratio PV/(|PV|+R) da 1 pero se multiplica × R = 0).
//    No hay revenue de viaje que repartir, así que se valúa el punto entero en vez
//    de una porción.
//  - Resto (Pasaporte D! genuino) → método "relative fair value" (DRO, fix 08-sep)
//    para diferir el revenue de la reserva entre el servicio vendido y el "derecho
//    material" (los puntos). La fórmula vieja (|acum_usd_base × factor SSP|) mezclaba
//    unidades (USD × USD/punto) y daba un Valor Acumulado ~6x menor al real
//    (ago-2026 Pasaporte D!: $177k vs $1,13M de Valor Redimido — no cerraba
//    contablemente). Fórmula correcta (Rosario), validada contra ago-2026:
//      R  (Revenue)          = acum_usd_base (Σ(comision+fee+descuentos) ×
//                               (1−pct_pagado_con_puntos), siempre ≥0)
//      PV (Puntos Valuados)  = −(points × factor SSP) — el "−" cancela el
//                              signo negativo del factor SSP (negativo por
//                              convención en este código)
//      DRO (Valor Acumulado) = [PV / (|PV| + R)] × R
//    Da $1.146.115 vs $1.126.805 redimido real (ratio 1,017) para ago-2026
//    Pasaporte D! — antes $177.140 (6,4x de menos).
function getAcumUsd(row, dataKey) {
  var precio = +row.acum_usd_precio || 0;
  if (precio > 0) return precio;
  var factor = sspFactor(dataKey, (row.processing_date || '').substring(0, 7));
  if (factor === undefined || factor === null) return 0;
  var PV = -((+row.points || 0) * factor);
  var prog = getProgramFromAcum(row);
  if (prog === 'IFOOD' || prog === 'Acciones Marketing' || prog === 'Club Despegar') return PV;
  var R = +row.acum_usd_base || 0;
  var denom = Math.abs(PV) + R;
  if (!denom) return 0;
  return (PV / denom) * R;
}


// Bank Revenue (solo Cobrand/Partners): el precio de venta al banco/partner
// (acum_usd_precio, ya en USD — puntos × precio_facturacion de Input_Precios.xlsx)
// se descompone en 2 partes: el costo real de esos puntos cuando se redimen (SSP,
// mismo factor que el resto del dashboard — "no es revenue", es lo que ese punto
// termina costando) y el margen que queda (Bank Revenue real). Filas sin precio
// (acum_usd_precio=0, o programas que no son Cobrand/Partners) no aplican → 0.
// BDBCO (Cobrand Colombia) EXCLUIDO a propósito (08-sep): factura al banco por
// puntos REDIMIDOS en vez de acumulados (regla de negocio dada el 04-sep, ver
// memoria cobrand-partners-precio-venta-vs-ssp) — la fórmula de acá (sobre
// acumulados) no le aplica. Queda pendiente implementar esa lógica aparte.
function _bankRevenueApplies(row) {
  return row.partner !== 'BDBCO' && (+row.acum_usd_precio || 0) > 0;
}
function getBankRevenueCost(row, dataKey) {
  if (!_bankRevenueApplies(row)) return 0;
  var factor = sspFactor(dataKey, (row.processing_date || '').substring(0, 7));
  if (factor === undefined || factor === null) return 0;
  return (+row.points || 0) * Math.abs(factor);
}
function getBankRevenue(row, dataKey) {
  if (!_bankRevenueApplies(row)) return 0;
  var factor = sspFactor(dataKey, (row.processing_date || '').substring(0, 7));
  if (factor === undefined || factor === null) return 0;
  return (+row.acum_usd_precio) - ((+row.points || 0) * Math.abs(factor));
}

// Valor segun modo Q/USD, usado por Redenciones (el toggle vive dentro de cada
// seccion de metrica de negocio, ver SEC_MODE). Acumulaciones usa getAcumUsd.
function valueForMode(row, mode) { return mode === 'USD' ? getUsd(row) : getPts(row); }

// Programs visible for a given country (in display order, filtered by what's in the dict)
function programsForCountry(countryKey) {
  if (countryKey === 'total') return PROGRAMS_ORDER.slice();  // TOTAL muestra todos
  return PROGRAMS_ORDER.filter(function(p) {
    var allowed = PROGRAM_COUNTRIES[p];
    return !allowed || allowed.indexOf(countryKey) !== -1;
  });
}

// ============================================================
// State
// ============================================================
var RAW = { acum_cy: null, acum_ly: null, reden_cy: null, reden_ly: null, breakage: null,
            miembros: null, club: null, ifood: null,
            baseline: null, budget: null, forecast: null, dict: null, ssp: null, ratio_acum: null,
            ratio_acum_tier: null, acum_tier: null };
var LOADED = 0;
var TOTAL  = 25;  // = cantidad de claves que devuelve getAllRaw() en Código.js
var ACTIVE_COUNTRY = 'total';
var CHARTS = {};

// Evolutive charts: eje fijo de 12 meses del anio fiscal (Abr->Mar), independiente
// del filtro de fecha global (que aplica solo a la tabla P&L / KPIs).
// Columna izquierda = FY anterior completo; columna derecha = FY actual (se va
// completando a medida que hay datos nuevos).
var FISCAL_MONTHS = ['04','05','06','07','08','09','10','11','12','01','02','03'];
function fiscalCalYear(mm, startYear) { return mm >= '04' ? startYear : startYear + 1; }
// Año FISCAL (Abr->Mar), identificado por su año de ARRANQUE: cy = FY en curso
// según el último dato cargado (abr-2026..mar-2027 -> cy=2026, se rotula FY27),
// ly = FY anterior (FY26). Antes eran los años CALENDARIO de los archivos
// (acum_2026/acum_2025): el 1-ene se corría al FY siguiente y los rótulos decían
// "2026 vs 2025" en vez de FY27 vs FY26 (12-oct).
function fyYears() {
  var ld = ((RAW.acum_cy||{}).meta||{}).last_date;
  var cy = fyStartYear(ld ? String(ld).substring(0, 7) : new Date().toISOString().substring(0, 7));
  return { ly: cy - 1, cy: cy };
}
// Rótulo del FY por el año en que TERMINA (convención Control de Gestión): 2026 -> 'FY27'.
function fyLbl(startYear) { return 'FY' + String(startYear + 1).slice(2); }

// Switch Cantidad (Q) vs Valor ($) por seccion de metrica de negocio (pais+programa).
// Aplica tanto a Acumulaciones como a Redenciones de esa seccion.
var SEC_MODE = {};
function getSecMode(suffix, prog) { return SEC_MODE[suffix + '|' + prog] || 'USD'; }
function setSecMode(btn, evt) {
  if (evt) evt.stopPropagation();  // el boton vive dentro de .prog-title (header del acordeon)
  var wrap = btn.closest('.seg');
  SEC_MODE[wrap.dataset.suffix + '|' + wrap.dataset.prog] = btn.dataset.v;
  renderCountry(wrap.dataset.suffix);
}

// FALLBACK del factor SSP de Facturación por pais (se usa solo si falta loyalty_ssp.json
// o el mes pedido). Valores del cierre "SSP Facturación" — ojo: MX/CO venían con un
// swap en el Excel; loyalty_ssp.json ya lo calcula bien.
var SSP_BREAKAGE = {
  argentina: -0.005498,
  brasil:    -0.003344,
  mexico:    -0.005063,
  ecuador:   -0.004298,
  colombia:  -0.004834,
  peru:      -0.005063,
  uruguay:   -0.008700,
  chile:     -0.008700,
};

// ============================================================
// Number format helpers
// ============================================================
function getFmt() { return document.getElementById('f-fmt').value; }

// Format P&L values (data is in USD — check units once baseline explored)
function fmtPnl(v, signed) {
  if (v === null || v === undefined) return '—';
  var fmt = getFmt(), sign = v < 0 ? '-' : (signed && v > 0 ? '+' : ''), abs = Math.abs(v);
  if (fmt === 'M')   return sign + '$' + (abs / 1e6).toFixed(2) + 'M';
  if (fmt === 'INT') return sign + '$' + Math.round(abs).toLocaleString();
  return sign + '$' + abs.toFixed(1) + 'K';  // default K
}

// Cantidades (Orders) con el mismo selector de formato que fmtPnl, sin '$'.
function fmtCount(v, signed) {
  if (v === null || v === undefined) return '—';
  var sign = v < 0 ? '-' : (signed && v > 0 ? '+' : '');
  return sign + fmtPts(v);
}

// Format point counts (raw integers)
function fmtPts(v) {
  var fmt = getFmt(), abs = Math.abs(v || 0);
  if (fmt === 'M')   return (abs / 1e6).toFixed(2) + 'M';
  if (fmt === 'INT') return Math.round(abs).toLocaleString();
  return (abs / 1e3).toFixed(1) + 'K';
}

// Format USD values (acum/reden descuento_consumo_puntos_usd — already small USD)
function fmtUSD(v) {
  var fmt = getFmt(), sign = v < 0 ? '-' : '', abs = Math.abs(v || 0);
  if (fmt === 'M')   return sign + '$' + (abs / 1e6).toFixed(3) + 'M';
  if (fmt === 'INT') return sign + '$' + Math.round(abs).toLocaleString();
  return sign + '$' + (abs / 1e3).toFixed(1) + 'K';
}

// Version 1-decimal para los graficos de columnas (bar labels + eje Y) — las cards
// de KPI siguen usando fmtPts/fmtUSD con su precision habitual.
function fmtPtsChart(v) {
  var fmt = getFmt(), abs = Math.abs(v || 0);
  if (fmt === 'M')   return (abs / 1e6).toFixed(1) + 'M';
  if (fmt === 'INT') return Math.round(abs).toLocaleString();
  return (abs / 1e3).toFixed(1) + 'K';
}
function fmtUSDChart(v) {
  var fmt = getFmt(), sign = v < 0 ? '-' : '', abs = Math.abs(v || 0);
  if (fmt === 'M')   return sign + '$' + (abs / 1e6).toFixed(1) + 'M';
  if (fmt === 'INT') return sign + '$' + Math.round(abs).toLocaleString();
  return sign + '$' + (abs / 1e3).toFixed(1) + 'K';
}

// Precio por punto (USD/pt) — valores chicos, precision propia (no sigue fmtPtsChart/fmtUSDChart).
function fmtPricePerPt(v) { return (v || 0).toFixed(4).replace('.', ','); }

function fmtPct(v, ref) {
  if (!ref) return '<span class="neu">—</span>';
  var p = (v - ref) / Math.abs(ref) * 100;
  return '<span class="' + (p >= 0 ? 'pos' : 'neg') + '">' + (p >= 0 ? '+' : '') + p.toFixed(1) + '%</span>';
}

function vc(v) { return v > 0 ? 'vp' : v < 0 ? 'vn' : 'vz'; }

// ============================================================
// Compact expander
// ============================================================
function expand(raw) {
  if (!raw) return [];
  var d = raw.data || raw;
  if (Array.isArray(d)) return d;
  var cols = d.cols || raw.cols, rows = d.rows || raw.rows;
  if (!cols || !rows) return [];
  return rows.map(function(r) {
    var o = {};
    for (var i = 0; i < cols.length; i++) o[cols[i]] = r[i];
    return o;
  });
}

function expandBaseline(raw) {
  if (!raw) return [];
  if (raw.cols && raw.rows) {
    return raw.rows.map(function(r) {
      var o = {};
      for (var i = 0; i < raw.cols.length; i++) o[raw.cols[i]] = r[i];
      return o;
    });
  }
  return expand(raw);
}

// ============================================================
// Filter state
// ============================================================
function getRange() {
  return { from: document.getElementById('f-from').value, to: document.getElementById('f-to').value };
}

// Escenario "goal" para el P&L Contable comparativo: 'budget' (default) | 'runrate' | 'forecast'
function getScenario() {
  var el = document.getElementById('f-scenario');
  return el ? el.value : 'budget';
}
function scenarioLabel(s) { return s === 'budget' ? 'Budget' : s === 'runrate' ? 'Run Rate' : 'Forecast'; }

// Agrupacion de columnas del P&L Contable: 'month' | 'quarter' | 'half'
function getPeriodMode() {
  var el = document.getElementById('f-period');
  return el ? el.value : 'month';
}
// Trimestre fiscal (Abr->Mar) segun el mes calendario "MM".
var PNL_Q = { '04':'Q1','05':'Q1','06':'Q1','07':'Q2','08':'Q2','09':'Q2',
              '10':'Q3','11':'Q3','12':'Q3','01':'Q4','02':'Q4','03':'Q4' };
var PNL_H = { Q1: 'H1', Q2: 'H1', Q3: 'H2', Q4: 'H2' };
// withFy: si el rango cruza mas de un año fiscal, Q1/H1 de FY distintos no deben
// sumarse en la misma columna -> la clave lleva el FY (ej. 'Q1 FY27' = abr-jun 2026).
function pnlPeriodKey(ym, mode, withFy) {
  if (mode === 'month') return ym;
  var q = PNL_Q[ym.substring(5, 7)];
  var k = mode === 'quarter' ? q : PNL_H[q];
  // FY se nombra por el año en que TERMINA (convención de Control de Gestión/B2B):
  // abr-2026..mar-2027 = FY27.
  return withFy ? k + ' FY' + String(fyStartYear(ym) + 1).slice(2) : k;
}

function inRange(ym, from, to) {
  if (from && ym < from) return false;
  if (to   && ym > to)   return false;
  return true;
}


// ============================================================
// P&L group classifier
// ============================================================
function classifyN1(n1) {
  var norm = (n1 || '').toLowerCase().replace(/^loyalty\s*[-–]\s*/i, '').trim();
  for (var g = 0; g < PNL_GROUPS.length; g++) {
    var kws = PNL_GROUPS[g].keywords;
    for (var k = 0; k < kws.length; k++) {
      if (norm.indexOf(kws[k]) !== -1) return PNL_GROUPS[g].label;
    }
  }
  return 'Otros';
}

// ============================================================
// P&L data builder
// ============================================================
var _pnlSchemaWarned = false;
function buildPnl(country) {
  var rows = expandBaseline(RAW.baseline);
  var r = getRange();
  // Si NO hay NINGUNA fila loyalty en todo el baseline (sin filtro de país/fecha),
  // el problema no es el período: cambió el esquema o el nombre del LOB en
  // Inputs_Planning_PnL (repo B2B). Avisar una vez en consola.
  if (rows.length && !_pnlSchemaWarned &&
      !rows.some(function(row){ return (row['P&L N1'] || '').toLowerCase().indexOf('loyalty') !== -1; })) {
    _pnlSchemaWarned = true;
    console.error('[P&L] 0 filas "loyalty" en baseline_actuals+projections.json — ' +
      'revisar nombres de columna / LOB en Inputs_Planning_PnL (repo B2B_Ecosystem).');
  }
  var filtered = rows.filter(function(row) {
    return matchCountryRow(row['Pais'], country)
        && (row['P&L N1'] || '').toLowerCase().indexOf('loyalty') !== -1
        && inRange((row['Fecha'] || '').substring(0, 7), r.from, r.to);
  });
  if (!filtered.length) return null;

  var monthSet = {}, lineSet = {};
  filtered.forEach(function(row) {
    monthSet[(row['Fecha'] || '').substring(0, 7)] = 1;
    lineSet[row['P&L N1'] || 'N/D'] = 1;
  });
  var months = Object.keys(monthSet).sort();

  // Escenarios (budget / forecast) — mapas mensuales por linea, mismo set de
  // meses que el baseline. Fuente: JSON canonicos de Inputs_Planning_PnL.
  var scn = scenarioLoyaltyPnl(country, months);
  Object.keys(scn.budget).forEach(function(l){ lineSet[l] = 1; });
  Object.keys(scn.forecast).forEach(function(l){ lineSet[l] = 1; });
  Object.keys(scn.runrate).forEach(function(l){ lineSet[l] = 1; });
  var lines = Object.keys(lineSet).sort();

  // agg[line] = {ym: monto}
  var agg = {};
  lines.forEach(function(l) { agg[l] = {}; });
  filtered.forEach(function(row) {
    var l = row['P&L N1'] || 'N/D', m = (row['Fecha'] || '').substring(0, 7);
    agg[l][m] = (agg[l][m] || 0) + (parseFloat(row['Monto USD']) || 0);
  });

  // Drivers B2C del baseline (mismos meses que las lineas de loyalty)
  var drv = {};
  PNL_DRIVERS.forEach(function(dd){ drv[dd.label] = {}; });
  rows.forEach(function(row) {
    var lbl = driverOf(row['P&L N1']);
    if (!lbl || !matchCountryRow(row['Pais'], country)) return;
    var m = (row['Fecha'] || '').substring(0, 7);
    if (months.indexOf(m) === -1) return;
    drv[lbl][m] = (drv[lbl][m] || 0) + (parseFloat(row['Monto USD']) || 0);
  });

  // Grupos → lineas ordenadas por PNL_GROUPS + 'Otros'
  var groups = {};
  PNL_GROUPS.forEach(function(g) { groups[g.label] = { lines: [] }; });
  groups['Otros'] = { lines: [] };
  lines.forEach(function(l) {
    var grp = classifyN1(l);
    if (!groups[grp]) groups[grp] = { lines: [] };
    groups[grp].lines.push(l);
  });

  return { months: months, lines: lines, agg: agg, groups: groups, scn: scn, drv: drv };
}

// Por escenario: { line: {ym: monto} } de loyalty para el pais, restringido a
// monthArr (los meses del baseline ya filtrados por el rango de fecha global).
function scenarioLoyaltyPnl(country, monthArr) {
  var monthSet = {};
  monthArr.forEach(function(m){ monthSet[m] = 1; });
  // drv[escenario][driver] = {ym: monto} — Drivers B2C, aparte de las lineas loyalty
  var out = { budget: {}, forecast: {}, runrate: {}, drv: { budget: {}, forecast: {}, runrate: {} } };
  ['budget', 'forecast', 'runrate'].forEach(function(s) {
    var byLine = out[s], byDrv = out.drv[s];
    expandBaseline(RAW[s]).forEach(function(row) {
      if (!matchCountryRow(row['Pais'], country)) return;
      var l = row['P&L N1'] || 'N/D';
      var ym = (row['Fecha'] || '').substring(0, 7);
      if (!monthSet[ym]) return;
      var v = parseFloat(row['Monto USD']) || 0;
      var dl = driverOf(l);
      if (dl) { if (!byDrv[dl]) byDrv[dl] = {}; byDrv[dl][ym] = (byDrv[dl][ym] || 0) + v; return; }
      if (l.toLowerCase().indexOf('loyalty') === -1) return;
      if (!byLine[l]) byLine[l] = {};
      byLine[l][ym] = (byLine[l][ym] || 0) + v;
    });
  });
  return out;
}

// Suma un mapa {ym: val} de varias lineas en un solo {ym: val}.
function mergeMonthly(maps) {
  var o = {};
  maps.forEach(function(mm) {
    Object.keys(mm || {}).forEach(function(ym){ o[ym] = (o[ym] || 0) + mm[ym]; });
  });
  return o;
}

// ============================================================
// Render P&L table — Baseline | Goal | Baseline−Goal, agrupado por Mes/Quarter/Half
// (mismo layout que P&L Accounting de B2B)
// ============================================================
function renderPnl(containerId, country) {
  var el = document.getElementById(containerId);
  if (!el) return;
  var d = buildPnl(country);
  if (!d || !d.lines.length) {
    el.innerHTML = '<div class="empty">Sin datos de P&L Loyalty para ' + country.label + ' en el período seleccionado.</div>';
    return;
  }

  var mode = getPeriodMode();          // 'month' | 'quarter' | 'half'
  var GOAL = getScenario();            // 'budget' | 'runrate' | 'forecast'
  var goalMaps = d.scn[GOAL];

  // Periodos presentes (segun los meses del baseline), + columna Total
  // d.months viene en orden calendario; como el rango es continuo, ese orden ya es
  // el fiscal (Abr->Mar) dentro de cada FY y entre FYs consecutivos.
  var fys = {};
  d.months.forEach(function(ym){ fys[fyStartYear(ym)] = 1; });
  var withFy = Object.keys(fys).length > 1;
  var periods = [];
  d.months.forEach(function(ym){
    var pk = pnlPeriodKey(ym, mode, withFy);
    if (periods.indexOf(pk) === -1) periods.push(pk);
  });
  var cols = periods.concat(['TOT']);
  var n = cols.length;
  function pLabel(p) { return p === 'TOT' ? 'Total' : (mode === 'month' ? fmtMonthLbl(p) : p); }

  // {ym: val} -> {periodKey: val} (incluye TOT = suma de todo)
  function toPeriods(monthMap) {
    var o = {}; cols.forEach(function(c){ o[c] = 0; });
    Object.keys(monthMap || {}).forEach(function(ym){
      var v = monthMap[ym] || 0, pk = pnlPeriodKey(ym, mode, withFy);
      if (o[pk] !== undefined) o[pk] += v;
      o.TOT += v;
    });
    return o;
  }

  // pctMap (opcional): {periodo: % sobre GB} -> segunda línea chica en la celda.
  // pctPP: el % ya es una diferencia en pp (bloque Δ).
  function valCells(pmap, colored, signed, fmtFn, pctMap, pctPP) {
    var f = fmtFn || fmtPnl, s = '';
    cols.forEach(function(c){
      var v = pmap[c] || 0;
      var col = colored ? vc(v) : (v ? 'vf' : 'vz');  // sin criterio -> color fijo (vf); vacio -> vz
      var pc = pctMap ? pctMap[c] : null, pTxt = '';
      if (pc !== null && pc !== undefined && isFinite(pc) && v) {
        pTxt = '<div class="pgb">' + (pctPP ? (pc > 0 ? '+' : '') + pc.toFixed(2) + 'pp' : pc.toFixed(2) + '%') + '</div>';
      }
      s += '<td class="' + (c === 'TOT' ? 'tc ' : '') + col + '">' + (v ? f(v, signed) : '—') + pTxt + '</td>';
    });
    return s;
  }
  // GB por período de cada escenario (denominador del %GB). Toda línea del P&L
  // (salvo Orders y el propio GB) muestra su % sobre el GB B2C del mismo escenario.
  var gbBaseP = toPeriods(d.drv['Gross Bookings']);
  var gbGoalP = toPeriods((d.scn.drv[GOAL] || {})['Gross Bookings']);
  function pctOf(pm, gbp) {
    var o = {};
    cols.forEach(function(c){ if (gbp[c]) o[c] = (pm[c] || 0) / gbp[c] * 100; });
    return o;
  }
  // fila completa: baseline | sep | goal | sep | (baseline - goal)
  // Criterio de color (verde/rojo): en Baseline+Goal solo si es fila resumen
  // (subtotal / total); el bloque Delta SIEMPRE va con color.
  function rowBGD(baseMap, goalMap, summary, fmtFn, noPct) {
    var bp = toPeriods(baseMap), gp = toPeriods(goalMap), dp = {};
    cols.forEach(function(c){ dp[c] = (bp[c] || 0) - (gp[c] || 0); });
    var bPct = noPct ? null : pctOf(bp, gbBaseP), gPct = noPct ? null : pctOf(gp, gbGoalP), dPct = null;
    if (!noPct) {
      dPct = {};
      cols.forEach(function(c){ if (bPct[c] !== undefined && gPct[c] !== undefined) dPct[c] = bPct[c] - gPct[c]; });
    }
    return valCells(bp, summary, false, fmtFn, bPct) + '<td class="sep"></td>' + valCells(gp, summary, false, fmtFn, gPct)
         + '<td class="sep"></td>' + valCells(dp, true, true, fmtFn, dPct, true);  // bloque Delta: +/- explicito, %GB en pp
  }
  function emptyRow() {
    var s = '';
    for (var b = 0; b < 3; b++) {
      for (var i = 0; i < n; i++) s += '<td></td>';
      if (b < 2) s += '<td class="sep"></td>';
    }
    return s;
  }

  var html = '<div class="tbl-scroll"><table class="pnl"><thead>';
  html += '<tr class="bg-scen"><th class="lc"></th>'
        + '<th class="bg-b" colspan="' + n + '">BASELINE</th><th class="sep"></th>'
        + '<th class="bg-g" colspan="' + n + '">GOAL · ' + scenarioLabel(GOAL) + '</th><th class="sep"></th>'
        + '<th class="bg-d" colspan="' + n + '">&Delta; BASELINE &minus; GOAL</th></tr>';
  html += '<tr><th class="lc">Línea P&L</th>';
  for (var blk = 0; blk < 3; blk++) {
    var phCls = ['ph-b', 'ph-g', 'ph-d'][blk];
    cols.forEach(function(c){ html += '<th class="' + phCls + (c === 'TOT' ? ' tc' : '') + '">' + pLabel(c) + '</th>'; });
    if (blk < 2) html += '<th class="sep"></th>';
  }
  html += '</tr></thead><tbody>';

  // Bloque Drivers B2C (contexto, NO suma al TOTAL LOYALTY)
  var goalDrv = d.scn.drv[GOAL] || {};
  html += '<tr class="grp-hdr"><td class="lc">Drivers B2C <span class="drv-note">(no suman al Total Loyalty)</span></td>'
        + emptyRow() + '</tr>';
  PNL_DRIVERS.forEach(function(dd) {
    html += '<tr><td class="lc">' + dd.label + '</td>'
          + rowBGD(d.drv[dd.label], goalDrv[dd.label], false, dd.unit === 'count' ? fmtCount : fmtPnl,
                   dd.label === 'Orders' || dd.label === 'Gross Bookings') + '</tr>';
  });

  var groupOrder = PNL_GROUPS.map(function(g){ return g.label; }).concat(['Otros']);

  groupOrder.forEach(function(grpLabel) {
    var grp = d.groups[grpLabel];
    if (!grp || !grp.lines.length) return;

    html += '<tr class="grp-hdr"><td class="lc">' + grpLabel + '</td>' + emptyRow() + '</tr>';

    grp.lines.forEach(function(line) {
      html += '<tr><td class="lc">' + line + '</td>'
            + rowBGD(d.agg[line], goalMaps[line], false) + '</tr>';
    });

    var baseGrp = mergeMonthly(grp.lines.map(function(l){ return d.agg[l]; }));
    var goalGrp = mergeMonthly(grp.lines.map(function(l){ return goalMaps[l]; }));
    html += '<tr class="subtotal"><td class="lc">Subtotal ' + grpLabel + '</td>'
          + rowBGD(baseGrp, goalGrp, true) + '</tr>';
  });

  var baseAll = mergeMonthly(d.lines.map(function(l){ return d.agg[l]; }));
  var goalAll = mergeMonthly(d.lines.map(function(l){ return goalMaps[l]; }));
  html += '<tr class="grand-total"><td class="lc">TOTAL LOYALTY</td>'
        + rowBGD(baseAll, goalAll, true) + '</tr>';

  html += '</tbody></table></div>';
  html += '<div class="proj-note">Baseline = actuals (meses cerrados) + run-rate + forecast · Goal = '
        + scenarioLabel(GOAL) + ' · Δ = Baseline &minus; Goal'
        // runrate.json canonico: los meses proyectados del Baseline SALEN del Run
        // Rate, asi que ahi el Δ da 0 por construccion — aclararlo para que no
        // se lea como "sin desvio". Orders viene en 0 en los meses cerrados.
        + (GOAL === 'runrate' ? '<br><strong>Run Rate</strong>: en los meses proyectados el Baseline '
           + 'se arma con este mismo Run Rate, por eso ahí el Δ es 0. Orders del Run Rate solo '
           + 'viene cargado en los meses proyectados.' : '')
        + '<br><strong>Drivers B2C</strong> (Orders, GB, Up Front + Fees = Up Front Incentives + Fees '
        + '+ Commercial Discounts): total B2C del país, contexto del negocio — no suman al Total Loyalty.'
        + '<br><strong>% GB</strong> (debajo de cada monto) = monto / Gross Bookings B2C del mismo escenario y período; '
        + 'en Δ, diferencia en puntos porcentuales.'
        + '</div>';
  el.innerHTML = html;
}

// ============================================================
// Metrics data by program
// ============================================================
function buildMetrics(country) {
  var r = getRange();

  function filterCY(rows) {
    return rows.filter(function(row) {
      return matchCountryCode(row.country_code, country)
          && inRange((row.processing_date || '').substring(0, 7), r.from, r.to);
    });
  }
  function filterLY(rows) {
    return rows.filter(function(row) {
      var ym = (row.processing_date || '').substring(0, 7);
      var cy = ym ? (String(+ym.substring(0,4)+1) + ym.substring(4)) : '';
      return matchCountryCode(row.country_code, country) && inRange(cy, r.from, r.to);
    });
  }

  // CY y LY se filtran sobre los DOS archivos: el FY (abr->mar) cruza el año
  // calendario, así que ene-mar del FY26 viven en acum_2026, no en acum_2025.
  var acAll = expand(RAW.acum_cy).concat(expand(RAW.acum_ly));
  var rdAll = expand(RAW.reden_cy).concat(expand(RAW.reden_ly));
  var acCY = filterCY(acAll);
  var acLY = filterLY(acAll);
  var rdCY = filterCY(rdAll);
  var rdLY = filterLY(rdAll);
  var bkAll = Array.isArray((RAW.breakage || {}).data) ? RAW.breakage.data : expand(RAW.breakage);
  var bkIsoSet = isTotal(country)
    ? COUNTRY_DATAKEYS.map(function(k){ return COUNTRY_ISO[k] || k; })
    : [COUNTRY_ISO[country.dataKey] || country.dataKey];
  var bkCY  = bkAll.filter(function(b){ return bkIsoSet.indexOf((b.country || '').toLowerCase()) !== -1; });

  function aggAcum(rows) {
    var pts = 0, usd = 0, br = 0, byProg = {};
    rows.forEach(function(row) {
      var dk = rowCountryKey(row, country);
      var p = getPts(row), u = getAcumUsd(row, dk), b = getBankRevenue(row, dk);
      pts += p; usd += u; br += b;
      var prog = getProgramFromAcum(row);
      if (!byProg[prog]) byProg[prog] = { pts: 0, usd: 0, br: 0 };
      byProg[prog].pts += p; byProg[prog].usd += u; byProg[prog].br += b;
    });
    return { pts: pts, usd: usd, br: br, byProg: byProg };
  }

  function aggReden(rows) {
    var pts = 0, usd = 0, byProg = {};
    rows.forEach(function(row) {
      var p = getPts(row), u = Math.abs(+(row.descuento_consumo_puntos_usd) || 0);
      pts += p; usd += u;
      getProgramsFromReden(row).forEach(function(prog) {
        if (!byProg[prog]) byProg[prog] = { pts: 0, usd: 0 };
        byProg[prog].pts += p; byProg[prog].usd += u;
      });
    });
    return { pts: pts, usd: usd, byProg: byProg };
  }

  var bkTotal = bkCY.reduce(function(s, b){ return s + Math.abs(+(b.points) || 0); }, 0);

  // Mensual por programa, sin filtro de rango (lo aplica ytdVs): base de las
  // comparaciones de KPI a meses cerrados (FY27 YTD vs FY26 mismos meses / vs Budget).
  // acM[prog][ym] = {pts, usd, br} · rdM[prog][ym] = {pts, usd}
  var acM = {}, rdM = {};
  function slot(o, prog, ym) { o[prog] = o[prog] || {}; return (o[prog][ym] = o[prog][ym] || { pts: 0, usd: 0, br: 0 }); }
  acAll.forEach(function(row) {
    if (!matchCountryCode(row.country_code, country)) return;
    var ym = (row.processing_date || '').substring(0, 7), dk = rowCountryKey(row, country);
    var o = slot(acM, getProgramFromAcum(row), ym);
    o.pts += getPts(row); o.usd += getAcumUsd(row, dk); o.br += getBankRevenue(row, dk);
  });
  rdAll.forEach(function(row) {
    if (!matchCountryCode(row.country_code, country)) return;
    var ym = (row.processing_date || '').substring(0, 7);
    var p = getPts(row), u = Math.abs(+(row.descuento_consumo_puntos_usd) || 0);
    getProgramsFromReden(row).forEach(function(prog) { var o = slot(rdM, prog, ym); o.pts += p; o.usd += u; });
  });

  return { acM: acM, rdM: rdM,
           acCY: aggAcum(acCY), acLY: aggAcum(acLY), rdCY: aggReden(rdCY), rdLY: aggReden(rdLY),
           bkTotal: bkTotal, mb: buildMiembros(country),
           cdd: buildClubDespegar(country), ifd: buildIfood(country) };
}

// Club Despegar (suscripción AR). serie del JSON: 'stock' | 'alta' | 'baja'.
// - stockByPlanYm[plan][ym]: base activa acumulada (suscripciones que HOY siguen ACTIVE,
//   por mes de alta). Monótona. En el último mes == suscriptos actuales por plan.
// - stockByYm: total (suma de planes) por mes.
// - byPlan / activos: último mes del stock = foto actual.
// - altasByYm (confiable) / bajasByYm (timing aprox: updated_at está bulk-touched).
function buildClubDespegar(country) {
  var rows = expand(RAW.club).filter(function(r){ return matchCountryRow(r.country, country); });
  var stockByPlanYm = {}, altasByYm = {}, bajasByYm = {}, ymSet = {};
  CDD_PLANS.forEach(function(p){ stockByPlanYm[p] = {}; });
  rows.forEach(function(r){
    var n = +r.n || 0, ym = (r.ym || '').substring(0, 7);
    if (ym.length !== 7) return;
    var p = CDD_PLANS.indexOf(r.plan_type) !== -1 ? r.plan_type : 'Otro';
    if (r.serie === 'stock')      { stockByPlanYm[p][ym] = (stockByPlanYm[p][ym] || 0) + n; ymSet[ym] = 1; }
    else if (r.serie === 'alta')  { altasByYm[ym] = (altasByYm[ym] || 0) + n; }
    else if (r.serie === 'baja')  { bajasByYm[ym] = (bajasByYm[ym] || 0) + n; }
  });
  var yms = Object.keys(ymSet).sort();
  var stockByYm = {};
  yms.forEach(function(ym){
    var t = 0; CDD_PLANS.forEach(function(p){ t += stockByPlanYm[p][ym] || 0; });
    stockByYm[ym] = t;
  });
  var lastYm = yms.length ? yms[yms.length - 1] : '';
  var byPlan = {}, activos = 0;
  CDD_PLANS.forEach(function(p){ var v = stockByPlanYm[p][lastYm] || 0; byPlan[p] = v; activos += v; });
  return { stockByPlanYm: stockByPlanYm, stockByYm: stockByYm, altasByYm: altasByYm,
           bajasByYm: bajasByYm, byPlan: byPlan, activos: activos, lastYm: lastYm };
}

// iFood enrolados: altas por mes de 'iFood enrol' (cross_cashback) y 'Club iFood'
// (closed_loop_discount). Sin dimensión país (es todo Brasil).
function buildIfood(country) {
  var rows = expand(RAW.ifood);
  var byTipo = {}, altasByTipoYm = {}, altasByYm = {};
  IFOOD_TIPOS.forEach(function(t){ byTipo[t] = 0; altasByTipoYm[t] = {}; });
  rows.forEach(function(r){
    if (IFOOD_TIPOS.indexOf(r.tipo) === -1) return;
    var ym = (r.ym || '').substring(0, 7), n = +r.n || 0;
    if (ym.length !== 7) return;
    byTipo[r.tipo] += n;
    altasByTipoYm[r.tipo][ym] = (altasByTipoYm[r.tipo][ym] || 0) + n;
    altasByYm[ym] = (altasByYm[ym] || 0) + n;
  });
  return { byTipo: byTipo, altasByTipoYm: altasByTipoYm, altasByYm: altasByYm,
           total: byTipo['iFood enrol'] + byTipo['Club iFood'] };
}

// Miembros del programa: snapshot del padron activo abierto por mes de alta y tier.
// - byTier / total: foto actual (suma de todas las cohortes).
// - altasByYm / altasByTierYm: altas por mes de enrolment (los meses viejos solo
//   incluyen a los que HOY siguen activos → hay sesgo de supervivencia).
// - stockByYm: miembros acumulados a fin de cada mes (cumsum de las altas).
function buildMiembros(country) {
  var rows = expand(RAW.miembros).filter(function(row){ return matchCountryRow(row.country, country); });
  var byTier = {}, total = 0, altasByYm = {}, altasByTierYm = {};
  MB_TIERS.forEach(function(t){ byTier[t] = 0; altasByTierYm[t] = {}; });
  rows.forEach(function(row){
    var t  = MB_TIERS.indexOf(row.tier) !== -1 ? row.tier : 'Sin tier';
    var ym = (row.ym || '').substring(0, 7);
    var n  = +row.clientes || 0;
    if (ym.length !== 7) return;
    byTier[t] += n; total += n;
    altasByYm[ym] = (altasByYm[ym] || 0) + n;
    altasByTierYm[t][ym] = (altasByTierYm[t][ym] || 0) + n;
  });
  var stockByYm = {}, run = 0;
  Object.keys(altasByYm).sort().forEach(function(ym){ run += altasByYm[ym]; stockByYm[ym] = run; });
  return { total: total, byTier: byTier, altasByYm: altasByYm,
           altasByTierYm: altasByTierYm, stockByYm: stockByYm };
}

// Id de ancla de cada seccion de programa (para los chips de indice).
function progSecId(prog, suffix) { return 'sec-' + prog.replace(/[^a-z0-9]/gi, '') + '-' + suffix; }
// Salto suave a una seccion (el scroll-margin-top de .prog-section evita que la
// barra sticky la tape). Si la seccion esta colapsada la abre primero — si no,
// el chip hace scroll a un header vacio y hay que clickear una segunda vez.
function jumpTo(id) {
  if (PROG_OPEN[id] === false) { PROG_OPEN[id] = true; renderCountry(id.split('-').pop()); }
  var e = document.getElementById(id);
  if (e) e.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---- Acordeon de secciones de programa ----
// Estado abierto/cerrado por id de seccion, persiste entre renders (mismo patron
// que SEC_MODE) para no perder lo que el usuario abrio/cerro al cambiar de pais o
// de filtro. Por defecto solo Miembros y "Pasaporte D!" arrancan abiertos — el
// resto (otros programas + Breakage) arranca colapsado para que la pagina, cada
// vez mas larga, no sea kilometrica.
// OJO: a diferencia de getSecMode (lectura pura), progOpen ESCRIBE PROG_OPEN[id]
// la primera vez que se llama para ese id — memoriza el default recibido. Cada
// id de seccion debe tener un unico call-site; si se llama dos veces para el
// mismo id con defaults distintos, gana el que se ejecute primero (silencioso).
var PROG_OPEN = {};
function progOpen(id, dflt) {
  if (!(id in PROG_OPEN)) PROG_OPEN[id] = dflt;
  return PROG_OPEN[id];
}
function toggleProgSection(id, suffix) {
  PROG_OPEN[id] = !PROG_OPEN[id];
  renderCountry(suffix);  // re-render completo del pais, igual que setSecMode
}
function progTitleKeydown(evt, id, suffix) {
  // El toggle Q/$ anida DENTRO de este header en las secciones de programa. Un
  // <button> real ya maneja su propio Enter/Espacio (dispara su click, con su
  // propio stopPropagation en setSecMode) — si no filtramos por target acá, el
  // keydown burbujea antes que ese click y este handler colapsa/expande la
  // seccion de yapa. setSecMode no lo puede evitar: su guard es solo de click.
  if (evt.target.closest('.seg')) return;
  // Enter/Espacio activan el toggle igual que un click (el header es un <div
  // role="button">, no un <button>, porque adentro anida el seg Q/$ de algunos programas).
  if (evt.key === 'Enter' || evt.key === ' ') { evt.preventDefault(); toggleProgSection(id, suffix); }
}
function progTitleAttrs(id, suffix, open) {
  return 'role="button" tabindex="0" aria-expanded="' + (open ? 'true' : 'false') + '" '
    + 'aria-controls="' + id + '-body" '
    + 'onclick="toggleProgSection(\'' + id + '\',\'' + suffix + '\')" '
    + 'onkeydown="progTitleKeydown(event,\'' + id + '\',\'' + suffix + '\')"';
}

// ============================================================
// Comparación vs proyección en Métricas de Negocio (12-oct): en los gráficos que
// tienen proyección, la proyección es una TERCERA BARRA (FY anterior | Budget o
// Run Rate | FY en curso); clic en la leyenda la oculta (o la del FY anterior).
// Selector Budget / Run Rate dentro de la tarjeta (uno cambia todos). La
// proyección (loyalty_proyecciones.json, de Input_budget.xlsx / Input_runrate.xlsx)
// está en PUNTOS: la tercera barra solo aparece con la sección en vista Q.
// ============================================================
var METRICS_CMP = 'budget';   // 'budget' | 'runrate'
function setMetricsCmp(v, evt) { if (evt) evt.stopPropagation(); METRICS_CMP = v; renderActive(); }
function cmpHasEsc(esc) { return expand(RAW.proy).some(function(p){ return p.escenario === esc; }); }
function cmpGoalActive() { return cmpHasEsc(METRICS_CMP); }
function cmpLabel() { return scenarioLabel(METRICS_CMP) + ' ' + fyLbl(fyYears().cy); }
function goalSegHtml() {

  ['budget', 'runrate'].forEach(function(e) {

    h += '<button class="seg-btn' + (METRICS_CMP === e ? ' active' : '') + '" type="button"'
