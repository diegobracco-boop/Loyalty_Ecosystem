<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loyalty Dashboard — Despegar</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root {
  --bg:      #f1f5f9;
  --surface: #ffffff;
  --border:  #e2e8f0;
  --text:    #1e293b;
  --muted:   #556070;   /* gris con contraste AA (6.2:1 sobre #f8fafc) para labels/th */
  --accent:  #550fed;   /* LILA-1 oficial Despegar */
  --accent-a08: rgba(85,15,237,.08);
  --accent-a15: rgba(85,15,237,.15);
  --green:   #1a7f37;   /* verde con contraste AA para texto de tabla */
  --red:     #cf222e;   /* rojo con contraste AA para texto de tabla */
  --amber:   #d97706;
  --radius:  10px;
  --proj-bg: #fafaf7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 14px; }

/* ---- Header ---- */
.header { background: linear-gradient(90deg, #3d00d1 0%, #550fed 100%); color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.header-title { font-size: 17px; font-weight: 800; }
.header-sub   { font-size: 11px; color: #94a3b8; margin-top: 2px; }
.header-sync  { font-size: 11px; color: #94a3b8; }

/* ---- Sticky topbar (barra de pais + filtros) ---- */
.topbar { position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 8px rgba(15,23,42,.08); }

/* ---- Country tabs ---- */
.country-tabs { display: flex; gap: 2px; background: #0f172a; padding: 0 20px; border-bottom: 2px solid #1e293b; overflow-x: auto; }
.ctab { padding: 11px 18px; font-size: 13px; font-weight: 600; color: #94a3b8; cursor: pointer; border: none; background: none; border-bottom: 3px solid transparent; white-space: nowrap; transition: .15s; }
.ctab:hover  { color: #e2e8f0; }
.ctab.active { color: #fff; border-bottom-color: var(--accent); }
.ctab-manual { margin-left: auto; color: #c4b5fd; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
.ctab-manual:hover { color: #fff; background: var(--accent-a15); }

/* ---- Filters ---- */
.filters { display: flex; align-items: center; gap: 14px; padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.fg { display: flex; flex-direction: column; gap: 3px; }
.fl { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
select, input[type=month] {
  padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px;
  background: #f8fafc; font-size: 13px; color: var(--text); cursor: pointer;
}
select:focus-visible, input[type=month]:focus-visible,
button:focus-visible, .ctab:focus-visible, .prog-chip:focus-visible, .seg-btn:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
}
.fsep { width: 1px; height: 34px; background: var(--border); margin: 0 4px; }

/* ---- Main ---- */
/* Columna de contenido angosta y CENTRADA (margenes iguales a ambos lados).
   Todo el tablero (P&L + metricas) vive dentro de este ancho. */
.main { padding: 18px 20px; max-width: 1150px; margin: 0 auto; }

/* ---- Banner ---- */
.banner { display: flex; align-items: flex-start; gap: 10px; border-radius: var(--radius); padding: 14px 18px; margin-bottom: 20px; border-left: 4px solid; }
.banner.warning { background: #fef3c7; border-color: var(--amber); }
.banner.warning .bt { color: #92400e; }
.banner.wip { background: #f0fdf4; border-color: var(--green); }
.banner.wip .bt { color: #166534; }
.bt { font-size: 13px; font-weight: 600; line-height: 1.4; }
.bt strong { font-weight: 800; }

/* ---- Section title ---- */
.stitle { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .6px; border-bottom: 2px solid var(--accent); padding-bottom: 5px; margin: 20px 0 14px; }

/* ---- P&L table ---- */
/* El P&L rompe la columna centrada del .main y se extiende casi a todo el ancho
   de la pantalla (margen casi nulo), centrado. El resto del contenido sigue en
   la columna angosta. Tecnica full-bleed via vw (el margen es > que el scrollbar
   para no generar scroll horizontal). */
.pnl-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; width: calc(100vw - 40px); margin-left: calc(50% - 50vw + 20px); }
.tbl-scroll { overflow-x: auto; }
table.pnl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.pnl th {
  padding: 10px 14px; text-align: right; font-size: 10.5px; font-weight: 700;
  color: var(--muted); text-transform: uppercase; letter-spacing: .3px;
  background: #f8fafc; border-bottom: 1px solid var(--border); white-space: nowrap;
}
table.pnl th.lc { text-align: left; min-width: 260px; position: sticky; left: 0; background: #f8fafc; z-index: 2; }
table.pnl td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; text-align: right; white-space: nowrap; }
table.pnl td.lc { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; padding-left: 28px; }
table.pnl tr:hover td, table.pnl tr:hover td.lc { background: #f8fafc; }

/* Scenario header row (BASELINE | GOAL | Δ) */
table.pnl tr.bg-scen th { text-align: center; font-size: 10px; font-weight: 800; letter-spacing: .6px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
/* Mismo color-coding que P&L Accounting de B2B: BASELINE lila · GOAL azul · Δ verde */
table.pnl tr.bg-scen th.bg-b { background: #ede9fe; color: #4c1d95; }
table.pnl tr.bg-scen th.bg-g { background: #e0f2fe; color: #0369a1; }
table.pnl tr.bg-scen th.bg-d { background: #f0fdf4; color: #166534; }
table.pnl tr.bg-scen th.lc { background: #f8fafc; }

/* Group header row */
table.pnl tr.grp-hdr td { background: #f0f4ff; font-weight: 700; font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: .4px; border-top: 2px solid #c7d2fe; border-bottom: 1px solid #c7d2fe; padding: 6px 14px; }
table.pnl tr.grp-hdr td.lc { background: #f0f4ff; padding-left: 14px; }

/* Subtotal row */
table.pnl tr.subtotal td { background: #eef2ff; font-weight: 700; font-size: 13px; border-top: 1px solid #c7d2fe; border-bottom: 2px solid var(--border); }
table.pnl tr.subtotal td.lc { background: #eef2ff; padding-left: 14px; }

/* Grand total row */
table.pnl tr.grand-total td { background: #1e293b; color: #fff; font-weight: 800; font-size: 13px; border-top: 2px solid #334155; }
table.pnl tr.grand-total td.lc { background: #1e293b; color: #fff; padding-left: 14px; }

/* Projection columns — el italic es la señal de "proyectado"; el color pasa AA (~4.6:1) */
table.pnl th.proj { background: var(--proj-bg); color: #5b6472; font-style: italic; }
table.pnl td.proj { background: var(--proj-bg); color: #5b6472; font-style: italic; }
table.pnl tr.grp-hdr td.proj, table.pnl tr.subtotal td.proj { color: #5b6472; }
table.pnl tr.grand-total td.proj { color: #cbd5e1; }
table.pnl th.sep, table.pnl td.sep { width: 6px; padding: 0; background: var(--border); }

/* Value colors */
.vp  { color: var(--green); }
.vn  { color: var(--red); }
.vz  { color: #cbd5e1; }
.vf  { color: var(--text); }   /* valor sin criterio de color (mismo color siempre) */
table.pnl tr.grand-total .vp { color: #86efac; }
table.pnl tr.grand-total .vn { color: #fca5a5; }

/* Total column */
td.tc { background: #f0f4ff !important; font-weight: 700; }
table.pnl tr.grand-total td.tc { background: #0f172a !important; }

/* Proj note */
.proj-note { font-size: 11px; color: var(--muted); padding: 6px 18px 10px; }

/* ---- KPI row ---- */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; border-top: 3px solid var(--accent); }
.kc .kl { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px; }
.kc .kv { font-size: 22px; font-weight: 800; line-height: 1; }
.kc .ks { font-size: 11px; color: var(--muted); margin-top: 5px; }
.pos { color: var(--green); font-weight: 700; }
.neg { color: var(--red); font-weight: 700; }
.neu { color: var(--muted); }

/* ---- Program index chips (saltos rapidos a cada programa) ---- */
.prog-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.prog-chip { padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--accent); background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: .15s; }
.prog-chip:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ---- Program section ---- */
/* scroll-margin-top = alto aprox de la .topbar sticky, para que el ancla no quede tapada */
.prog-section { margin-bottom: 24px; scroll-margin-top: 104px; }
.prog-title { font-size: 13px; font-weight: 700; color: var(--text); padding: 10px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; border-bottom: 2px solid var(--accent); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.seg-sm .seg-btn { padding: 3px 10px; font-size: 11px; }
.prog-body { background: var(--surface); border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); padding: 16px; }
/* Sub-bloque dentro de una seccion de programa (ej. Suscripcion en Club Despegar) */
.sub-block { margin-top: 18px; padding-top: 16px; border-top: 2px dashed var(--border); }
.sub-title { font-size: 12px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }

/* ---- Charts ---- */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
.cc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.ct { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 10px; }
.cw { position: relative; height: 220px; }

/* ---- Filas de datos bajo cada grafico evolutivo (YoY, precio/pt) ---- */
.dtable-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
.dtable-row + .dtable-row { margin-top: 3px; padding-top: 3px; border-top: none; }
.dtable-label { flex: 0 0 78px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; line-height: 1.25; }

.yoy-row, .ppr-row { flex: 1 1 auto; min-width: 0; display: flex; gap: 2px; overflow-x: auto; }
.yoy-cell, .ppr-cell { flex: 1 0 auto; min-width: 48px; text-align: center; }
.yoy-m { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
.yoy-cell .pos, .yoy-cell .neg, .yoy-cell .neu { font-size: 13px; }
.ppr-ly { font-size: 11px; color: var(--muted); margin-bottom: 1px; }
.ppr-cell .pos, .ppr-cell .neg, .ppr-cell .neu { font-size: 12px; }

/* ---- Segmented toggle (Redenciones Q/$) ---- */
.seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg-btn { padding: 5px 12px; font-size: 12px; font-weight: 700; background: #f8fafc; border: none; cursor: pointer; color: var(--muted); }
.seg-btn:hover { color: var(--text); }
.seg-btn.active { background: var(--accent); color: #fff; }

/* ---- Breakdown table ---- */
.bk-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
.bk-hdr { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
table.bk { width: 100%; border-collapse: collapse; }
table.bk th { padding: 7px 14px; background: #f8fafc; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; border-bottom: 1px solid var(--border); }
table.bk th.r, table.bk td.r { text-align: right; }
table.bk td { padding: 7px 14px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
table.bk td.neg { color: var(--red); }
table.bk td.ly  { color: var(--muted); }
table.bk tr.tot td { font-weight: 700; background: #f8fafc; }
table.bk tr:last-child td { border-bottom: none; }
table.bk tr:hover td { background: #f8fafc; }

/* ---- Loading ---- */
.loading { position: fixed; inset: 0; background: rgba(255,255,255,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 12px; }
.spinner { width: 38px; height: 38px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.lt { font-size: 13px; color: var(--muted); font-weight: 600; }
.hidden { display: none !important; }
.empty { text-align: center; padding: 28px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="lt" id="loading-text">Cargando datos...</div>
</div>

<div class="header">
  <div>
    <div class="header-title">Loyalty Dashboard — Despegar</div>
    <div class="header-sub">P&amp;L Contable · Metricas de Negocio por Programa</div>
  </div>
  <div class="header-sync" id="last-sync">—</div>
</div>

<div class="topbar">
<div class="country-tabs" id="country-tabs"></div>

<div class="filters">
  <div class="fg">
    <div class="fl">Desde</div>
    <input type="month" id="f-from" value="2026-01">
  </div>
  <div class="fg">
    <div class="fl">Hasta</div>
    <input type="month" id="f-to" value="2026-12">
  </div>
  <div class="fsep"></div>
  <div class="fg">
    <div class="fl">Formato numeros</div>
    <select id="f-fmt">
      <option value="M" selected>Millones (M)</option>
      <option value="K">Miles (K)</option>
      <option value="INT">Enteros</option>
    </select>
  </div>
  <div class="fsep"></div>
  <div class="fg">
    <div class="fl">Escenario Goal</div>
    <select id="f-scenario">
      <option value="forecast" selected>Forecast</option>
      <option value="budget">Budget</option>
    </select>
  </div>
  <div class="fg">
    <div class="fl">Periodo P&amp;L</div>
    <select id="f-period">
      <option value="month" selected>Mes</option>
      <option value="quarter">Quarter</option>
      <option value="half">Half</option>
    </select>
  </div>
</div>
</div>

<div class="main" style="padding-bottom:0">
  <div class="banner warning hidden" id="stale-banner">
    <div class="bt" id="stale-banner-text"></div>
  </div>
</div>

<div class="main" id="panels"></div>

<script>
if (window.ChartDataLabels) Chart.register(ChartDataLabels);

// ============================================================
// Country & program config
// ============================================================
var COUNTRIES = [
  { key: 'total',     label: 'TOTAL',     dataKey: 'total'     },
  { key: 'brasil',    label: 'Brasil',    dataKey: 'brasil'    },
  { key: 'mexico',    label: 'Mexico',    dataKey: 'mexico'    },
  { key: 'argentina', label: 'Argentina', dataKey: 'argentina' },
  { key: 'colombia',  label: 'Colombia',  dataKey: 'colombia'  },
  { key: 'chile',     label: 'Chile',     dataKey: 'chile',
    banner: { type: 'warning', html: 'El programa <strong>Pasaporte D!</strong> aun no se encuentra activo en Chile.' } },
  { key: 'peru',      label: 'Peru',      dataKey: 'peru'      },
  { key: 'ecuador',   label: 'Ecuador',   dataKey: 'ecuador'   },
  { key: 'uruguay',   label: 'Uruguay',   dataKey: 'uruguay',
    banner: { type: 'wip', html: 'Seccion en desarrollo <strong>(WIP)</strong> — datos preliminares.' } }
];

// La pestaña TOTAL agrega la suma de estos países (P&L + métricas de negocio).
var COUNTRY_DATAKEYS = COUNTRIES.filter(function(c){ return c.dataKey !== 'total'; })
                                .map(function(c){ return c.dataKey; });
function isTotal(country) { return (country && (country.dataKey || country)) === 'total'; }
// ¿la fila (país en nombre completo, ej 'brasil') pertenece a la vista pedida?
function matchCountryRow(rowCountry, country) {
  var p = (rowCountry || '').toLowerCase();
  return isTotal(country) ? COUNTRY_DATAKEYS.indexOf(p) !== -1 : p === country.dataKey;
}
// dataKey a usar para lookups por país de una fila (en TOTAL, el país real de la fila).
function rowCountryKey(row, country) {
  return isTotal(country) ? (row.country || '').toLowerCase() : country.dataKey;
}

// P&L grouping — keywords matched against P&L N1 (lowercase, stripped of "loyalty -" prefix)
var PNL_GROUPS = [
  { label: 'Net Revenue',
    keywords: ['bank revenue', 'partner revenue', 'flag revenue', 'breakage revenue', 'deferred revenue in', 'deferred revenue out'] },
  { label: 'Sales & Marketing',
    keywords: ['marketing', 'rewards', 'benefits', 'personnel'] }
];

// ============================================================
// Program dictionary — loaded dynamically from loyalty_dict.json
// Built from Diccionario.xlsx by loyalty_sync.py
// ============================================================

// Ordered list of all sections (controls display order)
var PROGRAMS_ORDER = ['Pasaporte D!', 'IFOOD', 'Cobrand', 'Partners', 'Acciones Marketing', 'Club Despegar', 'Puntos Manuales'];
// Programas restringidos a ciertos paises (si un programa no aparece aca, se muestra en todos)
var PROGRAM_COUNTRIES = {
  'Club Despegar': ['argentina'],
  'Cobrand':       ['mexico', 'argentina', 'colombia'],
  'IFOOD':         ['brasil'],
};

// ---- Paleta categórica: familias oficiales Despegar (LILA / VERDE / ROJO) + gris ----
// LILA-1 #550fed · VERDE-1 #029687 · LILA-3 #976cf6 · ROJO-2 #fa503f · --muted
var CAT_FILL  = ['rgba(85,15,237,.80)', 'rgba(2,150,135,.80)', 'rgba(151,108,246,.80)', 'rgba(250,80,63,.78)', 'rgba(85,96,112,.50)'];
var CAT_SOLID = ['#550fed', '#029687', '#976cf6', '#fa503f', 'var(--muted)'];

// ---- Miembros del programa (loyalty_miembros.json) ----
var MB_TIERS = ['Viajero', 'Explorador', 'Global', 'Sin tier'];
var MB_TIER_COLOR       = { 'Viajero': CAT_FILL[0],  'Explorador': CAT_FILL[1],  'Global': CAT_FILL[2],  'Sin tier': CAT_FILL[4] };
var MB_TIER_COLOR_SOLID  = { 'Viajero': CAT_SOLID[0], 'Explorador': CAT_SOLID[1], 'Global': CAT_SOLID[2], 'Sin tier': CAT_SOLID[4] };

// ---- Club Despegar — suscripción AR (loyalty_club_despegar.json). Se muestra DENTRO
//      de la sección de programa "Club Despegar" (solo Argentina + TOTAL). ----
var CDD_PLANS = ['Plan 1', 'Plan 2', 'Plan 3', 'Plan 4', 'Otro'];
var CDD_PLAN_COLOR_SOLID = { 'Plan 1': CAT_SOLID[0], 'Plan 2': CAT_SOLID[1], 'Plan 3': CAT_SOLID[2], 'Plan 4': CAT_SOLID[3], 'Otro': CAT_SOLID[4] };
var CDD_PLAN_COLOR       = { 'Plan 1': CAT_FILL[0],  'Plan 2': CAT_FILL[1],  'Plan 3': CAT_FILL[2],  'Plan 4': CAT_FILL[3],  'Otro': CAT_FILL[4] };
// ---- iFood — enrolados (loyalty_ifood_enroll.json). Se muestra DENTRO de la sección
//      de programa "IFOOD" (solo Brasil + TOTAL). ----
var IFOOD_TIPOS = ['iFood enrol', 'Club iFood'];
var IFOOD_COLOR = { 'iFood enrol': CAT_FILL[2], 'Club iFood': CAT_FILL[3] };

function getProgramFromAcum(row) {
  var d = (RAW.dict || {}).acum || {};
  var partner = (row.partner && row.partner !== 'N/D') ? row.partner : '';
  var pt  = row.point_type || '';
  var key = partner + pt;
  return d[key] || d[pt] || 'Otros';
}

function getProgramFromReden(row) {
  var d = (RAW.dict || {}).reden || {};
  var pt = row.point_type || '';
  return d[pt] || 'Otros';
}

// Puntos. Los JSON agregados solo traen `points` (= SUM(points) de comarch).
// `points_distribuidos` (el que usa el cierre de Loyalty, ~2-4% menos) NO viene:
// la columna falla vía ODBC. Por eso el SSP calculado difiere ~1% del cierre.
function getPts(row) {
  return Math.abs(+(row.points) || 0);
}

function getUsd(row) { return Math.abs(+(row.descuento_consumo_puntos_usd) || 0); }

// Factor SSP de Facturación por país y mes (= SSP_Calculado * (1 - breakage esperado)).
// Fuente: loyalty_ssp.json (loyalty_sync.py, redenciones Pasaporte D! + breakage_esperado.csv).
// Fallbacks: último mes disponible del país -> constante SSP_BREAKAGE hardcodeada.
function sspFactor(dataKey, ym) {
  var byC = (RAW.ssp && RAW.ssp.data) ? RAW.ssp.data[dataKey] : null;
  if (byC) {
    if (ym && byC[ym]) return byC[ym].ssp_facturacion;
    var ks = Object.keys(byC).sort();
    if (ks.length) return byC[ks[ks.length - 1]].ssp_facturacion;
  }
  return SSP_BREAKAGE[dataKey];
}

// Valor USD de Acumulaciones: acum_usd_base * SSP_Facturación[país][mes del accrual].
// acum_usd_base = suma de |(comision + fee + descuentos) * (1 - pct_pagado_con_puntos)|
// pre-calculada por loyalty_sync.py al agregar.
function getAcumUsd(row, dataKey) {
  var factor = sspFactor(dataKey, (row.processing_date || '').substring(0, 7));
  if (factor === undefined || factor === null) return 0;
  return Math.abs((+row.acum_usd_base || 0) * factor);
}

// Valor segun modo Q/USD, usado por Redenciones (el toggle vive dentro de cada
// seccion de metrica de negocio, ver SEC_MODE). Acumulaciones usa getAcumUsd.
function valueForMode(row, mode) { return mode === 'USD' ? getUsd(row) : getPts(row); }

// Programs visible for a given country (in display order, filtered by what's in the dict)
function programsForCountry(countryKey) {
  if (countryKey === 'total') return PROGRAMS_ORDER.slice();  // TOTAL muestra todos
  return PROGRAMS_ORDER.filter(function(p) {
    var allowed = PROGRAM_COUNTRIES[p];
    return !allowed || allowed.indexOf(countryKey) !== -1;
  });
}

// ============================================================
// Number format helpers
// ============================================================
function getFmt() { return document.getElementById('f-fmt').value; }

// Format P&L values (data is in USD — check units once baseline explored)
function fmtPnl(v, signed) {
  if (v === null || v === undefined) return '—';
  var fmt = getFmt(), sign = v < 0 ? '-' : (signed && v > 0 ? '+' : ''), abs = Math.abs(v);
  if (fmt === 'M')   return sign + '$' + (abs / 1e6).toFixed(2) + 'M';
  if (fmt === 'INT') return sign + '$' + Math.round(abs).toLocaleString();
  return sign + '$' + abs.toFixed(1) + 'K';  // default K
}

// Format point counts (raw integers)
function fmtPts(v) {
  var fmt = getFmt(), abs = Math.abs(v || 0);
  if (fmt === 'M')   return (abs / 1e6).toFixed(2) + 'M';
  if (fmt === 'INT') return Math.round(abs).toLocaleString();
  return (abs / 1e3).toFixed(1) + 'K';
}

// Format USD values (acum/reden descuento_consumo_puntos_usd — already small USD)
function fmtUSD(v) {
  var fmt = getFmt(), sign = v < 0 ? '-' : '', abs = Math.abs(v || 0);
  if (fmt === 'M')   return sign + '$' + (abs / 1e6).toFixed(3) + 'M';
  if (fmt === 'INT') return sign + '$' + Math.round(abs).toLocaleString();
  return sign + '$' + (abs / 1e3).toFixed(1) + 'K';
}

// Version 1-decimal para los graficos de columnas (bar labels + eje Y) — las cards
// de KPI siguen usando fmtPts/fmtUSD con su precision habitual.
function fmtPtsChart(v) {
  var fmt = getFmt(), abs = Math.abs(v || 0);
  if (fmt === 'M')   return (abs / 1e6).toFixed(1) + 'M';
  if (fmt === 'INT') return Math.round(abs).toLocaleString();
  return (abs / 1e3).toFixed(1) + 'K';
}
function fmtUSDChart(v) {
  var fmt = getFmt(), sign = v < 0 ? '-' : '', abs = Math.abs(v || 0);
  if (fmt === 'M')   return sign + '$' + (abs / 1e6).toFixed(1) + 'M';
  if (fmt === 'INT') return sign + '$' + Math.round(abs).toLocaleString();
  return sign + '$' + (abs / 1e3).toFixed(1) + 'K';
}

// Precio por punto (USD/pt) — valores chicos, precision propia (no sigue fmtPtsChart/fmtUSDChart).
function fmtPricePerPt(v) { return '$' + (v || 0).toFixed(4); }

function fmtPct(v, ref) {
  if (!ref) return '<span class="neu">—</span>';
  var p = (v - ref) / Math.abs(ref) * 100;
  return '<span class="' + (p >= 0 ? 'pos' : 'neg') + '">' + (p >= 0 ? '+' : '') + p.toFixed(1) + '%</span>';
}

function vc(v) { return v > 0 ? 'vp' : v < 0 ? 'vn' : 'vz'; }

// ============================================================
// Compact expander
// ============================================================
function expand(raw) {
  if (!raw) return [];
  var d = raw.data || raw;
  if (Array.isArray(d)) return d;
  var cols = d.cols || raw.cols, rows = d.rows || raw.rows;
  if (!cols || !rows) return [];
  return rows.map(function(r) {
    var o = {};
    for (var i = 0; i < cols.length; i++) o[cols[i]] = r[i];
    return o;
  });
}

function expandBaseline(raw) {
  if (!raw) return [];
  if (raw.cols && raw.rows) {
    return raw.rows.map(function(r) {
      var o = {};
      for (var i = 0; i < raw.cols.length; i++) o[raw.cols[i]] = r[i];
      return o;
    });
  }
  return expand(raw);
}

// Trimestre fiscal (Abr->Mar) segun el mes calendario "MM".
var PNL_Q = { '04':'Q1','05':'Q1','06':'Q1','07':'Q2','08':'Q2','09':'Q2',
              '10':'Q3','11':'Q3','12':'Q3','01':'Q4','02':'Q4','03':'Q4' };
var PNL_H = { Q1: 'H1', Q2: 'H1', Q3: 'H2', Q4: 'H2' };
function pnlPeriodKey(ym, mode) {
  if (mode === 'month') return ym;
  var q = PNL_Q[ym.substring(5, 7)];
  return mode === 'quarter' ? q : PNL_H[q];
}

function inRange(ym, from, to) {
  if (from && ym < from) return false;
  if (to   && ym > to)   return false;
  return true;
}


// ============================================================
// P&L group classifier
// ============================================================
function classifyN1(n1) {
  var norm = (n1 || '').toLowerCase().replace(/^loyalty\s*[-–]\s*/i, '').trim();
  for (var g = 0; g < PNL_GROUPS.length; g++) {
    var kws = PNL_GROUPS[g].keywords;
    for (var k = 0; k < kws.length; k++) {
      if (norm.indexOf(kws[k]) !== -1) return PNL_GROUPS[g].label;
    }
  }
  return 'Otros';
}

// ============================================================
// P&L data builder
// ============================================================
var _pnlSchemaWarned = false;
function buildPnl(country) {
  var rows = expandBaseline(RAW.baseline);
  var r = getRange();
  // Si NO hay NINGUNA fila loyalty en todo el baseline (sin filtro de país/fecha),
  // el problema no es el período: cambió el esquema o el nombre del LOB en
  // Inputs_Planning_PnL (repo B2B). Avisar una vez en consola.
  if (rows.length && !_pnlSchemaWarned &&
      !rows.some(function(row){ return (row['P&L N1'] || '').toLowerCase().indexOf('loyalty') !== -1; })) {
    _pnlSchemaWarned = true;
    console.error('[P&L] 0 filas "loyalty" en baseline_actuals+projections.json — ' +
      'revisar nombres de columna / LOB en Inputs_Planning_PnL (repo B2B_Ecosystem).');
  }
  var filtered = rows.filter(function(row) {
    return matchCountryRow(row['Pais'], country)
        && (row['P&L N1'] || '').toLowerCase().indexOf('loyalty') !== -1
        && inRange((row['Fecha'] || '').substring(0, 7), r.from, r.to);
  });
  if (!filtered.length) return null;

  var monthSet = {}, lineSet = {};
  filtered.forEach(function(row) {
    monthSet[(row['Fecha'] || '').substring(0, 7)] = 1;
    lineSet[row['P&L N1'] || 'N/D'] = 1;
  });
  var months = Object.keys(monthSet).sort();

  // Escenarios (budget / forecast) — mapas mensuales por linea, mismo set de
  // meses que el baseline. Fuente: JSON canonicos de Inputs_Planning_PnL.
  var scn = scenarioLoyaltyPnl(country, months);
  Object.keys(scn.budget).forEach(function(l){ lineSet[l] = 1; });
  Object.keys(scn.forecast).forEach(function(l){ lineSet[l] = 1; });
  var lines = Object.keys(lineSet).sort();

  // agg[line] = {ym: monto}
  var agg = {};
  lines.forEach(function(l) { agg[l] = {}; });
  filtered.forEach(function(row) {
    var l = row['P&L N1'] || 'N/D', m = (row['Fecha'] || '').substring(0, 7);
    agg[l][m] = (agg[l][m] || 0) + (parseFloat(row['Monto USD']) || 0);
  });

  // Grupos → lineas ordenadas por PNL_GROUPS + 'Otros'
  var groups = {};
  PNL_GROUPS.forEach(function(g) { groups[g.label] = { lines: [] }; });
  groups['Otros'] = { lines: [] };
  lines.forEach(function(l) {
    var grp = classifyN1(l);
    if (!groups[grp]) groups[grp] = { lines: [] };
    groups[grp].lines.push(l);
  });

  return { months: months, lines: lines, agg: agg, groups: groups, scn: scn };
}

// Por escenario: { line: {ym: monto} } de loyalty para el pais, restringido a
// monthArr (los meses del baseline ya filtrados por el rango de fecha global).
function scenarioLoyaltyPnl(country, monthArr) {
  var monthSet = {};
  monthArr.forEach(function(m){ monthSet[m] = 1; });
  var out = { budget: {}, forecast: {} };
  ['budget', 'forecast'].forEach(function(s) {
    var byLine = out[s];
    expandBaseline(RAW[s]).forEach(function(row) {
      if (!matchCountryRow(row['Pais'], country)) return;
      var l = row['P&L N1'] || 'N/D';
      if (l.toLowerCase().indexOf('loyalty') === -1) return;
      var ym = (row['Fecha'] || '').substring(0, 7);
      if (!monthSet[ym]) return;
      if (!byLine[l]) byLine[l] = {};
      byLine[l][ym] = (byLine[l][ym] || 0) + (parseFloat(row['Monto USD']) || 0);
    });
  });
  return out;
}

// Suma un mapa {ym: val} de varias lineas en un solo {ym: val}.
function mergeMonthly(maps) {
  var o = {};
  maps.forEach(function(mm) {
    Object.keys(mm || {}).forEach(function(ym){ o[ym] = (o[ym] || 0) + mm[ym]; });
  });
  return o;
}

// ============================================================
// Render P&L table — Baseline | Goal | Baseline−Goal, agrupado por Mes/Quarter/Half
// (mismo layout que P&L Accounting de B2B)
// ============================================================
function renderPnl(containerId, country) {
  var el = document.getElementById(containerId);
  if (!el) return;
  var d = buildPnl(country);
  if (!d || !d.lines.length) {
    el.innerHTML = '<div class="empty">Sin datos de P&L Loyalty para ' + country.label + ' en el periodo seleccionado.</div>';
    return;
  }

  var mode = getPeriodMode();          // 'month' | 'quarter' | 'half'
  var GOAL = getScenario();            // 'budget' | 'forecast'
  var goalMaps = d.scn[GOAL];

  // Periodos presentes (segun los meses del baseline), + columna Total
  var present = {};
  d.months.forEach(function(ym){ present[pnlPeriodKey(ym, mode)] = 1; });
  var periods;
  if (mode === 'month')        periods = d.months.slice();
  else if (mode === 'quarter') periods = ['Q1','Q2','Q3','Q4'].filter(function(p){ return present[p]; });
  else                         periods = ['H1','H2'].filter(function(p){ return present[p]; });
  var cols = periods.concat(['TOT']);
  var n = cols.length;
  function pLabel(p) { return p === 'TOT' ? 'Total' : (mode === 'month' ? fmtMonthLbl(p) : p); }

  // {ym: val} -> {periodKey: val} (incluye TOT = suma de todo)
  function toPeriods(monthMap) {
    var o = {}; cols.forEach(function(c){ o[c] = 0; });
    Object.keys(monthMap || {}).forEach(function(ym){
      var v = monthMap[ym] || 0, pk = pnlPeriodKey(ym, mode);
      if (o[pk] !== undefined) o[pk] += v;
      o.TOT += v;
    });
    return o;
  }

  function valCells(pmap, colored, signed) {
    var s = '';
    cols.forEach(function(c){
      var v = pmap[c] || 0;
      var col = colored ? vc(v) : (v ? 'vf' : 'vz');  // sin criterio -> color fijo (vf); vacio -> vz
      s += '<td class="' + (c === 'TOT' ? 'tc ' : '') + col + '">' + (v ? fmtPnl(v, signed) : '—') + '</td>';
    });
    return s;
  }
  // fila completa: baseline | sep | goal | sep | (baseline - goal)
  // Criterio de color (verde/rojo): en Baseline+Goal solo si es fila resumen
  // (subtotal / total); el bloque Delta SIEMPRE va con color.
  function rowBGD(baseMap, goalMap, summary) {
    var bp = toPeriods(baseMap), gp = toPeriods(goalMap), dp = {};
    cols.forEach(function(c){ dp[c] = (bp[c] || 0) - (gp[c] || 0); });
    return valCells(bp, summary) + '<td class="sep"></td>' + valCells(gp, summary)
         + '<td class="sep"></td>' + valCells(dp, true, true);  // bloque Delta: +/- explicito
  }
  function emptyRow() {
    var s = '';
    for (var b = 0; b < 3; b++) {
      for (var i = 0; i < n; i++) s += '<td></td>';
      if (b < 2) s += '<td class="sep"></td>';
    }
    return s;
  }

  var html = '<div class="tbl-scroll"><table class="pnl"><thead>';
  html += '<tr class="bg-scen"><th class="lc"></th>'
        + '<th class="bg-b" colspan="' + n + '">BASELINE</th><th class="sep"></th>'
        + '<th class="bg-g" colspan="' + n + '">GOAL · ' + scenarioLabel(GOAL) + '</th><th class="sep"></th>'
        + '<th class="bg-d" colspan="' + n + '">&Delta; BASELINE &minus; GOAL</th></tr>';
  html += '<tr><th class="lc">Linea P&L</th>';
  for (var blk = 0; blk < 3; blk++) {
    cols.forEach(function(c){ html += '<th' + (c === 'TOT' ? ' class="tc"' : '') + '>' + pLabel(c) + '</th>'; });
    if (blk < 2) html += '<th class="sep"></th>';
  }
  html += '</tr></thead><tbody>';

  var groupOrder = PNL_GROUPS.map(function(g){ return g.label; }).concat(['Otros']);

  groupOrder.forEach(function(grpLabel) {
    var grp = d.groups[grpLabel];
    if (!grp || !grp.lines.length) return;

    html += '<tr class="grp-hdr"><td class="lc">' + grpLabel + '</td>' + emptyRow() + '</tr>';

    grp.lines.forEach(function(line) {
      html += '<tr><td class="lc">' + line + '</td>'
            + rowBGD(d.agg[line], goalMaps[line], false) + '</tr>';
    });

    var baseGrp = mergeMonthly(grp.lines.map(function(l){ return d.agg[l]; }));
    var goalGrp = mergeMonthly(grp.lines.map(function(l){ return goalMaps[l]; }));
    html += '<tr class="subtotal"><td class="lc">Subtotal ' + grpLabel + '</td>'
          + rowBGD(baseGrp, goalGrp, true) + '</tr>';
  });

  var baseAll = mergeMonthly(d.lines.map(function(l){ return d.agg[l]; }));
  var goalAll = mergeMonthly(d.lines.map(function(l){ return goalMaps[l]; }));
  html += '<tr class="grand-total"><td class="lc">TOTAL LOYALTY</td>'
        + rowBGD(baseAll, goalAll, true) + '</tr>';

  html += '</tbody></table></div>';
  html += '<div class="proj-note">Baseline = actuals (meses cerrados) + run-rate + forecast · Goal = '
        + scenarioLabel(GOAL) + ' · Δ = Baseline &minus; Goal</div>';
  el.innerHTML = html;
}

// ============================================================
// Metrics data by program
// ============================================================
function buildMetrics(country) {
  var r = getRange();

  function filterCY(rows) {
    return rows.filter(function(row) {
      return matchCountryRow(row.country, country)
          && inRange((row.processing_date || '').substring(0, 7), r.from, r.to);
    });
  }
  function filterLY(rows) {
    return rows.filter(function(row) {
      var ym = (row.processing_date || '').substring(0, 7);
      var cy = ym ? (String(+ym.substring(0,4)+1) + ym.substring(4)) : '';
      return matchCountryRow(row.country, country) && inRange(cy, r.from, r.to);
    });
  }

  var acCY = filterCY(expand(RAW.acum_cy));
  var acLY = filterLY(expand(RAW.acum_ly));
  var rdCY = filterCY(expand(RAW.reden_cy));
  var rdLY = filterLY(expand(RAW.reden_ly));
  var bkAll = Array.isArray((RAW.breakage || {}).data) ? RAW.breakage.data : expand(RAW.breakage);
  var bkIsoSet = isTotal(country)
    ? COUNTRY_DATAKEYS.map(function(k){ return COUNTRY_ISO[k] || k; })
    : [COUNTRY_ISO[country.dataKey] || country.dataKey];
  var bkCY  = bkAll.filter(function(b){ return bkIsoSet.indexOf((b.country || '').toLowerCase()) !== -1; });

  function aggAcum(rows) {
    var pts = 0, usd = 0, byProg = {};
    rows.forEach(function(row) {
      var p = getPts(row), u = getAcumUsd(row, rowCountryKey(row, country));
      pts += p; usd += u;
      var prog = getProgramFromAcum(row);
      if (!byProg[prog]) byProg[prog] = { pts: 0, usd: 0 };
      byProg[prog].pts += p; byProg[prog].usd += u;
    });
    return { pts: pts, usd: usd, byProg: byProg };
  }

  function aggReden(rows) {
    var pts = 0, usd = 0, byProg = {};
    rows.forEach(function(row) {
      var p = getPts(row), u = Math.abs(+(row.descuento_consumo_puntos_usd) || 0);
      pts += p; usd += u;
      var prog = getProgramFromReden(row);
      if (!byProg[prog]) byProg[prog] = { pts: 0, usd: 0 };
      byProg[prog].pts += p; byProg[prog].usd += u;
    });
    return { pts: pts, usd: usd, byProg: byProg };
  }

  var bkTotal = bkCY.reduce(function(s, b){ return s + Math.abs(+(b.points) || 0); }, 0);

  return { acCY: aggAcum(acCY), acLY: aggAcum(acLY), rdCY: aggReden(rdCY), rdLY: aggReden(rdLY),
           bkTotal: bkTotal, mb: buildMiembros(country),
           cdd: buildClubDespegar(country), ifd: buildIfood(country) };
}

// Club Despegar (suscripción AR). serie del JSON: 'stock' | 'alta' | 'baja'.
// - stockByPlanYm[plan][ym]: base activa acumulada (suscripciones que HOY siguen ACTIVE,
//   por mes de alta). Monótona. En el último mes == suscriptos actuales por plan.
// - stockByYm: total (suma de planes) por mes.
// - byPlan / activos: último mes del stock = foto actual.
// - altasByYm (confiable) / bajasByYm (timing aprox: updated_at está bulk-touched).
function buildClubDespegar(country) {
  var rows = expand(RAW.club).filter(function(r){ return matchCountryRow(r.country, country); });
  var stockByPlanYm = {}, altasByYm = {}, bajasByYm = {}, ymSet = {};
  CDD_PLANS.forEach(function(p){ stockByPlanYm[p] = {}; });
  rows.forEach(function(r){
    var n = +r.n || 0, ym = (r.ym || '').substring(0, 7);
    if (ym.length !== 7) return;
    var p = CDD_PLANS.indexOf(r.plan_type) !== -1 ? r.plan_type : 'Otro';
    if (r.serie === 'stock')      { stockByPlanYm[p][ym] = (stockByPlanYm[p][ym] || 0) + n; ymSet[ym] = 1; }
    else if (r.serie === 'alta')  { altasByYm[ym] = (altasByYm[ym] || 0) + n; }
    else if (r.serie === 'baja')  { bajasByYm[ym] = (bajasByYm[ym] || 0) + n; }
  });
  var yms = Object.keys(ymSet).sort();
  var stockByYm = {};
  yms.forEach(function(ym){
    var t = 0; CDD_PLANS.forEach(function(p){ t += stockByPlanYm[p][ym] || 0; });
    stockByYm[ym] = t;
  });
  var lastYm = yms.length ? yms[yms.length - 1] : '';
  var byPlan = {}, activos = 0;
  CDD_PLANS.forEach(function(p){ var v = stockByPlanYm[p][lastYm] || 0; byPlan[p] = v; activos += v; });
  return { stockByPlanYm: stockByPlanYm, stockByYm: stockByYm, altasByYm: altasByYm,
           bajasByYm: bajasByYm, byPlan: byPlan, activos: activos, lastYm: lastYm };
}

// iFood enrolados: altas por mes de 'iFood enrol' (cross_cashback) y 'Club iFood'
// (closed_loop_discount). Sin dimensión país (es todo Brasil).
function buildIfood(country) {
  var rows = expand(RAW.ifood);
  var byTipo = {}, altasByTipoYm = {}, altasByYm = {};
  IFOOD_TIPOS.forEach(function(t){ byTipo[t] = 0; altasByTipoYm[t] = {}; });
  rows.forEach(function(r){
    if (IFOOD_TIPOS.indexOf(r.tipo) === -1) return;
    var ym = (r.ym || '').substring(0, 7), n = +r.n || 0;
    if (ym.length !== 7) return;
    byTipo[r.tipo] += n;
    altasByTipoYm[r.tipo][ym] = (altasByTipoYm[r.tipo][ym] || 0) + n;
    altasByYm[ym] = (altasByYm[ym] || 0) + n;
  });
  return { byTipo: byTipo, altasByTipoYm: altasByTipoYm, altasByYm: altasByYm,
           total: byTipo['iFood enrol'] + byTipo['Club iFood'] };
}

// Miembros del programa: snapshot del padron activo abierto por mes de alta y tier.
// - byTier / total: foto actual (suma de todas las cohortes).
// - altasByYm / altasByTierYm: altas por mes de enrolment (los meses viejos solo
//   incluyen a los que HOY siguen activos → hay sesgo de supervivencia).
// - stockByYm: miembros acumulados a fin de cada mes (cumsum de las altas).
function buildMiembros(country) {
  var rows = expand(RAW.miembros).filter(function(row){ return matchCountryRow(row.country, country); });
  var byTier = {}, total = 0, altasByYm = {}, altasByTierYm = {};
  MB_TIERS.forEach(function(t){ byTier[t] = 0; altasByTierYm[t] = {}; });
  rows.forEach(function(row){
    var t  = MB_TIERS.indexOf(row.tier) !== -1 ? row.tier : 'Sin tier';
    var ym = (row.ym || '').substring(0, 7);
    var n  = +row.clientes || 0;
    if (ym.length !== 7) return;
    byTier[t] += n; total += n;
    altasByYm[ym] = (altasByYm[ym] || 0) + n;
    altasByTierYm[t][ym] = (altasByTierYm[t][ym] || 0) + n;
  });
  var stockByYm = {}, run = 0;
  Object.keys(altasByYm).sort().forEach(function(ym){ run += altasByYm[ym]; stockByYm[ym] = run; });
  return { total: total, byTier: byTier, altasByYm: altasByYm,
           altasByTierYm: altasByTierYm, stockByYm: stockByYm };
}

// ============================================================
// Render metrics
// ============================================================
// Id de ancla de cada seccion de programa (para los chips de indice).
function progSecId(prog, suffix) { return 'sec-' + prog.replace(/[^a-z0-9]/gi, '') + '-' + suffix; }
// Salto suave a una seccion (el scroll-margin-top de .prog-section evita que la
// barra sticky la tape).
function jumpTo(id) { var e = document.getElementById(id); if (e) e.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

function renderMetrics(country, m) {
  var suffix = country.key;
  var programs = programsForCountry(country.key);

  var el = document.getElementById('metrics-' + suffix);
  if (!el) return;

  // Indice de programas: chips que saltan a cada seccion (Miembros + programas + Breakage).
  var html = '<div class="prog-nav">';
  html += '<button class="prog-chip" type="button" onclick="jumpTo(\'sec-miembros-' + suffix + '\')">Miembros</button>';
  programs.forEach(function(prog) {
    html += '<button class="prog-chip" type="button" onclick="jumpTo(\'' + progSecId(prog, suffix) + '\')">' + prog + '</button>';
  });
  html += '<button class="prog-chip" type="button" onclick="jumpTo(\'sec-breakage-' + suffix + '\')">Breakage</button>';
  html += '</div>';

  // ---- Miembros del programa (arriba de todo: métrica headline) ----

  var mbAltasId = 'ch-mb-altas-' + suffix;
  var mbStockId = 'ch-mb-stock-' + suffix;

  html += '<div class="prog-section" id="sec-miembros-' + suffix + '">';
  html += '<div class="prog-title"><span>Miembros del programa</span></div>';
  html += '<div class="prog-body">';
  if (!mb.total) {
    html += '<div class="empty">Sin datos de miembros' + (RAW.miembros ? '' : ' — loyalty_miembros.json no disponible') + '</div>';
  } else {
    html += '<div class="kpi-row">';
    html += kpiHtml('Miembros Activos', fmtPts(mb.total), 'padrón actual (status A)', 'var(--accent)');
    MB_TIERS.forEach(function(t){
      var v = mb.byTier[t] || 0;
      var pct = mb.total ? (v / mb.total * 100).toFixed(1) + '%' : '—';
      html += kpiHtml(t, fmtPts(v), pct + ' del total', MB_TIER_COLOR_SOLID[t]);
    });
    html += '</div>';
    html += '<div class="cc" style="margin-bottom:14px"><div class="ct">Altas por mes — mes de enrolment (CY vs LY)</div><div class="cw"><canvas id="' + mbAltasId + '"></canvas></div>'
      + '<div class="dtable-row"><div class="dtable-label">YoY %</div><div class="yoy-row" id="yoy-' + mbAltasId + '"></div></div></div>';
    html += '<div class="cc" style="margin-bottom:14px"><div class="ct">Miembros acumulados a fin de mes (CY vs LY)</div><div class="cw"><canvas id="' + mbStockId + '"></canvas></div>'
      + '<div class="dtable-row"><div class="dtable-label">YoY %</div><div class="yoy-row" id="yoy-' + mbStockId + '"></div></div></div>';

  }

  buildBarChart(bkCanvasId, bkPrev, bkCurr, fy.ly, fy.cy, 'rgba(100,116,139,.75)', fmtPtsChart);
}

function kpiHtml(label, value, sub, color) {
  return '<div class="kc" style="border-top-color:' + (color||'var(--accent)') + ';">'
    + '<div class="kl">' + label + '</div>'
    + '<div class="kv">' + value + '</div>'
    + '<div class="ks">' + (sub||'') + '</div>'
    + '</div>';
}

var FISCAL_LABELS = ['Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic','Ene','Feb','Mar'];

// Mapa mensual real (claves "YYYY-MM") de un dataset, filtrado por pais+programa.
// country puede ser un pais concreto o la vista TOTAL (suma de todos).
function monthlyMap(raw, country, prog, getProgFn, valueFn) {
  var agg = {};
  expand(raw).forEach(function(row){
    if (!matchCountryRow(row.country, country)) return;
    if (getProgFn(row) !== prog) return;
    var ym = (row.processing_date||'').substring(0,7);
    agg[ym] = (agg[ym]||0) + valueFn(row);
  });
  return agg;
}

// 12 valores en orden fiscal (Abr->Mar) para el anio fiscal que arranca en startYear,
// tomando cada mes calendario del mapa (cy o ly) al que efectivamente pertenezca.
function fiscalSeries(cyMap, lyMap, yearCY, yearLY, startYear) {
  return FISCAL_MONTHS.map(function(mm){
    var year = fiscalCalYear(mm, startYear);
    var ym = year + '-' + mm;
    if (year === yearCY) return cyMap[ym] || 0;
    if (year === yearLY) return lyMap[ym] || 0;
    return 0;
  });
}

// Breakage: sin identificacion de programa — mapa mensual real por pais
// (expiration_date = "MM-YYYY"; el archivo ya trae ambos anios juntos).
function breakageMonthlyMap(country) {
  var isoSet = isTotal(country)
    ? COUNTRY_DATAKEYS.map(function(k){ return COUNTRY_ISO[k] || k; })
    : [COUNTRY_ISO[country.dataKey] || country.dataKey];
  var rows = Array.isArray((RAW.breakage || {}).data) ? RAW.breakage.data : expand(RAW.breakage);
  var agg = {};
  rows.forEach(function(b){
    if (isoSet.indexOf((b.country || '').toLowerCase()) === -1) return;
    var ed = b.expiration_date || '';
    var mm = ed.substring(0, 2), yyyy = ed.substring(3, 7);
    if (mm.length !== 2 || yyyy.length !== 4) return;
    var ym = yyyy + '-' + mm;
    agg[ym] = (agg[ym] || 0) + Math.abs(+(b.points) || 0);
  });
  return agg;
}

function yoyRowHtml(prevValues, currValues) {
  return FISCAL_LABELS.map(function(lbl, i){
    return '<div class="yoy-cell"><div class="yoy-m">' + lbl + '</div>' + fmtPct(currValues[i] || 0, prevValues[i] || 0) + '</div>';
  }).join('');
}

// Fila debajo del YoY (solo Redenciones): precio/pt de LY + variacion YoY de ese precio.
function priceRowHtml(prevPrice, currPrice) {
  return FISCAL_LABELS.map(function(lbl, i){
    var ly = prevPrice[i] || 0;
    var yoy = ly ? fmtPct(currPrice[i] || 0, ly) : '<span class="neu">—</span>';
    return '<div class="ppr-cell"><div class="ppr-ly">' + (ly ? fmtPricePerPt(ly) : '—') + '</div>' + yoy + '</div>';
  }).join('');
}

// prevValues/currValues: 12 numeros en orden fiscal (Abr->Mar). prevLabel = izquierda
// (anio fiscal anterior), currLabel = derecha (anio fiscal actual).
// priceSeries (opcional, solo Redenciones): { prev:[12], curr:[12] } precio USD/pt por mes —
// se dibuja como linea punteada sobre el grafico (eje secundario) + fila de precio/YoY debajo.
function buildBarChart(canvasId, prevValues, currValues, prevLabel, currLabel, color, fmtFn, priceSeries) {
  var ctx = document.getElementById(canvasId);
  var yoyEl = document.getElementById('yoy-' + canvasId);
  var pprEl = document.getElementById('ppr-' + canvasId);
  if (!ctx) return;
  if (CHARTS[canvasId]) { CHARTS[canvasId].destroy(); }
  if (!prevValues.some(Boolean) && !currValues.some(Boolean)) {
    ctx.parentElement.innerHTML = '<div class="empty" style="padding:20px">Sin datos</div>';
    if (yoyEl) yoyEl.innerHTML = '';
    if (pprEl) pprEl.innerHTML = '';
    return;
  }
  fmtFn = fmtFn || fmtPts;
  // Meses "sin dato todavia" = posiciones despues del ultimo mes con dato del anio
  // actual (currValues). Se usa solo para atenuar la linea de precio en esos meses.
  var lastDataIdx = -1;
  for (var _i = 0; _i < currValues.length; _i++) { if (currValues[_i]) lastDataIdx = _i; }
  function noDataYet(i) { return i > lastDataIdx; }

  var dataLabelCfg = {
    anchor: 'end', align: 'top', clamp: true, offset: 2,
    font: { size: 11, weight: '700' }, color: '#475569',
    formatter: function(v){ return v ? fmtFn(v) : ''; }
  };
  var datasets = [
    { label: String(prevLabel), data: prevValues, backgroundColor: 'rgba(100,116,139,.3)', borderRadius: 3, datalabels: dataLabelCfg },
    { label: String(currLabel), data: currValues, backgroundColor: color, borderRadius: 3, datalabels: dataLabelCfg }
  ];
  var scales = {
    x: { grid: { display: false }, ticks: { font: { size: 12 } } },
    y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 12 }, callback: function(v){ return fmtFn(v); } } }
  };
  if (priceSeries) {
    var priceLight = color.replace(/[\d.]+\)$/, '0.22)');  // mismo tono, mas claro (menos alpha)
    datasets.push({
      type: 'line', label: 'Precio/pt (' + currLabel + ')', data: priceSeries.curr,
      borderColor: color, borderWidth: 2, borderDash: [4, 4], pointRadius: 2,
      pointBackgroundColor: priceSeries.curr.map(function(_v, i){ return noDataYet(i) ? priceLight : color; }),
      pointBorderColor:     priceSeries.curr.map(function(_v, i){ return noDataYet(i) ? priceLight : color; }),
      segment: { borderColor: function(c){ return noDataYet(c.p1DataIndex) ? priceLight : color; } },
      tension: .2, yAxisID: 'y1',
      datalabels: { display: false }
    });
    scales.y1 = { position: 'right', grid: { display: false }, ticks: { font: { size: 11 }, callback: function(v){ return fmtPricePerPt(v); } } };
  }
  CHARTS[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels: FISCAL_LABELS, datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 20 } },
      plugins: { legend: { labels: { font: { size: 12 }, boxWidth: 10 } } },
      scales: scales
    }
  });
  if (yoyEl) yoyEl.innerHTML = yoyRowHtml(prevValues, currValues);
  if (pprEl) pprEl.innerHTML = priceSeries ? priceRowHtml(priceSeries.prev, priceSeries.curr) : '';
}

// Barras multi-serie sobre el eje fiscal (12 meses Abr->Mar). datasets: [{label,data[12],backgroundColor}].
// stacked por defecto true (apiladas); pasar false para barras agrupadas.
// lineOverlay opcional: {label, data[12], color} → dibuja una línea punteada encima (ej. total LY).
function buildStackedBarChart(canvasId, datasets, fmtFn, stacked, lineOverlay) {
  if (stacked === undefined) stacked = true;
  var ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (CHARTS[canvasId]) { CHARTS[canvasId].destroy(); }
  var any = datasets.some(function(d){ return (d.data || []).some(Boolean); })
         || (lineOverlay && lineOverlay.data.some(Boolean));
  if (!any) { ctx.parentElement.innerHTML = '<div class="empty" style="padding:20px">Sin datos</div>'; return; }
  fmtFn = fmtFn || fmtPts;
  var ds = datasets.map(function(d){
    var o = { label: d.label, data: d.data, backgroundColor: d.backgroundColor, borderRadius: 2 };
    if (stacked) o.stack = 's';
    return o;
  });
  if (lineOverlay) {
    ds.push({
      type: 'line', label: lineOverlay.label, data: lineOverlay.data,
      borderColor: lineOverlay.color || '#1e293b', borderWidth: 2, borderDash: [4, 4],
      pointRadius: 2, tension: .2, datalabels: { display: false }
    });
  }
  CHARTS[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels: FISCAL_LABELS, datasets: ds },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font: { size: 12 }, boxWidth: 10 } }, datalabels: { display: false } },
      scales: {
        x: { stacked: stacked, grid: { display: false }, ticks: { font: { size: 12 } } },
        y: { stacked: stacked, grid: { color: '#f1f5f9' }, ticks: { font: { size: 12 }, callback: function(v){ return fmtFn(v); } } }
      }
    }
  });
}

// Tablita de altas / bajas por mes (fiscal) — CY y LY. Bajas por fecha registrada (aprox).
function cddFlowTable(cdd, fy, suffix) {
  var aCY = fiscalSeries(cdd.altasByYm, cdd.altasByYm, fy.cy, fy.ly, fy.cy);
  var bCY = fiscalSeries(cdd.bajasByYm, cdd.bajasByYm, fy.cy, fy.ly, fy.cy);
  var aLY = fiscalSeries(cdd.altasByYm, cdd.altasByYm, fy.cy, fy.ly, fy.ly);
  var bLY = fiscalSeries(cdd.bajasByYm, cdd.bajasByYm, fy.cy, fy.ly, fy.ly);
  var sum = function(a){ return a.reduce(function(x, y){ return x + (y || 0); }, 0); };
  var h = '<div class="bk-card"><div class="bk-hdr">Altas y bajas por mes · bajas por fecha registrada (aprox.)</div>'
    + '<div class="tbl-scroll"><table class="bk"><thead><tr><th>Mes</th>'
    + '<th class="r">Altas ' + fy.cy + '</th><th class="r">Bajas ' + fy.cy + '</th>'
    + '<th class="r">Altas ' + fy.ly + '</th><th class="r">Bajas ' + fy.ly + '</th></tr></thead><tbody>';
  FISCAL_LABELS.forEach(function(lbl, i){
    h += '<tr><td>' + lbl + '</td>'
      + '<td class="r">' + (aCY[i] ? fmtPts(aCY[i]) : '—') + '</td>'
      + '<td class="r neg">' + (bCY[i] ? '-' + fmtPts(bCY[i]) : '—') + '</td>'
      + '<td class="r ly">' + (aLY[i] ? fmtPts(aLY[i]) : '—') + '</td>'
      + '<td class="r ly">' + (bLY[i] ? '-' + fmtPts(bLY[i]) : '—') + '</td></tr>';
  });
  h += '<tr class="tot"><td>Total</td>'
    + '<td class="r">' + fmtPts(sum(aCY)) + '</td>'
    + '<td class="r neg">-' + fmtPts(sum(bCY)) + '</td>'
    + '<td class="r ly">' + fmtPts(sum(aLY)) + '</td>'
    + '<td class="r ly">-' + fmtPts(sum(bLY)) + '</td></tr>';
  h += '</tbody></table></div></div>';
  return h;
}

// ============================================================
// Month label helper
// ============================================================
var MES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function fmtMonthLbl(ym) {
  if (!ym || ym.length < 7) return ym;
  var p = ym.split('-');
  return MES[+p[1]-1] + '-' + p[0].substring(2);
}

// ============================================================
// Build panels (once on load)
// ============================================================
function buildPanels() {
  var tabsEl = document.getElementById('country-tabs');
  var panelsEl = document.getElementById('panels');
  tabsEl.innerHTML = panelsEl.innerHTML = '';

  COUNTRIES.forEach(function(c, idx) {
    var btn = document.createElement('button');
    btn.className = 'ctab' + (idx === 0 ? ' active' : '');
    btn.dataset.key = c.key;
    btn.textContent = c.label;
    btn.addEventListener('click', function(){ switchCountry(c.key); });
    tabsEl.appendChild(btn);

    var div = document.createElement('div');
    div.id = 'panel-' + c.key;
    if (idx !== 0) div.classList.add('hidden');

    var inner = '';
    if (c.banner) {
      inner += '<div class="banner ' + c.banner.type + '"><div class="bt">' + c.banner.html + '</div></div>';
    }
    inner += '<div class="stitle">P&amp;L Contable Loyalty</div>';
    inner += '<div class="pnl-wrap" id="pnl-' + c.key + '"></div>';
    inner += '<div class="stitle">Metricas de Negocio</div>';
    inner += '<div id="metrics-' + c.key + '"></div>';

    div.innerHTML = inner;
    panelsEl.appendChild(div);
  });

  // Botón al Manual — pegado al extremo derecho de la barra de pestañas
  var man = document.createElement('a');
  man.className = 'ctab ctab-manual';
  man.href = 'https://script.google.com/a/macros/despegar.com/s/AKfycbyjLwtf88NdVdoruWH0BAOFnCFS35JrYPDE5eCTUFEwT76oIpNctrMxF-6etUCGs04k6g/exec';
  man.target = '_blank';
  man.rel = 'noopener';
  man.textContent = '📖 Manual';
  tabsEl.appendChild(man);
}

// ============================================================
// Switch country
// ============================================================
function switchCountry(key) {
  ACTIVE_COUNTRY = key;
  document.querySelectorAll('.ctab').forEach(function(b){ b.classList.toggle('active', b.dataset.key === key); });
  COUNTRIES.forEach(function(c){
    var p = document.getElementById('panel-' + c.key);
    if (p) p.classList.toggle('hidden', c.key !== key);
  });
  renderCountry(key);
}

function renderCountry(key) {
  var c = COUNTRIES.filter(function(x){ return x.key === key; })[0];
  if (!c) return;
  renderPnl('pnl-' + key, c);
  renderMetrics(c, buildMetrics(c));
}

function renderActive() { renderCountry(ACTIVE_COUNTRY); }

// ============================================================
// Data loading
// ============================================================
function onLoaded(key, data) {
  RAW[key] = data;
  LOADED++;
  document.getElementById('loading-text').textContent = 'Cargando... (' + LOADED + '/' + TOTAL + ')';
  if (LOADED >= TOTAL) {
    document.getElementById('loading').classList.add('hidden');
    var meta = (RAW.acum_cy || {}).meta || {};
    document.getElementById('last-sync').textContent = 'Ultimo sync: ' + (meta.generated_at || '—');
    checkStale();
    buildPanels();
    renderActive();
  }
}

// Avisa si los JSON de Drive están viejos (sync agendado caído) O si están
// desparejos (un fallo parcial de subida deja unos frescos y otros stale).
// Mira el generated_at MÁS VIEJO de todos los JSON cargados, no solo acum_cy.
function checkStale() {
  var el = document.getElementById('stale-banner');
  var txt = document.getElementById('stale-banner-text');
  var tss = [];
  Object.keys(RAW).forEach(function(k) {
    var g = ((RAW[k] || {}).meta || {}).generated_at;
    if (g) { var t = Date.parse(String(g).replace(' ', 'T')); if (!isNaN(t)) tss.push(t); }
  });
  if (Object.keys(RAW).some(function(k){ return RAW[k] === null; })) {
    txt.innerHTML = '<strong>Carga incompleta.</strong> Uno o más archivos de datos no cargaron ' +
      '(ver consola). Algunos números pueden faltar o quedar en cero.';
    el.classList.remove('hidden');
    return;
  }
  if (!tss.length) {
    txt.textContent = 'No se pudo determinar la fecha del último sync de los datos.';
    el.classList.remove('hidden');
    return;
  }
  var oldest = Math.min.apply(null, tss);
  var newest = Math.max.apply(null, tss);
  var horas  = (Date.now() - oldest) / 36e5;
  var spreadDias = (newest - oldest) / 864e5;
  if (spreadDias > 1) {
    txt.innerHTML = '<strong>Datos desparejos.</strong> Los archivos de datos tienen fechas de ' +
      'sync que difieren en ' + Math.round(spreadDias) + ' días — probablemente una subida a Drive ' +
      'quedó a medias. Avisar al equipo de Loyalty.';
    el.classList.remove('hidden');
  } else if (horas > 48) {
    var dias = Math.floor(horas / 24);
    txt.innerHTML = '<strong>Datos desactualizados.</strong> El último sync fue hace ' +
      dias + ' días. El proceso automático puede estar caído — avisar al equipo de Loyalty ' +
      'antes de usar estos números.';
    el.classList.remove('hidden');
  }
}

function onError(key, msg) {
  console.error('[carga]', key, msg);
  RAW[key] = null;
  LOADED++;
  if (LOADED >= TOTAL) {
    document.getElementById('loading').classList.add('hidden');
    checkStale();
    buildPanels();
    renderActive();
  }
}
