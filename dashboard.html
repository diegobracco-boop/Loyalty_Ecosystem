}

// Mismo diseño visual que buildBarChart (barra LY gris a la izquierda + barra CY a
// la derecha, con el total en datalabel arriba de cada una) pero la barra CY viene
// partida en `currDatasets.length` segmentos apilados (ej. costo + margen) en vez de
// un solo color sólido. Usa el combo grouped+stacked de Chart.js: dataset LY con
// stack:'ly' (solo, 1 barra) + datasets CY con stack:'cy' (se apilan entre sí, y
// quedan al lado de la barra LY porque son un stack distinto) — para que esto
// funcione hace falta scales.x/y.stacked=true (si no, el 'stack' de cada dataset
// se ignora y Chart.js dibuja 1+N barras sueltas en vez de 2 grupos).
function buildSplitBarChart(canvasId, prevValues, currDatasets, prevLabel, fmtFn) {
  var ctx = document.getElementById(canvasId);
  var yoyEl = document.getElementById('yoy-' + canvasId);
  if (!ctx) return;
  if (CHARTS[canvasId]) { CHARTS[canvasId].destroy(); }
  var currTotal = new Array(prevValues.length).fill(0);
  currDatasets.forEach(function(d){ (d.data || []).forEach(function(v, i){ currTotal[i] += (v || 0); }); });
  if (!prevValues.some(Boolean) && !currTotal.some(Boolean)) {
    ctx.parentElement.innerHTML = '<div class="empty" style="padding:20px">Sin datos</div>';
    if (yoyEl) yoyEl.innerHTML = '';
    return;
  }
  fmtFn = fmtFn || fmtPts;
  // Meses "sin dato todavia" (mismo criterio que buildBarChart): atenuar la barra LY
  // en los meses posteriores al ultimo mes con dato CY, para no leerlos como reales.
  var lyColor = 'rgba(100,116,139,.3)';
  var lyColorLight = lightenColor(lyColor);
  var lastDataIdx = -1;
  for (var _i = 0; _i < currTotal.length; _i++) { if (currTotal[_i]) lastDataIdx = _i; }
  function noDataYet(i) { return i > lastDataIdx; }
  function totalLabelCfg(totals) {
    return {
      anchor: 'end', align: 'top', clamp: true, offset: 2,
      font: { size: 11, weight: '700' }, color: '#475569',
      formatter: function(v, dctx) { var t = totals[dctx.dataIndex]; return t ? fmtFn(t) : ''; }
    };
  }
  var datasets = [
    { label: String(prevLabel), data: prevValues,
      backgroundColor: prevValues.map(function(_v, i){ return noDataYet(i) ? lyColorLight : lyColor; }),
      borderRadius: 3, stack: 'ly', datalabels: totalLabelCfg(prevValues) }
  ];
  currDatasets.forEach(function(d, i) {
    var isLast = i === currDatasets.length - 1;
    datasets.push({
      label: d.label, data: d.data, backgroundColor: d.backgroundColor, stack: 'cy',
      borderRadius: isLast ? 3 : 0,
      datalabels: isLast ? totalLabelCfg(currTotal) : { display: false }
    });
  });
  CHARTS[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels: FISCAL_LABELS, datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 4 } },
      plugins: { legend: { labels: { font: { size: 12 }, boxWidth: 10, padding: 10 } } },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { font: { size: 12 } } },
        y: { stacked: true, grid: { color: '#f1f5f9' }, ticks: { font: { size: 12 }, callback: function(v){ return fmtFn(v); } } }
      }
    }
  });
  if (yoyEl) yoyEl.innerHTML = yoyRowHtml(prevValues, currTotal);
}

// Convierte un color (hex #rrggbb o rgba(...)) a una version mas clara (alpha .22,
// mismo valor que usaba priceLight — unificado acá), para atenuar una linea/serie en
// meses "sin dato todavia". Usada por buildBarChart (precio/pt) y buildStackedBarChart
// (lineOverlay). Asume rgba(...) con alpha explícito o hex de 6 dígitos — un rgb(...)
// sin alpha o un hex corto (#fff) no matchean bien, no usado hoy por ningún caller.
function lightenColor(color) {
  if (color.charAt(0) === '#' && color.length === 7) {
    var r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16), b = parseInt(color.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',.22)';
  }
  return color.replace(/[\d.]+\)$/, '.22)');
}

// Barras multi-serie sobre el eje fiscal (12 meses Abr->Mar). datasets: [{label,data[12],backgroundColor}].
// stacked por defecto true (apiladas); pasar false para barras agrupadas.
// lineOverlay opcional: {label, data[12], color} → dibuja una línea punteada encima (ej. total LY).
// Meses posteriores al último con datos CY (suma de todos los datasets) atenúan la
// línea — ahí el año actual todavía no llegó, la línea LY no tiene con qué compararse
// (mismo criterio "sin dato todavía"/noDataYet que ya usa buildBarChart con priceSeries).
// Heatmap de Penetracion de GB (producto x mes fiscal) — reemplaza el line chart
// de 1 producto a la vez (rediseño 18-sep, ver comentario en el bloque de render).
// Rampa secuencial azul (paleta de comparación, distinta de --accent lila para no
// confundirse con el resto del dashboard), claro->oscuro por magnitud.
// Ajustada 21-sep (feedback: quedaba muy oscura/uniforme, todo se mezclaba): se sacó
// el paso más oscuro (navy #1e3a8a) y se sumó uno extra claro al inicio — la rampa
// entera baja de intensidad. La variación YoY en pp se sacó de la celda (quedaba
// muy cargado de data) — sigue disponible al pasar el mouse (title).
var HEAT_STEPS = ['#eff6ff', '#dbeafe', '#bfdbfe', '#93c5fd', '#60a5fa', '#2563eb', '#1d4ed8'];
function heatStepIdx(v, max) {
  if (v == null || !max) return -1;
  var idx = Math.floor((v / max) * HEAT_STEPS.length);
  return Math.max(0, Math.min(HEAT_STEPS.length - 1, idx));
}
function heatCellHtml(v, max, lyV, isTotal) {
  if (v == null) return '<td class="heat-cell heat-empty" title="Sin datos">—</td>';
  var delta = (lyV != null) ? +(v - lyV).toFixed(1) : null;
  var deltaTxt = delta != null ? ((delta > 0 ? '+' : '') + delta + ' pp YoY') : 'sin dato LY';
  var title = v.toFixed(1) + '% · ' + deltaTxt;
  if (isTotal) {
    return '<td class="heat-cell heat-cell-total" title="' + title + '"><div class="heat-val">' + v.toFixed(0) + '%</div></td>';
  }
  var idx = heatStepIdx(v, max);
  var bg  = HEAT_STEPS[idx];
  var txt = idx >= 5 ? '#fff' : '#1e293b'; // corte en idx5 (#2563eb): AA 4.5:1 en ambos lados
  return '<td class="heat-cell" style="background:' + bg + ';color:' + txt + '" title="' + title + '"><div class="heat-val">' + v.toFixed(0) + '%</div></td>';
}
function heatLegendHtml(max) {
  var grad = 'linear-gradient(90deg,' + HEAT_STEPS.join(',') + ')';
  return '<div class="heat-legend"><span>0%</span><div class="heat-legend-bar" style="background:' + grad + '"></div><span>' + Math.round(max) + '%+</span></div>';
}

function buildMixChart(canvasId, datasets, opts) {
  // 100% stacked bar: muestra composición porcentual por mes.
  // datasets: misma forma que buildStackedBarChart [{label, data, backgroundColor}]
  // Los datos se normalizan internamente a 100%.
  // opts (opcional): { legend: bool, fmtFn: fn } — legend=true muestra referencia de
  // color (necesario cuando este chart NO tiene un gráfico de absolutos justo encima,
  // a diferencia del mix de tiers de Pasaporte D!, donde el default false es correcto
  // porque ya hay un gráfico de absolutos arriba); fmtFn agrega el total absoluto del
  // mes al tooltip para no perder contexto de magnitud (hallazgo ux-designer 16-sep).
  opts = opts || {};
  var ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (CHARTS[canvasId]) { CHARTS[canvasId].destroy(); }
  var totals = new Array(FISCAL_LABELS.length).fill(0);
  datasets.forEach(function(d){ (d.data || []).forEach(function(v, i){ totals[i] += Math.abs(v || 0); }); });
  var any = totals.some(Boolean);
  if (!any) { ctx.parentElement.innerHTML = '<div class="empty" style="padding:20px">Sin datos</div>'; return; }
  var normDs = datasets.map(function(d){
    return {
      label: d.label,
      backgroundColor: d.backgroundColor,
      stack: 's',
      borderRadius: 2,
      data: (d.data || []).map(function(v, i){
        return totals[i] ? Math.round(Math.abs(v || 0) / totals[i] * 1000) / 10 : 0;
      }),
      datalabels: {
        display: function(ctx) {
          return ctx.dataset.data[ctx.dataIndex] >= 8;
        },
        formatter: function(v) { return v.toFixed(0) + '%'; },
        color: '#fff',
        font: { size: 11, weight: '600' },
        anchor: 'center',
        align: 'center',
      }
    };
  });
  CHARTS[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels: FISCAL_LABELS, datasets: normDs },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: !!opts.legend, labels: { font: { size: 12 }, boxWidth: 10, padding: 10 } },
        datalabels: { display: true },
        tooltip: {
          callbacks: {
            label: function(c) {
              return ' ' + c.dataset.label + ': ' + c.parsed.y.toFixed(1) + '%';
            },
            afterLabel: opts.fmtFn ? function(c) {
              return totals[c.dataIndex] ? 'Total mes: ' + opts.fmtFn(totals[c.dataIndex]) : '';
            } : undefined
          }
        }
      },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { font: { size: 12 } } },
        y: {
          stacked: true, min: 0, max: 100,
          grid: { color: '#f1f5f9' },
          ticks: { font: { size: 12 }, callback: function(v){ return v + '%'; }, stepSize: 25 }
        }
      }
    }
  });
}

function buildStackedBarChart(canvasId, datasets, fmtFn, stacked, lineOverlay) {
  if (stacked === undefined) stacked = true;
  var ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (CHARTS[canvasId]) { CHARTS[canvasId].destroy(); }
  var any = datasets.some(function(d){ return (d.data || []).some(Boolean); })
         || (lineOverlay && lineOverlay.data.some(Boolean));
  if (!any) { ctx.parentElement.innerHTML = '<div class="empty" style="padding:20px">Sin datos</div>'; return; }
  fmtFn = fmtFn || fmtPts;
  var ds = datasets.map(function(d){
    var o = { label: d.label, data: d.data, backgroundColor: d.backgroundColor, borderRadius: 2 };
    if (stacked) o.stack = 's';
    return o;
  });
  if (lineOverlay) {
    var cySum = new Array(lineOverlay.data.length).fill(0);
    datasets.forEach(function(d){ (d.data || []).forEach(function(v, i){ cySum[i] += (v || 0); }); });
    var lastDataIdx = -1;
    for (var _i = 0; _i < cySum.length; _i++) { if (cySum[_i]) lastDataIdx = _i; }
    function noDataYet(i) { return i > lastDataIdx; }
    var lineColor = lineOverlay.color || '#1e293b';
    var lineLight = lightenColor(lineColor);
    ds.push({
      type: 'line', label: lineOverlay.label, data: lineOverlay.data,
      borderColor: lineColor, borderWidth: 2, borderDash: [4, 4], pointRadius: 2,
      pointBackgroundColor: lineOverlay.data.map(function(_v, i){ return noDataYet(i) ? lineLight : lineColor; }),
      pointBorderColor:     lineOverlay.data.map(function(_v, i){ return noDataYet(i) ? lineLight : lineColor; }),
      segment: { borderColor: function(c){ return noDataYet(c.p1DataIndex) ? lineLight : lineColor; } },
      tension: .2, datalabels: { display: false }
    });
  }
  CHARTS[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels: FISCAL_LABELS, datasets: ds },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font: { size: 12 }, boxWidth: 10, padding: 10 } }, datalabels: { display: false } },
      scales: {
        x: { stacked: stacked, grid: { display: false }, ticks: { font: { size: 12 } } },
        y: { stacked: stacked, grid: { color: '#f1f5f9' }, ticks: { font: { size: 12 }, callback: function(v){ return fmtFn(v); } } }
      }
    }
  });
}

// Barras por categoria (producto + "Total" al borde) con una barra "shadow"
// mas clara (periodo anterior) y la barra de color (periodo elegido) UNA AL
// LADO DE LA OTRA (grouped, Chart.js 4 default) — mismas categorias.
// currValues/shadowValues ya vienen en el mismo orden que `categories`.
function buildRatioBarChart(canvasId, categories, shadowValues, currValues, shadowLabel, currLabel) {
  var ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (CHARTS[canvasId]) { CHARTS[canvasId].destroy(); }
  if (!shadowValues.some(Boolean) && !currValues.some(Boolean)) {
    ctx.parentElement.innerHTML = '<div class="empty" style="padding:20px">Sin datos</div>';
    return;
  }
  var lastIdx = categories.length - 1;  // "Total" — separador vertical + tick mas oscuro para no leerse como un producto mas
  var maxVal = Math.max.apply(null, shadowValues.concat(currValues).map(function(v){ return v || 0; }));
  var labelCfg = {
    anchor: 'end', align: 'top', clamp: true, offset: 2,
    font: { size: 11, weight: '700' }, color: '#475569',
    formatter: function(v){ return v ? v.toFixed(2) : ''; }
  };
  CHARTS[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: categories,
      datasets: [
        { label: shadowLabel, data: shadowValues,
          // Mismo gris neutro para todas las categorias, incl. Total (lastIdx) —
          // antes el Total usaba el mismo tono slate que su propia barra actual
          // (solo distinto alpha), quedaban muy parecidas entre si (hallazgo UX 11-sep).
          backgroundColor: 'rgba(100,116,139,.55)',
          borderRadius: 3, barPercentage: 0.85, categoryPercentage: 0.7, order: 1,
          datalabels: labelCfg },
        { label: currLabel, data: currValues,
          // Total (lastIdx) usa un slate oscuro solido (no la lila de los productos)
          // para remarcar que es un agregado distinto — ahora bien diferenciado del
          // gris de su propio "periodo anterior" arriba, en vez de ser el mismo tono.
          backgroundColor: function(c){ return c.dataIndex === lastIdx ? 'rgba(30,41,59,.92)' : 'rgba(85,15,237,.8)'; },
          borderRadius: 3, barPercentage: 0.85, categoryPercentage: 0.7, order: 2,
          datalabels: labelCfg }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 4 } },
      plugins: { legend: { labels: { font: { size: 12 }, boxWidth: 10, padding: 10 } } },
      scales: {
        x: { grid: { display: false },
             ticks: { font: { size: 11 },
                      color: function(c){ return c.index === lastIdx ? '#1e293b' : '#556070'; } } },
        y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 12 } },
             beginAtZero: true, suggestedMax: maxVal * 1.15 }
      }
    },
    plugins: [{
      id: 'ratioTotalSeparator',
      afterDraw: function(chart){
        var xScale = chart.scales.x;
        if (!xScale || lastIdx <= 0) return;
        var xPos = (xScale.getPixelForValue(lastIdx - 1) + xScale.getPixelForValue(lastIdx)) / 2;
        var area = chart.chartArea;
        var c = chart.ctx;
        c.save();
        c.strokeStyle = '#cbd5e1';
        c.setLineDash([3, 3]);
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(xPos, area.top);
        c.lineTo(xPos, area.bottom);
        c.stroke();
        c.restore();
      }
    }]
  });
}

// Tablita de altas / bajas por mes (fiscal) — CY y LY. Bajas por fecha registrada (aprox).
function cddFlowTable(cdd, fy, suffix) {
  var aCY = fiscalSeries(cdd.altasByYm, cdd.altasByYm, fy.cy, fy.ly, fy.cy);
  var bCY = fiscalSeries(cdd.bajasByYm, cdd.bajasByYm, fy.cy, fy.ly, fy.cy);
  var aLY = fiscalSeries(cdd.altasByYm, cdd.altasByYm, fy.cy, fy.ly, fy.ly);
  var bLY = fiscalSeries(cdd.bajasByYm, cdd.bajasByYm, fy.cy, fy.ly, fy.ly);
  var sum = function(a){ return a.reduce(function(x, y){ return x + (y || 0); }, 0); };
  var h = '<div class="bk-card"><div class="bk-hdr">Altas y bajas por mes · bajas por fecha registrada (aprox.)</div>'
    + '<div class="tbl-scroll"><table class="bk"><thead><tr><th>Mes</th>'
    + '<th class="r">Altas ' + fyLbl(fy.cy) + '</th><th class="r">Bajas ' + fyLbl(fy.cy) + '</th>'
    + '<th class="r">Altas ' + fyLbl(fy.ly) + '</th><th class="r">Bajas ' + fyLbl(fy.ly) + '</th></tr></thead><tbody>';
  FISCAL_LABELS.forEach(function(lbl, i){
    h += '<tr><td>' + lbl + '</td>'
      + '<td class="r">' + (aCY[i] ? fmtPts(aCY[i]) : '—') + '</td>'
      + '<td class="r neg">' + (bCY[i] ? '-' + fmtPts(bCY[i]) : '—') + '</td>'
      + '<td class="r ly">' + (aLY[i] ? fmtPts(aLY[i]) : '—') + '</td>'
      + '<td class="r ly">' + (bLY[i] ? '-' + fmtPts(bLY[i]) : '—') + '</td></tr>';
  });
  h += '<tr class="tot"><td>Total</td>'
    + '<td class="r">' + fmtPts(sum(aCY)) + '</td>'
    + '<td class="r neg">-' + fmtPts(sum(bCY)) + '</td>'
    + '<td class="r ly">' + fmtPts(sum(aLY)) + '</td>'
    + '<td class="r ly">-' + fmtPts(sum(bLY)) + '</td></tr>';
  h += '</tbody></table></div></div>';
  return h;
}

var MES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

// Anio fiscal (Abr->Mar) al que pertenece un mes 'YYYY-MM' — nombrado por su mes
// de arranque (ej. FY 2026 = abr-2026 .. mar-2027), mismo criterio que fyYears()/
// fiscalCalYear() usan para el resto del dashboard.
function fyStartYear(ym) {
  var y = +ym.slice(0, 4), mm = ym.slice(5, 7);
  return mm >= '04' ? y : y - 1;
}

function ratioMonthsAvailable(rows) {
  var s = {};
  rows.forEach(function(r){ var ym = (r.processing_date || '').slice(0, 7); if (ym.length === 7) s[ym] = 1; });
  return Object.keys(s).sort();
}
// Periodos disponibles para el selector, segun el modo (meses u anios fiscales).
function ratioAvailablePeriods(rows, mode) {
  var months = ratioMonthsAvailable(rows);
  if (mode === 'month') return months;
  var fys = {};
  months.forEach(function(ym){ fys[fyStartYear(ym)] = 1; });
  return Object.keys(fys).map(Number).sort(function(a, b){ return a - b; });
}
// Periodo inmediato anterior al elegido (mes anterior, o anio fiscal anterior).
function ratioPrevPeriod(mode, period) {
  if (mode === 'month') {
    var y = +String(period).slice(0, 4), mo = +String(period).slice(5, 7) - 1;
    if (mo < 1) { mo = 12; y -= 1; }
    return y + '-' + (mo < 10 ? '0' + mo : '' + mo);
  }
  return +period - 1;
}
// { grupo_pnl: {points, gb} } sumado sobre el periodo pedido.
function ratioAggByProduct(rows, mode, period) {
  var out = {};
  rows.forEach(function(r){
    var ym = (r.processing_date || '').slice(0, 7);
    if (ym.length !== 7) return;
    var inPeriod = mode === 'month' ? (ym === period) : (fyStartYear(ym) === period);
    if (!inPeriod) return;
    var g = r.grupo_pnl || 'Sin clasificar';
    if (!out[g]) out[g] = { points: 0, gb: 0 };
    out[g].points += (+r.points || 0);
    out[g].gb     += (+r.gb || 0);
  });
  return out;
}
// Ratio agregado ponderado de TODOS los grupos juntos (incl. "Sin clasificar") —
// para la barra "Total" al borde del grafico.
function ratioTotal(agg) {
  var p = 0, g = 0;
  Object.keys(agg).forEach(function(k){ p += agg[k].points; g += agg[k].gb; });
  return g ? p / g : 0;
}
function ratioLabel(mode, period) { return mode === 'month' ? fmtMonthLbl(period) : ('FY ' + period); }

// <option>s del selector de periodo — fija RATIO_PERIOD[suffix] a un default
// valido (el ultimo periodo con datos) como efecto de borde, para que la 2da
// pasada de renderMetrics (que arma los charts) lo encuentre ya resuelto.
function ratioPeriodOptionsHtml(suffix, country) {
  var mode = getRatioMode(suffix);
  var periods = ratioAvailablePeriods(ratioRows(country), mode);
  if (!periods.length) { delete RATIO_PERIOD[suffix]; return '<option value="">—</option>'; }
  var sel = RATIO_PERIOD[suffix];
  if (sel === undefined || periods.indexOf(mode === 'month' ? sel : +sel) === -1) sel = periods[periods.length - 1];
  RATIO_PERIOD[suffix] = sel;
  return periods.map(function(p){
    return '<option value="' + p + '"' + (String(p) === String(sel) ? ' selected' : '') + '>' + ratioLabel(mode, p) + '</option>';
  }).join('');
}

// ============================================================
// aria-pressed en los toggles .seg-btn: se re-renderizan por innerHTML, asi que

// Pestaña "Input proyecciones" — los supuestos que cargó Control de Gestión en
// Input_budget.xlsx / Input_runrate.xlsx, tal como llegan en loyalty_proyecciones.json
// (una tabla por solapa, meses del Excel en columnas) y, como vista principal, los mismos
// inputs medidos en el Datalake (loyalty_inputs_real.json + acum + penet + ssp). Solo muestra: no calcula nada
// nuevo. Lo que se compara contra el real vive en Métricas de Negocio (3ra barra).
// ============================================================
var IP_STATE = { fuente: 'real', esc: 'budget', country: 'total',
                 ap: { marca: false, lob: false, canal: false, producto: true, viaje: false } };
// sum: el bloque es aditivo (puntos) → subtotal por país, TOTAL y columna Total FY.
// Precios, ratios y penetración no se suman: columna Promedio (simple, meses con dato).
var IP_BLOQUES = [
  { k: 'acum_partner',   t: 'Cobrand / Partners — puntos acumulados',          sol: 'Cobrands_Partners', unit: 'pts',   sum: true,  lbl: 'Partner' },
  { k: 'precio_partner', t: 'Cobrand / Partners — precio de facturación',      sol: 'Cobrands_Partners', unit: 'usdpt', sum: false, lbl: 'Partner' },
  { k: 'reden',          t: 'Redenciones — puntos por tipo',                    sol: 'Redenciones',       unit: 'pts',   sum: true,  lbl: 'Tipo de punto' },
  { k: 'breakage',       t: 'Breakage — puntos vencidos',                       sol: 'Breakage',          unit: 'pts',   sum: true,  lbl: '' },
  { k: 'ssp',            t: 'SSP y precio del punto pasivo',                    sol: 'SSP_PrecioPasivo',  unit: 'usdpt', sum: false, lbl: 'Métrica' },
  { k: 'ratio',          t: 'Regla de acumulación — B2C-SITE',                  sol: 'Ratio_acumulacion', unit: 'ratio', sum: false, lbl: 'Producto · viaje' },
  { k: 'penet',          t: 'Penetración del GB — B2C-SITE',                    sol: 'Penetracion_GB',    unit: 'pct',   sum: false, lbl: 'Producto · viaje' }
];
var IP_UNIT_LBL = { pts: 'puntos', usdpt: 'USD por punto', ratio: 'puntos por USD de GB', pct: '% del GB que acumula' };
function ipSet(k, v) { IP_STATE[k] = v; renderInputProy(); }
function ipToggleAp(dim) { IP_STATE.ap[dim] = !IP_STATE.ap[dim]; renderInputProy(); }
function ipEsc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function ipFmt(unit, v) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  if (unit === 'pts')   return fmtCount(v);
  if (unit === 'int')   return Math.round(v).toLocaleString('es-AR');
  if (unit === 'usdpt') return fmtPricePerPt(v);

}
// Índice escenario → bloque → país → clave → ym → valor, conservando el orden del Excel.
var _IPIDX = null;
function ipIdx() {
  if (_IPIDX && _IPIDX.src === RAW.proy) return _IPIDX;

  expand(RAW.proy).forEach(function(p) {

    var c = (b[p.pais] = b[p.pais] || {});

    (months[p.escenario] = months[p.escenario] || {})[p.ym] = 1;

function renderInputProy() {

// ---- Datos reales: los inputs de la proyección medidos en el Datalake (y las órdenes del P&L).
// Todas las métricas con el MISMO formato de tabla: Métrica · Marca · LoB · Canal · País ·
// Producto · Viaje, los mismos meses en columnas (todos los meses con dato hasta el último
// cerrado) y una fila TOTAL. Cada valor se calcula sumando numerador y denominador de la celda
// (nunca promediando ratios), así cualquier apertura cierra.
//   Dimensión cerrada con el selector Apertura → "Todos" (agregado).
//   Dimensión que la métrica no tiene → "—" (ej. la penetración no viene por canal).
var IP_DIMS = ['marca', 'lob', 'canal', 'dk', 'producto', 'viaje'];
var IP_DIM_LBL = { marca: 'Marca', lob: 'LoB', canal: 'Canal', dk: 'País', producto: 'Producto / Partner', viaje: 'Viaje' };
var IP_ORD = {
  marca: ['Despegar', 'Best Day', 'Viajes Falabella', 'Viajanet'],
  lob: ['B2C', 'B2B2C', 'B2B'],
  canal: ['Site', 'App', 'On', 'Offline', 'Call Center', 'Sucursales'],
  viaje: ['Domestic', 'International']
};
var IP_LBL = { 'on': 'On', 'call center': 'Call Center', 'sucursales': 'Sucursales', 'site': 'Site', 'app': 'App',
               'offline': 'Offline', 'domestic': 'Domestic', 'international': 'International',
               'b2c': 'B2C', 'b2b2c': 'B2B2C', 'b2b': 'B2B', 'n/d': 'N/D' };
// Nombre de display homogéneo entre fuentes (el P&L viene en minúscula, el Datalake no).
function ipLbl(v) {
  var lc = String(v === undefined || v === null ? '' : v).trim().toLowerCase();
  if (!lc) return 'N/D';
  if (IP_LBL[lc]) return IP_LBL[lc];
  return lc.replace(/(^|[\s.])\w/g, function(c){ return c.toUpperCase(); });
}
function ipProd(v) {
  var lc = String(v || '').trim().toLowerCase();
  for (var i = 0; i < OR_PRODUCTS.length; i++) if (OR_PRODUCTS[i].toLowerCase() === lc) return OR_PRODUCTS[i];
  return v ? String(v) : 'N/D';
}
function ipOrd(dim, v) {
  if (v === 'Todos' || v === '—') return -1;
  if (dim === 'dk') { var k = COUNTRY_DATAKEYS.indexOf(v); return k !== -1 ? k : 99; }
  if (dim === 'producto') { var i = OR_PRODUCTS.indexOf(v); return i !== -1 ? i : (v === 'Sin clasificar' || v === 'N/D' ? 98 : 50); }
  if (!IP_ORD[dim]) return 0;
  var j = IP_ORD[dim].indexOf(v); return j !== -1 ? j : (v === 'N/D' ? 98 : 50);
}
// Una tabla de métrica. M = { name, unit, kind: 'ratio'|'sum', dims: [dims que tiene la métrica] }.
// rows: { dk, ym, marca, lob, canal, producto, viaje, n, d } ya normalizadas.
function ipMetricTable(M, rows, ms, countries) {
  var by = {};
  rows.forEach(function(r) {
    if (countries.indexOf(r.dk) === -1 || ms.indexOf(r.ym) === -1) return;
    var parts = IP_DIMS.map(function(dim) {
      if (dim === 'dk') return r.dk;
      if (M.dims.indexOf(dim) === -1) return '—';
      return IP_STATE.ap[dim] ? r[dim] : 'Todos';
    });
    var k = parts.join('|');
    var g = (by[k] = by[k] || { parts: parts, v: {} });
    var c = (g.v[r.ym] = g.v[r.ym] || { n: 0, d: 0 });
    c.n += r.n; c.d += r.d;
  });
  var groups = Object.keys(by).map(function(k){ return by[k]; });
  if (!groups.length) return '<div class="empty">Sin datos para el filtro elegido.</div>';
  groups.sort(function(a, b) {
    for (var i = 0; i < IP_DIMS.length; i++) {
      var x = ipOrd(IP_DIMS[i], a.parts[i]), y = ipOrd(IP_DIMS[i], b.parts[i]);
      if (x !== y) return x - y;
      if (a.parts[i] !== b.parts[i]) return a.parts[i] < b.parts[i] ? -1 : 1;
    }
    return 0;
  });
  function val(c) {
    if (!c) return null;
    if (M.kind === 'sum') return c.n || null;
    return c.d ? c.n / c.d : null;
  }
  function cells(v) {
    var tot = { n: 0, d: 0 };
    var h = ms.map(function(ym) {
      var c = v[ym], x = val(c);
      // Período de un ratio: solo meses con denominador (ej. puntos de un mes sin órdenes del P&L no inflan el total)
      if (c && (M.kind === 'sum' || c.d)) { tot.n += c.n; tot.d += c.d; }
      return '<td class="vf' + (x === null ? ' neu' : '') + '">' + ipFmt(M.unit, x) + '</td>';
    }).join('');
    return h + '<td class="sep"></td><td class="vf ip-tot">' + ipFmt(M.unit, val(tot)) + '</td>';
  }
  var name = '<td class="lc ip-met">' + ipEsc(M.name) + '</td>';
  var h = '<div class="tbl-scroll"><table class="pnl ip-tbl"><thead><tr><th class="lc">Métrica</th>'
        + IP_DIMS.map(function(dim){ return '<th class="lc">' + IP_DIM_LBL[dim] + '</th>'; }).join('')
        + ms.map(function(ym){ return '<th>' + fmtMonthLbl(ym) + '</th>'; }).join('')
        + '<th class="sep"></th><th>' + (M.kind === 'sum' ? 'Total período' : 'Período') + '</th></tr></thead><tbody>';
  var all = {};
  groups.forEach(function(g) {
    h += '<tr>' + name + g.parts.map(function(p, i) {
           return '<td class="lc">' + ipEsc(IP_DIMS[i] === 'dk' ? varCountryObj(p).label : p) + '</td>';
         }).join('') + cells(g.v) + '</tr>';
    Object.keys(g.v).forEach(function(ym){ var c = (all[ym] = all[ym] || { n: 0, d: 0 }); c.n += g.v[ym].n; c.d += g.v[ym].d; });
  });
  if (groups.length > 1) {
    h += '<tr class="grand-total">' + name + '<td class="lc" colspan="' + IP_DIMS.length + '">TOTAL</td>' + cells(all) + '</tr>';
  }
  return h + '</tbody></table></div>';
}
function ipCard(title, sub, body) {
  return '<div class="bk-card"><div class="bk-hdr">' + title + (sub ? ' <span class="ip-unit">· ' + sub + '</span>' : '') + '</div>' + body + '</div>';
}
function ipPending(title, why) {
  return ipCard(title, 'pendiente', '<div class="empty">' + why + '</div>');
}
function ipRow(dk, ym, o, n, d) {
  return { dk: dk, ym: ym, marca: ipLbl(o.marca), lob: ipLbl(o.lob), canal: ipLbl(o.canal),
           producto: ipProd(o.producto), viaje: ipLbl(o.viaje), n: n, d: d };
}
var _IPREAL = null;
function ipRealRows() {
  if (_IPREAL && _IPREAL.src === RAW.inputs_real) return _IPREAL.rows;
  var rows = [];
  expand(RAW.inputs_real).forEach(function(r) {
    var dk = ISO_TO_DATAKEY[(r.country_code || '').toLowerCase()];
    if (!dk) return;
    var x = ipRow(dk, r.ym, r, +r.num || 0, +r.den || 0);
    x.factor = r.factor;
    rows.push(x);
  });
  _IPREAL = { src: RAW.inputs_real, rows: rows };
  return rows;
}
// Órdenes reales del P&L (loyalty_orders_real.json): d = órdenes.
function ipOrderRows() {
  return expand(RAW.orders_real).map(function(r) {
    return ipRow(String(r.Pais || '').toLowerCase(), String(r.Fecha || '').substring(0, 7),
                 { marca: r.Marca, lob: r.LoB, canal: r.Canal, producto: r.Producto, viaje: r.Viaje }, 0, +r.Orders || 0);
  }).filter(function(r){ return COUNTRY_DATAKEYS.indexOf(r.dk) !== -1; });
}
// Puntos y USD de Cobrand / Partners por país × partner, desde acumulaciones (con signo:
// las cancelaciones netean). El partner va en la columna Producto / Partner.
function ipPartnerRows(prog) {
  var out = [];
  [RAW.acum_ly, RAW.acum_cy].forEach(function(src) {
    expand(src).forEach(function(r) {
      if (getProgramFromAcum(r) !== prog) return;
      var dk = ISO_TO_DATAKEY[(r.country_code || '').toLowerCase()];
      if (!dk) return;
      out.push({ dk: dk, ym: (r.processing_date || '').substring(0, 7), producto: r.partner || 'N/D',
                 pts: +r.points || 0, usd: +r.acum_usd_precio || 0 });
    });
  });
  return out;
}

function ipRenderReal(h) {
  var last = proyLastClosedYm();
  var countries = IP_STATE.country === 'total' ? COUNTRY_DATAKEYS : [IP_STATE.country];
  var real = RAW.inputs_real ? ipRealRows() : [];
  var ssp = (RAW.ssp || {}).data || {};
  function bk(dk, ym) { return +((ssp[dk] || {})[ym] || {}).breakage_esperado || 0; }
  function fac(f) { return real.filter(function(r){ return r.factor === f; }); }

  var sspRed = fac('ssp_red');
  var sspFac = sspRed.map(function(r){ var x = Object.assign({}, r); x.n = r.n * (1 - bk(r.dk, r.ym)); return x; });
  // Penetraciones para proyectar: solo Site + App (la proyección se abre así y en canales
  // offline no se redime). El indicador genérico (heatmap de Pasaporte D!) usa todos los canales.
  // Con un JSON viejo sin canal no se filtra (todo quedaría afuera).
  var penRaw = expand(RAW.penet), penCanal = penRaw.some(function(r){ return r.canal; });
  function penOnline(r) { return !penCanal || r.canal === 'Site' || r.canal === 'App'; }
  var pen = penRaw.map(function(r) {
    return ipRow(ISO_TO_DATAKEY[(r.country_code || '').toLowerCase()], (r.ym || '').substring(0, 7),
                 { producto: r.grupo_pnl || 'Sin clasificar', marca: r.marca, lob: r.lob, canal: r.canal, viaje: r.viaje },
                 +r.gb_con_puntos || 0, +r.gb_total || 0);
  }).filter(function(r){ return r.dk && penOnline(r); });
  // Puntos por orden: solo aperturas (al detalle más fino) que tuvieron redenciones en algún mes;
  // así, al cerrar Marca / LoB / Canal, las órdenes de Best Day o B2B no entran al denominador.
  var ptsRed = fac('pts_red');
  function fineKey(r) { return [r.marca, r.lob, r.canal, r.dk, r.producto, r.viaje].join('|'); }
  var conPts = {};
  ptsRed.forEach(function(r){ if (r.n) conPts[fineKey(r)] = 1; });
  var ords = ipOrderRows().filter(function(r){ return conPts[fineKey(r)]; });
  var ptsOrd = ptsRed.concat(ords);
  var cob = ipPartnerRows('Cobrand'), par = ipPartnerRows('Partners');

  // Los mismos meses para todas las tablas: todo lo que hay en alguna fuente hasta el último mes cerrado.
  var mset = {};
  [real, pen, ords, cob, par].forEach(function(a){ a.forEach(function(r){ if (r.ym && r.ym <= last) mset[r.ym] = 1; }); });
  var ms = Object.keys(mset).sort();
  if (!ms.length) return h + '<div class="empty">Todavía no hay datos reales cargados.</div>';

  h += '<div class="proj-note">Valores <strong>reales</strong> de ' + fmtMonthLbl(ms[0]) + ' a ' + fmtMonthLbl(ms[ms.length - 1])
     + ' (último mes cerrado), para actualizar los supuestos de <code>Input_budget.xlsx</code> / <code>Input_runrate.xlsx</code>. '
     + 'Todas las tablas tienen las mismas columnas: <strong>Todos</strong> = dimensión agregada (abrila con <em>Apertura</em>); '
     + '<strong>—</strong> = la métrica no viene con esa apertura. Cada celda suma numerador y denominador (nunca promedia ratios); '
     + '<strong>Período</strong> = ponderado de los meses mostrados. Canal del Datalake: Offline = Call Center + Sucursales; '
     + 'canal del P&amp;L: On = Site + App.</div>';

  var noReal = '<div class="empty">Falta <code>loyalty_inputs_real.json</code> en Drive: se genera en la próxima corrida de <code>loyalty_sync.py</code>.</div>';
  var DL = ['marca', 'lob', 'canal', 'producto', 'viaje'];
  function card(M, rows, sub, missing) {
    return ipCard(M.name, sub, missing || ipMetricTable(M, rows, ms, countries));
  }
  // 1-2. SSP de redención y SSP
  h += card({ name: 'SSP de redención', unit: 'usdpt', kind: 'ratio', dims: DL }, sspRed,
            'USD de descuento / puntos redimidos (Pasaporte D! + Cobrand + Partners) · USD por punto', RAW.inputs_real ? '' : noReal);
  h += card({ name: 'SSP', unit: 'usdpt', kind: 'ratio', dims: DL }, sspFac,
            'SSP de redención × (1 − breakage esperado del país) · USD por punto', RAW.inputs_real ? '' : noReal);
  // 3. Precio del pasivo
  h += ipPending('Precio del punto pasivo', 'Sin definición del valor real todavía: falta que Control de Gestión defina cómo se calcula.');
  // 4. Penetración GB (solo país × producto)
  h += card({ name: 'Penetración del GB (acumulación)', unit: 'pct', kind: 'ratio', dims: DL }, pen,
            '% del GB Despegar B2C (base P&amp;L) con acumulación de puntos · <strong>solo Site + App</strong> (apertura de la proyección; el indicador general de Pasaporte D! usa todos los canales) · Uruguay va en Other Countries',
            pen.length ? '' : '<div class="empty">Sin datos de penetración.</div>');
  // 4b. Penetración de redenciones: mismo denominador, numerador = GB de reservas con redención (GR)
  var penRed = penRaw.filter(function(r){ return r.gb_con_redencion !== undefined; }).map(function(r) {
    return ipRow(ISO_TO_DATAKEY[(r.country_code || '').toLowerCase()], (r.ym || '').substring(0, 7),
                 { producto: r.grupo_pnl || 'Sin clasificar', marca: r.marca, lob: r.lob, canal: r.canal, viaje: r.viaje },
                 +r.gb_con_redencion || 0, +r.gb_total || 0);
  }).filter(function(r){ return r.dk && penOnline(r); });
  h += card({ name: 'Penetración de redenciones', unit: 'pct', kind: 'ratio', dims: DL }, penRed,
            '% del GB Despegar B2C (base P&amp;L) de reservas en las que se redimieron puntos · <strong>solo Site + App</strong> (solo se redime online) · mismo denominador que la penetración del GB',
            penRed.length ? '' : '<div class="empty">Se genera en la próxima corrida de <code>loyalty_sync.py</code>.</div>');
  // 5-6. Órdenes reales (P&L) y puntos redimidos por orden
  var faltaPo = [];
  if (!RAW.orders_real) faltaPo.push('<code>loyalty_orders_real.json</code> (se genera con <code>py inputs_contables_loyalty.py --upload</code>)');
  if (!ptsRed.length) faltaPo.push('los puntos con apertura del P&amp;L en <code>loyalty_inputs_real.json</code> (próxima corrida de <code>loyalty_sync.py</code>)');
  var poMiss = faltaPo.length ? '<div class="empty">Falta ' + faltaPo.join(' y ') + '.</div>' : '';
  h += card({ name: 'Órdenes (P&L)', unit: 'int', kind: 'sum', dims: DL },
            ords.map(function(r){ var x = Object.assign({}, r); x.n = r.d; x.d = 0; return x; }),
            'órdenes reales de los actuals del P&amp;L, en las aperturas que tuvieron redenciones · el P&amp;L FY26 no trae sep–dic 2025', poMiss);
  h += card({ name: 'Puntos redimidos por orden', unit: 'int', kind: 'ratio', dims: DL }, ptsOrd,
            'puntos redimidos (Pasaporte D! + Cobrand + Partners) / TODAS las órdenes del P&amp;L de la apertura, no solo las que redimieron', poMiss);
  // 7. Regla de acumulación (acumulaciones no traen marca ni LoB)
  h += card({ name: 'Regla de acumulación', unit: 'ratio', kind: 'ratio', dims: ['canal', 'producto', 'viaje'] }, fac('regla'),
            'puntos acumulados / GB de las reservas que acumularon (Pasaporte D!) · puntos por USD', RAW.inputs_real ? '' : noReal);
  // 8-10. Cobrand / Partners: puntos y precio por partner
  var cobPts = cob.map(function(r){ return ipRow(r.dk, r.ym, { producto: r.producto }, r.pts, 0); });
  h += card({ name: 'Puntos Cobrand', unit: 'pts', kind: 'sum', dims: ['producto'] }, cobPts,
            'puntos acumulados netos de cancelaciones, por cobrand', cob.length ? '' : '<div class="empty">Sin acumulación Cobrand.</div>');
  [['Cobrand', cob], ['Partners', par]].forEach(function(x) {
    var rows = x[1].map(function(r){ return ipRow(r.dk, r.ym, { producto: r.producto }, r.usd, r.pts); });
    h += card({ name: 'Precio de puntos ' + x[0], unit: 'usdpt', kind: 'ratio', dims: ['producto'] }, rows,
              'USD a precio de facturación (Input_Precios.xlsx, con FX del mes) / puntos acumulados · USD por punto',
              rows.length ? '' : '<div class="empty">Sin acumulación ' + x[0] + '.</div>');
  });
  return h;
}

// ============================================================
// Pestaña "Breakage esperado" (17-oct) — réplica del Excel de Control de Gestión
// ("Breakage Esperado <MM'AA>.xlsx"), calculada en el pipeline (breakage_esperado.py →
// loyalty_breakage_esperado.json). Desde 17-oct es la FUENTE del SSP de facturación y del DRO
// (decisión de Diego). El Sheet Config (pestaña breakage_esperado) queda como referencia y como
// fallback para meses sin cálculo: RAW.ssp.data[país][mes].breakage_sheet.
//   % del mes M = vencidos acumulados hasta M (Non Tender + Cobrand)
//                 / acumulados hasta M − 19 meses (Non Tender + Cobrand + Partners; criterio histórico del Excel)
//   breakage esperado = promedio de los últimos 12 % mensuales
// ============================================================
var BE_STATE = { mes: null };
var BE_TOL_PP = 0.5;   // diferencia calculado vs cargado que se marca
function beSet(k, v) { BE_STATE[k] = v; renderBreakageEsp(); }
function bePct(v) { return v === null || v === undefined || !isFinite(v) ? '—' : (100 * v).toFixed(1).replace('.', ',') + '%'; }
function bePp(v) { return v === null || !isFinite(v) ? '—' : (v > 0 ? '+' : '') + v.toFixed(1).replace('.', ',') + ' pp'; }
function beInt(v) { return v === null || v === undefined || !isFinite(v) ? '—' : Math.round(v).toLocaleString('es-AR'); }

function renderBreakageEsp() {
  var el = document.getElementById('panel-breakageesp');
  if (!el) return;
  var h = '<div class="stitle">Breakage esperado — cálculo del ecosystem</div>';
  var rows = expand(RAW.breakage_esp).map(function(r) {
    return { dk: ISO_TO_DATAKEY[String(r.country || '').toLowerCase()], iso: r.country, ym: r.ym, corte: r.corte_acum,
             vnt: +r.venc_nt || 0, vcb: +r.venc_cb || 0, ant: +r.acum_nt || 0, acb: +r.acum_cb || 0,
             pct: r.pct_mes === null ? null : +r.pct_mes, prom: r.prom_12m === null ? null : +r.prom_12m, n: +r.n_meses || 0 };
  }).filter(function(r){ return r.dk; });
  if (!rows.length) {
    el.innerHTML = h + '<div class="empty">Falta <code>loyalty_breakage_esperado.json</code> en Drive: se genera en la próxima corrida de <code>loyalty_sync.py</code>.</div>';
    return;
  }
  var meta = (RAW.breakage_esp || {}).meta || {};
  var ssp = (RAW.ssp || {}).data || {};
  // Valor del Sheet. Con el loyalty_ssp.json nuevo viene en breakage_sheet (breakage_esperado ya es el
  // calculado); con uno viejo (sin breakage_fuente) breakage_esperado todavía es el del Sheet.
  function cargado(dk, ym) {
    var o = (ssp[dk] || {})[ym];
    if (!o) return null;
    var v = o.breakage_fuente !== undefined ? o.breakage_sheet : o.breakage_esperado;
    return v !== undefined && v !== null && v !== '' ? +v : null;
  }
  var paises = COUNTRY_DATAKEYS.filter(function(dk){ return rows.some(function(r){ return r.dk === dk; }); });
  var by = {};
  rows.forEach(function(r){ (by[r.dk] = by[r.dk] || {})[r.ym] = r; });
  // Meses de las tablas: desde que hay valor cargado en el Sheet (2025-01) hasta el último calculado
  var all = rows.map(function(r){ return r.ym; }).filter(function(ym, i, a){ return a.indexOf(ym) === i; }).sort();
  var ms = all.filter(function(ym){ return ym >= '2025-01'; });
  var lastM = ms[ms.length - 1];
  if (!BE_STATE.mes || ms.indexOf(BE_STATE.mes) === -1) BE_STATE.mes = lastM;

  h += '<div class="proj-note"><strong>Cómo se calcula</strong> (réplica del Excel de Control de Gestión, carpeta Cierre/&lt;mes&gt;/Auditoria): '
     + '<strong>% del mes M</strong> = puntos vencidos acumulados hasta M (Non Tender + Cobrand) ÷ puntos acumulados hasta M − ' + (meta.rezago_meses || 19) + ' meses (criterio histórico del Excel) '
     + '(Non Tender + Cobrand + Partners). <strong>Breakage esperado</strong> = promedio de los últimos ' + (meta.ventana || 12) + ' % mensuales. '
     + 'Vencidos: query de breakage desde 2019, clasificados con el Diccionario Point Type del Excel (quedan afuera R&amp;B, Santander 2, Partner, PAD). '
     + 'Acumulados: historia oficial del archivo de cierre hasta ' + fmtMonthLbl(meta.acum_hist_hasta || '2025-12') + ', después las acumulaciones del ecosystem. '
     + 'Ajustes que replica del Excel: Colombia resta el welcome bonus vencido en jun-24 (302.123.640 pts); Perú promedia desde jul-25. '
     + '<strong>Este cálculo es el que usan el SSP de facturación y el DRO del dashboard.</strong> La pestaña <code>breakage_esperado</code> del Sheet Config '
     + 'queda como referencia (y solo se usa en meses sin cálculo); se marcan las diferencias de más de ' + BE_TOL_PP.toString().replace('.', ',') + ' pp contra el Sheet.</div>';

  // 1. Calculado vs cargado vs Δ
  var th = '<thead><tr><th class="lc">País</th><th class="lc">Serie</th>' + ms.map(function(ym){ return '<th>' + fmtMonthLbl(ym) + '</th>'; }).join('') + '</tr></thead>';
  var t1 = '<div class="tbl-scroll"><table class="pnl ip-tbl">' + th + '<tbody>';
  paises.forEach(function(dk) {
    var lbl = ipEsc(varCountryObj(dk).label);
    t1 += '<tr class="subtotal"><td class="lc">' + lbl + '</td><td class="lc">Calculado (el que se usa)</td>'
        + ms.map(function(ym){ var r = (by[dk] || {})[ym]; var v = r ? r.prom : null; return '<td class="vf' + (v === null ? ' neu' : '') + '">' + bePct(v) + '</td>'; }).join('') + '</tr>';
    t1 += '<tr><td class="lc"></td><td class="lc">Sheet Config (referencia)</td>'
        + ms.map(function(ym){ var v = cargado(dk, ym); return '<td class="vf' + (v === null ? ' neu' : '') + '">' + bePct(v) + '</td>'; }).join('') + '</tr>';
    t1 += '<tr><td class="lc"></td><td class="lc">Δ Sheet − calculado</td>'
        + ms.map(function(ym){
            var r = (by[dk] || {})[ym], c = cargado(dk, ym);
            if (!r || r.prom === null || c === null) return '<td class="vf neu">—</td>';
            var d = 100 * (c - r.prom), flag = Math.abs(d) > BE_TOL_PP;
            return '<td class="vf' + (flag ? ' be-flag' : '') + '"' + (flag ? ' title="Diferencia mayor a ' + BE_TOL_PP + ' pp"' : '') + '>' + bePp(d) + '</td>';
          }).join('') + '</tr>';
  });
  t1 += '</tbody></table></div>';
  h += ipCard('Breakage esperado (promedio 12 meses)', 'calculado por el ecosystem (fuente del SSP y del DRO) vs la pestaña del Sheet Config', t1);

  // 2. % mensual
  var t2 = '<div class="tbl-scroll"><table class="pnl ip-tbl"><thead><tr><th class="lc">País</th>' + ms.map(function(ym){ return '<th>' + fmtMonthLbl(ym) + '</th>'; }).join('') + '</tr></thead><tbody>';
  paises.forEach(function(dk) {
    t2 += '<tr><td class="lc">' + ipEsc(varCountryObj(dk).label) + '</td>' + ms.map(function(ym){
      var r = (by[dk] || {})[ym], v = r ? r.pct : null, raro = v !== null && (v > 1 || v < 0);
      return '<td class="vf' + (v === null ? ' neu' : '') + (raro ? ' be-flag' : '') + '"' + (raro ? ' title="Fuera de 0–100%"' : '') + '>' + bePct(v) + '</td>';
    }).join('') + '</tr>';
  });
  t2 += '</tbody></table></div>';
  h += ipCard('% de vencimiento del mes', 'vencidos acumulados hasta el mes ÷ acumulados hasta 19 meses antes · es lo que se promedia', t2);

  // 3. Detalle de un mes
  var ctl = '<div class="var-ctl"><span class="ratio-controls-lbl">Mes</span><select class="ratio-sel" onchange="beSet(\'mes\', this.value)">'
          + ms.slice().reverse().map(function(ym){ return '<option value="' + ym + '"' + (ym === BE_STATE.mes ? ' selected' : '') + '>' + fmtMonthLbl(ym) + '</option>'; }).join('')
          + '</select></div>';
  var t3 = ctl + '<div class="tbl-scroll"><table class="pnl ip-tbl"><thead><tr><th class="lc">País</th>'
         + '<th>Vencidos Non Tender</th><th>Vencidos Cobrand</th><th>Vencidos total</th>'
         + '<th>Acumulados hasta</th><th>Acum. Non Tender</th><th>Acum. Cobrand + Partners</th><th>Acumulados total</th>'
         + '<th>% del mes</th><th>Promedio 12m</th><th>Sheet</th></tr></thead><tbody>';
  paises.forEach(function(dk) {
    var r = (by[dk] || {})[BE_STATE.mes];
    if (!r) return;
    t3 += '<tr><td class="lc">' + ipEsc(varCountryObj(dk).label) + '</td>'
        + '<td class="vf">' + beInt(r.vnt) + '</td><td class="vf">' + beInt(r.vcb) + '</td><td class="vf ip-tot">' + beInt(r.vnt + r.vcb) + '</td>'
        + '<td class="vf">' + fmtMonthLbl(r.corte) + '</td>'
        + '<td class="vf">' + beInt(r.ant) + '</td><td class="vf">' + beInt(r.acb) + '</td><td class="vf ip-tot">' + beInt(r.ant + r.acb) + '</td>'
        + '<td class="vf">' + bePct(r.pct) + '</td><td class="vf ip-tot">' + bePct(r.prom) + (r.prom !== null && r.n < 12 ? ' <span class="ip-unit">(' + r.n + ' m)</span>' : '') + '</td>'
        + '<td class="vf">' + bePct(cargado(dk, BE_STATE.mes)) + '</td></tr>';
  });
  t3 += '</tbody></table></div>';
  h += ipCard('Detalle del cálculo', 'numerador y denominador por país, para cruzar contra las solapas del Excel', t3);

  if (meta.generated_at) h += '<div class="proj-note">Calculado el ' + ipEsc(String(meta.generated_at).replace('T', ' ').substring(0, 16)) + ' · datos hasta ' + fmtMonthLbl(meta.hasta || lastM) + '.</div>';
  el.innerHTML = h;
}

// ---- Cargado en el Excel: los supuestos tal como están en Input_budget / Input_runrate
function ipRenderExcel(h) {
  var meta = (RAW.proy || {}).meta || {}, ix = ipIdx();
  h += '<div class="var-ctl"><span class="ratio-controls-lbl">Escenario</span><div class="seg seg-sm">'
     + ['budget', 'runrate'].map(function(e) {
         var dis = !ix.idx[e];
         return '<button class="seg-btn' + (IP_STATE.esc === e ? ' active' : '') + '" type="button"' + (dis ? ' disabled title="Sin archivo cargado"' : '')
              + ' onclick="ipSet(\'esc\',\'' + e + '\')">' + scenarioLabel(e) + '</button>';
       }).join('') + '</div></div>';

  // Fuente: OneDrive (lo que edita Control de Gestión) o la copia del repo (fallback)
  var src = (meta.fuentes || {})[IP_STATE.esc] || '';
  var file = IP_STATE.esc === 'budget' ? 'Input_budget.xlsx' : 'Input_runrate.xlsx';
  var origen = !src ? 'sin archivo' : /onedrive/i.test(src) ? 'OneDrive de Control de Gestión' : 'copia del repo (fallback, puede estar desactualizada)';
  h += '<div class="proj-note"><strong>' + file + '</strong> · ' + origen
     + (meta.generated_at ? ' · leído el ' + meta.generated_at.replace('T', ' ').substring(0, 16) : '')
     + '. Se edita en OneDrive (<code>Control de Gestión - Loyalty/Loyalty_Ecosystem/</code>); el sync lo levanta en la próxima corrida, o al momento con <code>py proyecciones.py --upload</code>. '
     + 'Filas de "Other Countries" no se muestran (no tienen pestaña de país).</div>';
  if ((meta.warnings || []).length) {
    h += '<div class="banner warning"><div class="bt"><strong>Avisos de la última lectura:</strong> ' + meta.warnings.map(ipEsc).join(' · ') + '</div></div>';
  }
  var data = ix.idx[IP_STATE.esc];
  if (!data) {
    return h + '<div class="empty">' + file + ' todavía no está cargado. Cuando Control de Gestión lo suba a OneDrive con las mismas solapas que Input_budget.xlsx, aparece acá en la próxima corrida del sync.</div>';
  }
  var months = Object.keys(ix.months[IP_STATE.esc] || {}).sort();
  var countries = IP_STATE.country === 'total' ? COUNTRY_DATAKEYS : [IP_STATE.country];

  IP_BLOQUES.forEach(function(B) {
    var blk = data[B.k] || {};
    var ks = countries.filter(function(dk){ return blk[dk]; });
    h += '<div class="bk-card"><div class="bk-hdr">' + B.t + ' <span class="ip-unit">· solapa ' + B.sol + ' · ' + IP_UNIT_LBL[B.unit] + '</span></div>';
    if (!ks.length) { h += '<div class="empty">Sin datos para ' + (IP_STATE.country === 'total' ? 'ningún país' : varCountryObj(IP_STATE.country).label) + ' en esta solapa.</div></div>'; return; }
    h += '<div class="tbl-scroll"><table class="pnl ip-tbl"><thead><tr><th class="lc">' + (countries.length > 1 ? 'País' + (B.lbl ? ' / ' + B.lbl.toLowerCase() : '') : (B.lbl || 'País')) + '</th>'
       + months.map(function(ym){ return '<th>' + fmtMonthLbl(ym) + '</th>'; }).join('')
       + '<th class="sep"></th><th>' + (B.sum ? 'Total FY' : 'Promedio') + '</th></tr></thead><tbody>';
    function cells(vals) {
      var tot = 0, n = 0;
      var out = months.map(function(ym) {
        var v = vals[ym];
        if (v === undefined) return '<td class="vf neu">—</td>';
        tot += v; n++;
        return '<td class="vf">' + ipFmt(B.unit, v) + '</td>';
      }).join('');
      return out + '<td class="sep"></td><td class="vf ip-tot">' + (n ? ipFmt(B.unit, B.sum ? tot : tot / n) : '—') + '</td>';
    }
    function sumVals(objs) {
      var s = {};
      objs.forEach(function(o){ Object.keys(o).forEach(function(ym){ s[ym] = (s[ym] || 0) + o[ym]; }); });
      return s;
    }
    var all = [];
    ks.forEach(function(dk) {
      // Claves en 0 todos los meses (ej. IFOOD en México) no aportan: se ocultan
      var byKey = blk[dk], claves = Object.keys(byKey).filter(function(c){
        return Object.keys(byKey[c]).some(function(ym){ return byKey[c][ym] !== 0; });
      });
      if (!claves.length) return;
      var lblOf = function(c){ return c ? ipEsc(c.split('|').join(' · ')) : 'Puntos vencidos'; };
      var multi = countries.length > 1;
      // Breakage tiene una sola fila por país: en vista de todos los países va directo como fila del país
      if (multi && claves.length === 1 && !claves[0]) {
        h += '<tr><td class="lc">' + varCountryObj(dk).label + '</td>' + cells(byKey[claves[0]]) + '</tr>';
        all.push(byKey[claves[0]]);
        return;
      }
      if (multi) {
        h += B.sum
          ? '<tr class="subtotal"><td class="lc">' + varCountryObj(dk).label + '</td>' + cells(sumVals(claves.map(function(c){ return byKey[c]; }))) + '</tr>'
          : '<tr class="grp-hdr"><td class="lc" colspan="' + (months.length + 3) + '">' + varCountryObj(dk).label + '</td></tr>';
      }
      claves.forEach(function(c) {
        h += '<tr' + (multi ? ' class="or-prod"' : '') + '><td class="lc">' + lblOf(c) + '</td>' + cells(byKey[c]) + '</tr>';
        all.push(byKey[c]);
      });
    });
    if (B.sum && all.length > 1) {
      h += '<tr class="grand-total"><td class="lc">TOTAL</td>' + cells(sumVals(all)) + '</tr>';
    }
    h += '</tbody></table></div></div>';
  });
  h += '<div class="proj-note">Ratio y penetración vienen solo para <strong>B2C-SITE</strong> (el GB de Budget no viene abierto por canal). '
     + 'El Promedio de precios, ratios y penetración es simple sobre los meses con dato (no ponderado por volumen): sirve para leer el supuesto, no para valuar. '
     + 'Las filas en 0 todos los meses no se muestran.</div>';
  return h;
}

// ============================================================
function switchCountry(key) {
  ACTIVE_COUNTRY = key;
  document.querySelectorAll('.ctab[role="tab"]').forEach(function(b){ var on = b.dataset.key === key; b.classList.toggle('active', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
  COUNTRIES.forEach(function(c){
    var p = document.getElementById('panel-' + c.key);
    if (p) p.classList.toggle('hidden', c.key !== key);
  });
  var pp = document.getElementById('panel-pasivo');
  if (pp) pp.classList.toggle('hidden', key !== 'pasivo');
  var pv2 = document.getElementById('panel-variaciones');
  if (pv2) pv2.classList.toggle('hidden', key !== 'variaciones');
  var por = document.getElementById('panel-onerevenue');
  if (por) por.classList.toggle('hidden', key !== 'onerevenue');
  var pip = document.getElementById('panel-inputproy');
  if (pip) pip.classList.toggle('hidden', key !== 'inputproy');
  var pbe = document.getElementById('panel-breakageesp');
  if (pbe) pbe.classList.toggle('hidden', key !== 'breakageesp');
  renderCountry(key);
}

function renderCountry(key) {
  if (key === 'pasivo') { renderPasivo(); return; }
  if (key === 'variaciones') { renderVariaciones(); return; }
  if (key === 'onerevenue') { renderOneRevenue(); return; }
  if (key === 'inputproy') { renderInputProy(); return; }
  if (key === 'breakageesp') { renderBreakageEsp(); return; }
  var c = COUNTRIES.filter(function(x){ return x.key === key; })[0];
  if (!c) return;
  renderPnl('pnl-' + key, c);
  renderMetrics(c, buildMetrics(c));
  syncSegPressed(document.getElementById('panel-' + key));
}

function renderActive() { renderCountry(ACTIVE_COUNTRY); }

// ============================================================
// Data loading
// ============================================================
function onLoaded(key, data) {
  RAW[key] = data;
  LOADED++;
  document.getElementById('loading-text').textContent = 'Cargando... (' + LOADED + '/' + TOTAL + ')';
  if (LOADED >= TOTAL) {
    document.getElementById('loading').classList.add('hidden');
    var meta = (RAW.acum_cy || {}).meta || {};
    document.getElementById('last-sync').textContent = 'Último sync: ' + (meta.generated_at || '—');
    checkStale();
    buildPanels();
    renderActive();
  }
}

// Avisa si los JSON de Drive están viejos (sync agendado caído) O si están
// desparejos (un fallo parcial de subida deja unos frescos y otros stale).
// Mira el generated_at MÁS VIEJO de todos los JSON cargados, no solo acum_cy.
// Archivos opcionales: si faltan (null), NO deben disparar el banner global de
// "carga incompleta" — hoy solo ratio_acum (loyalty_ratio_acumulacion.json aun
// no se subio a Drive con una sync real; el resto del codigo ya degrada a "Sin
// datos" sin romper nada, ver ratioRows/buildRatioBarChart).
var RAW_OPTIONAL = { ratio_acum: 1, ratio_acum_tier: 1, acum_tier: 1, penet: 1, acum_channel: 1, stock_ifood: 1, runrate: 1, proy: 1, pnl_prev: 1, inputs_real: 1, orders_real: 1, breakage_esp: 1 };
function checkStale() {
  var el = document.getElementById('stale-banner');
  var txt = document.getElementById('stale-banner-text');
  var tss = [];
  Object.keys(RAW).forEach(function(k) {
    var g = ((RAW[k] || {}).meta || {}).generated_at;
    if (g) { var t = Date.parse(String(g).replace(' ', 'T')); if (!isNaN(t)) tss.push(t); }
  });
  if (Object.keys(RAW).some(function(k){ return RAW[k] === null && !RAW_OPTIONAL[k]; })) {
    var failed = Object.keys(RAW).filter(function(k){ return RAW[k] === null && !RAW_OPTIONAL[k]; });
    txt.innerHTML = '<strong>Carga incompleta.</strong> No cargaron: ' + failed.join(', ') + ' ' +
      '(ver consola). Algunos números pueden faltar o quedar en cero.';
    el.classList.remove('hidden');
    return;
  }
  if (!tss.length) {
    txt.textContent = 'No se pudo determinar la fecha del último sync de los datos.';
    el.classList.remove('hidden');
    return;
  }
  var oldest = Math.min.apply(null, tss);
  var newest = Math.max.apply(null, tss);
  var horas  = (Date.now() - oldest) / 36e5;
  var spreadDias = (newest - oldest) / 864e5;
  if (spreadDias > 1) {
    txt.innerHTML = '<strong>Datos desparejos.</strong> Los archivos de datos tienen fechas de ' +
      'sync que difieren en ' + Math.round(spreadDias) + ' días — probablemente una subida a Drive ' +
      'quedó a medias. Avisar al equipo de Loyalty.';
    el.classList.remove('hidden');
  } else if (horas > 48) {
    var dias = Math.floor(horas / 24);
    txt.innerHTML = '<strong>Datos desactualizados.</strong> El último sync fue hace ' +
      dias + ' días. El proceso automático puede estar caído — avisar al equipo de Loyalty ' +
      'antes de usar estos números.';
    el.classList.remove('hidden');
  }
}

function onError(key, msg) {
  console.error('[carga]', key, msg);
  RAW[key] = null;
  LOADED++;
  if (LOADED >= TOTAL) {
    document.getElementById('loading').classList.add('hidden');
    checkStale();
    buildPanels();
    renderActive();
  }
}

// Rango por defecto = año fiscal en curso (Abr->Mar), igual que las metricas de negocio.
(function(){
  var now = new Date(), y = now.getFullYear(), fy = now.getMonth() >= 3 ? y : y - 1;
  document.getElementById('f-from').value = fy + '-04';
  document.getElementById('f-to').value = (fy + 1) + '-03';
})();

document.getElementById('f-fmt').addEventListener('change', renderActive);
document.getElementById('f-scenario').addEventListener('change', renderActive);
document.getElementById('f-period').addEventListener('change', renderActive);

// Init — UNA sola llamada server-side (getAllRaw) en vez de ~18 en paralelo:
// 18 ejecuciones concurrentes, cada una con sus propias llamadas a DriveApp,
// agotaban la cuota de ráfaga de Drive ("Error de servicio: Drive") sin que
// el retry individual alcanzara a absorberlo. getAllRaw() las corre todas
// secuencialmente dentro de una sola ejecución, aislando el error de cada
// archivo por separado (ver Código.js).
(function() {
  google.script.run.withSuccessHandler(function(all) {
    Object.keys(all).forEach(function(k) {
      var r = all[k];
      if (r.ok) onLoaded(k, r.data); else onError(k, r.error);
    });
  }).withFailureHandler(function(e) {
    // Falla total e inesperada de getAllRaw (no debería pasar: cada key ya
    // se aisla adentro) — marcar todo como error para no dejar la pantalla
    // de carga colgada.
    Object.keys(RAW_OPTIONAL).concat(
      ['acum_cy','acum_ly','reden_cy','reden_ly','breakage','miembros',
       'club','ifood','baseline','budget','forecast','dict','ssp']
    ).forEach(function(k) { if (!(k in RAW)) onError(k, e.message); });
  }).getAllRaw();
})();
</script>
